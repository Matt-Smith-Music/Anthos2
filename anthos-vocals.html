<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1016">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Anthos Vocals</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{--bg:#0E1016;--ink:#EDEDF2;--mut:#8A93A0;--line:#242833;--acc:#FF6FA5;--acc2:#7DD3FC;--good:#4CE07A;--bad:#FF5A5A;--warn:#FFD84D}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;background:rgba(18,19,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:10px}
#appBack{flex:0 0 auto;display:flex;align-items:center;gap:7px;height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0 12px;background:#0D0F14;color:var(--ink);font:700 14px/1 system-ui,sans-serif;text-decoration:none;border-bottom:1px solid var(--line)}
#appBack .chev{font-size:19px;line-height:1;margin-top:-2px;color:#FF6FA5}
.row{display:flex;align-items:center;gap:8px;flex-basis:100%;min-width:0;flex-wrap:wrap}
.seg{flex:none}
.logo{font-weight:800;font-size:19px;letter-spacing:-0.02em;color:#FF6FA5;flex:none}
.ver{font:600 10px system-ui;color:var(--mut);margin-left:4px;align-self:center;white-space:nowrap}
.btn{background:#1B1D22;border:1px solid #2A2E3A;color:var(--ink);border-radius:10px;padding:8px 12px;font:600 13.5px/1 inherit;font-family:inherit;cursor:pointer;min-height:38px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#E06291,#A6486B);border-color:#FF6FA5}
.btn.grow{flex:1 1 auto;min-width:0;text-overflow:ellipsis;overflow:hidden}
.btn.on{border-color:var(--good);color:var(--good)}
.seg{display:flex;background:#151720;border:1px solid #2A2E3A;border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;border-radius:0;min-height:38px;padding:8px 11px;color:var(--mut);font:600 13px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.seg button.on{background:#1D2226;color:var(--ink)}
.seg.stretch{flex:1 1 auto}.seg.stretch button{flex:1 1 0;padding-left:4px;padding-right:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;padding:2px 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:#1B1D22;color:var(--mut);border-radius:999px;padding:6px 11px;font:700 12.5px system-ui,sans-serif;cursor:pointer;min-height:32px}
.tabs button.on{background:#4a2340;border-color:#FF6FA5;color:#ffd6ee}
.tempo{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
input[type=range]{accent-color:var(--acc);width:100px}
body.collapsed .full-only{display:none}
/* landscape on a phone: only the transport row stays, More brings the rest back */
body.squat.collapsed .row.lite{display:none}
body.squat.collapsed header{padding-top:6px;padding-bottom:6px}
#gradeNote{font-size:11.5px;line-height:1.35;color:var(--mut);padding:4px 14px 6px;border-bottom:1px solid var(--line);background:rgba(18,19,24,.9)}
#gradeNote b{color:var(--ink)}
body.collapsed #gradeNote{display:none}
#prog{height:22px;background:#181A20;border-bottom:1px solid var(--line);cursor:pointer;position:relative;flex:none;touch-action:pinch-zoom}
#progFill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,var(--acc),#F2A6D6)}
#progTicks{position:absolute;inset:0;pointer-events:none}
#progTicks i{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}
#loopBar{height:22px;background:#10121A;border-bottom:1px solid var(--line);cursor:pointer;position:relative;flex:none;touch-action:pinch-zoom}
#loopHint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);pointer-events:none}
#loopRegion{position:absolute;top:0;bottom:0;display:none;background:rgba(232,107,184,.3);border-left:2px solid var(--acc);border-right:2px solid var(--acc);pointer-events:none}
#loopClear{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:none;background:#2A1520;border:1px solid var(--acc);color:var(--acc);border-radius:6px;width:22px;height:18px;line-height:1;font-size:11px;padding:0;cursor:pointer}
#bLoop.on{border-color:var(--acc);color:var(--acc)}
#stage{flex:1;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pinch-zoom}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:#1B1D22EE;border:1px solid #2E3340;padding:9px 14px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
#celeb{position:fixed;inset:0;background:rgba(6,9,16,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
#celeb[hidden]{display:none}
#celebCard{background:linear-gradient(180deg,#1B1D22,#14161B);border:1px solid #35415C;border-radius:20px;padding:24px 28px;text-align:center;max-width:360px;width:100%}
#celebEmoji{font-size:40px}#celebCard h2{margin:8px 0 4px;font-size:22px}#celebText{margin:2px 0 6px;color:var(--mut);font-size:14px;line-height:1.4}
#celebStars{font-size:18px;margin:6px 0;letter-spacing:2px}#celebPts{font-size:17px;font-weight:800;color:var(--warn);margin:2px 0 14px}
select.btn{appearance:auto}
</style>

<style id="anthosSkin">
:root{--skPanel:#171B1E;--skPanel2:#1D2226;--skLine:#2A3136;--skInk:#EEF0F2;--skMut:#8E98A3;--skAcc:#FF6FA5;--skAccL:#FF97BE;--skAccD:#C75781;--skOn:#15130E}
button.btn,button.go,button.ghost,button.chip,button.primary,button.play,button.subbtn,button.switch-btn,button.lvlchip,button.bigbtn,button.opt,button.nav,button.reveal,button.seg-btn,button.again,button.mix,button.rndbtn,button.deg,button.flashcard,.scoperow button,.seg button,.panel .primary,.panel .ghost{border-radius:11px!important;font-weight:700!important;-webkit-tap-highlight-color:transparent;transition:transform .05s,border-color .12s,color .12s;font-family:inherit}
button.chip{border-radius:9px!important}
button.seg-btn,.scoperow button,.seg button{border-radius:8px!important}
.seg{border-radius:10px!important;overflow:hidden}
button.btn:active,button.go:active,button.ghost:active,button.chip:active,button.primary:active,button.play:active,button.subbtn:active,button.switch-btn:active,button.lvlchip:active,button.bigbtn:active,button.opt:active,button.nav:active,button.reveal:active,button.seg-btn:active,button.again:active,button.mix:active,button.rndbtn:active,button.deg:active,button.flashcard:active,.scoperow button:active,.seg button:active,.panel .primary:active,.panel .ghost:active{transform:translateY(1px)}
button.go:not(.alt),button.btn.primary,button.primary,button.play,button.bigbtn,button.switch-btn.on,.panel .primary{background:linear-gradient(180deg,#FF97BE,#C75781)!important;border:1px solid #FF6FA5!important;color:#15130E!important;box-shadow:0 1px 0 rgba(0,0,0,.35);text-shadow:none!important}
button.go:not(.alt):disabled,button.btn.primary:disabled,button.primary:disabled,button.play:disabled,button.bigbtn:disabled,button.switch-btn.on:disabled,.panel .primary:disabled{opacity:.4!important}
button.reveal{border:1px solid var(--skLine)!important;background:var(--skPanel2)!important;color:var(--skAcc)!important}
button.go.alt,button.ghost,.panel .ghost{background:var(--skPanel2)!important;border:1px solid var(--skLine)!important;color:var(--skInk)!important}
button.go.alt.on,button.go.alt:active,button.ghost:active{border-color:var(--skAcc)!important;color:var(--skAcc)!important}
#appBack .chev{color:#FF6FA5!important}
</style>
<style id="psLinkStyle">.psLink{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:99999;font:700 12px/1 system-ui,sans-serif;color:var(--skAcc,#FFD84D);text-decoration:none;border:1px solid var(--skLine,#2A3136);border-radius:999px;padding:7px 10px;background:#0C0E10;white-space:nowrap}.psLink:active{transform:translateY(1px)}</style>
</head>

<header>
  <div class="row lite"><span class="logo">Anthos Vocals</span><span class="ver">Anthos · 9 Sep b</span><div class="tabs" id="gradeTabs" role="tablist" aria-label="Grade"></div></div>
  <div class="row lite">
    <div class="seg stretch" id="segLib" role="group" aria-label="Library">
      <button data-lib="sight" class="on">Sight singing</button>
      <button data-lib="warm">Warm-ups</button>
      <button data-lib="interval">Intervals</button>
      <button data-lib="song">Songs &amp; MIDI</button>
    </div>
  </div>
  <div class="row lite">
    <select id="patSel" class="btn grow" aria-label="Choose an exercise"></select>
    <button id="bNew" class="btn" title="New exercise at this grade">&#10227; New</button>
    <button id="bLoad2" class="btn" hidden title="Open a .mid file - the top melodic track becomes the exercise">&#128194; Load MIDI</button>
  </div>
  <div class="row">
    <div class="seg" id="segMode" role="group" aria-label="Mode">
      <button data-m="listen" class="on">Listen</button>
      <button data-m="sing">Sing</button>
      <button data-m="wait" title="Wait mode: the music waits on each note until you sing it in tune">Wait</button>
      <button data-m="fuse" title="Playback Fuse: hear a phrase twice, sing it back">Fuse</button>
      <button data-m="record" title="Record: sing it unaccompanied, then hear your take with your pitch drawn on the score">Record</button>
    </div>
    <button id="bPlay" class="btn primary">&#9654; Play</button>
    <button id="bRestart" class="btn" title="Back to the start" aria-label="Restart">&#10226;</button>
    <button id="bBarBack" class="btn" title="Back one bar">&#8249; bar</button>
    <button id="bBarFwd" class="btn" title="Forward one bar">bar &#8250;</button>
    <button id="bMic" class="btn">Mic: off</button>
    <button id="bTake" class="btn" hidden title="Play back your last take">&#9654; My take</button>
    <button id="bMore" class="btn" aria-label="Show all controls">More</button>
  </div>
  <div class="row full-only">
    <div class="tempo">View <div class="seg" id="segView"><button data-v="score" class="on">Score</button><button data-v="grid">Grid</button><button data-v="tuner">Tuner</button></div></div>
    <div class="tempo">Wait <div class="seg" id="segTol"><button data-t="relaxed" class="on">Relaxed</button><button data-t="strict">Strict</button></div></div>
    <div class="tempo">Guide <div class="seg" id="segGuide"><button data-g="on" class="on">Melody</button><button data-g="soft">Soft</button><button data-g="off">Off</button></div></div>
    <div class="tempo">Octave <div class="seg" id="segOct"><button data-o="auto" class="on">Auto</button><button data-o="strict">Strict</button></div></div>
  </div>
  <div class="row full-only">
    <div class="tempo">Tempo <input id="tempo" type="range" min="50" max="130" value="100" step="5"><span id="tval">100%</span></div>
    <div class="tempo">Key <input id="transp" type="range" min="-6" max="6" value="0" step="1"><span id="tpval">0</span></div>
    <div class="tempo">Mic sens. <input id="sens" type="range" min="1" max="10" value="5" step="1"></div>
    <button id="bLoop" class="btn">Loop: off</button>
    <button id="bTick" class="btn" aria-pressed="false">Tick: on</button>
    <button id="bCount" class="btn">Count: 1 bar</button>
    <button id="bLoad" class="btn">Load MIDI</button>
    <button id="bPdf" class="btn" title="Export the exercise as an engraved PDF">PDF</button>
    <input id="file" type="file" accept=".mid,.midi,audio/midi,audio/x-midi" hidden>
    <span id="scoreChip" title="Points">&#11088; 0</span>
  </div>
  <select id="gradeSel" hidden aria-hidden="true"></select>
</header>

<script>
/* ================= PDFCanvas: a canvas-2D-shaped context that writes a vector PDF =================
   Supports what the engravers use: paths (moveTo/lineTo/bezier/quadratic/rect/arc/closePath), fill/stroke/clip,
   fill(Path2D) for glyph outlines (via a registry of the Path2D's SVG data), fillRect, save/restore, translate/scale/
   setTransform, globalAlpha, rgb/rgba/hex colours, lineWidth, fillText with textAlign (Helvetica / Helvetica-Bold).
   Coordinates are canvas coordinates (y down, 1 unit = 1 pt on an A4 page of 595 x 842). */
const PDFCanvas = (() => {
  const PATH_DATA = (typeof WeakMap !== 'undefined') ? new WeakMap() : null;      // Path2D -> SVG path string
  function registerPath(p, d) { if (PATH_DATA && p && typeof p === 'object') PATH_DATA.set(p, d); }
  const fmt = n => { if (!isFinite(n)) n = 0; const s = (Math.round(n * 1000) / 1000).toString(); return s.indexOf('e') >= 0 ? n.toFixed(3) : s; };
  // Helvetica-Bold widths for the characters the apps print (1/1000 em); digits are 556 in both weights
  const WB = {' ': 278, '!': 333, '"': 474, '#': 556, '$': 556, '%': 889, '&': 722, "'": 238, '(': 333, ')': 333, '*': 389, '+': 584, ',': 278, '-': 333, '.': 278, '/': 278,
    '0': 556, '1': 556, '2': 556, '3': 556, '4': 556, '5': 556, '6': 556, '7': 556, '8': 556, '9': 556, ':': 333, ';': 333, '<': 584, '=': 584, '>': 584, '?': 611, '@': 975,
    A: 722, B: 722, C: 722, D: 722, E: 667, F: 611, G: 778, H: 722, I: 278, J: 556, K: 722, L: 611, M: 833, N: 722, O: 778, P: 667, Q: 778, R: 722, S: 667, T: 611, U: 722, V: 667, W: 944, X: 667, Y: 667, Z: 611,
    a: 556, b: 611, c: 556, d: 611, e: 556, f: 333, g: 611, h: 611, i: 278, j: 278, k: 556, l: 278, m: 889, n: 611, o: 611, p: 611, q: 611, r: 389, s: 556, t: 333, u: 611, v: 556, w: 778, x: 556, y: 556, z: 500};
  const WR = {' ': 278, '!': 278, '"': 355, '#': 556, '$': 556, '%': 889, '&': 667, "'": 191, '(': 333, ')': 333, '*': 389, '+': 584, ',': 278, '-': 333, '.': 278, '/': 278,
    '0': 556, '1': 556, '2': 556, '3': 556, '4': 556, '5': 556, '6': 556, '7': 556, '8': 556, '9': 556, ':': 278, ';': 278, '<': 584, '=': 584, '>': 584, '?': 556, '@': 1015,
    A: 667, B: 667, C: 722, D: 722, E: 667, F: 611, G: 778, H: 722, I: 278, J: 500, K: 667, L: 556, M: 833, N: 722, O: 778, P: 667, Q: 778, R: 722, S: 667, T: 611, U: 722, V: 667, W: 944, X: 667, Y: 667, Z: 611,
    a: 556, b: 556, c: 500, d: 556, e: 556, f: 278, g: 556, h: 556, i: 222, j: 222, k: 500, l: 222, m: 833, n: 556, o: 556, p: 556, q: 556, r: 333, s: 500, t: 278, u: 556, v: 500, w: 722, x: 500, y: 500, z: 500};
  const WINANSI = {'\u2013': 150, '\u2014': 151, '\u2018': 145, '\u2019': 146, '\u201c': 147, '\u201d': 148, '\u2022': 149, '\u2026': 133, '\u00b7': 183, '\u00e9': 233, '\u00e8': 232, '\u00e0': 224, '\u00f1': 241, '\u00fc': 252, '\u00f6': 246, '\u00e4': 228, '\u00b0': 176};
  const ASCII = {'\u266d': 'b', '\u266f': '#', '\u266e': '', '\u2669': 'q', '\u2192': '->', '\u00d7': 'x', '\u2019': "'", '\u2018': "'"};
  function toWin(s) { let out = ''; for (const ch of String(s)) { const c = ch.charCodeAt(0); if (c < 128) out += ch; else if (WINANSI[ch] !== undefined) out += String.fromCharCode(WINANSI[ch]); else if (ASCII[ch] !== undefined) out += ASCII[ch]; else if (c < 256) out += ch; else out += '?'; } return out; }
  function parseColor(c) {
    if (!c) return [0, 0, 0, 1]; c = String(c).trim();
    let m;
    if ((m = /^#([0-9a-f]{3})$/i.exec(c))) return [parseInt(m[1][0] + m[1][0], 16) / 255, parseInt(m[1][1] + m[1][1], 16) / 255, parseInt(m[1][2] + m[1][2], 16) / 255, 1];
    if ((m = /^#([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(c))) return [parseInt(m[1].slice(0, 2), 16) / 255, parseInt(m[1].slice(2, 4), 16) / 255, parseInt(m[1].slice(4, 6), 16) / 255, m[2] ? parseInt(m[2], 16) / 255 : 1];
    if ((m = /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/i.exec(c))) return [+m[1] / 255, +m[2] / 255, +m[3] / 255, m[4] === undefined ? 1 : +m[4]];
    if ((m = /^hsla?\(/i.exec(c))) return [0.5, 0.5, 0.5, 1];
    const named = {black: [0, 0, 0], white: [1, 1, 1], red: [1, 0, 0], transparent: [0, 0, 0]};
    const n = named[c.toLowerCase()]; return n ? [n[0], n[1], n[2], c.toLowerCase() === 'transparent' ? 0 : 1] : [0, 0, 0, 1];
  }
  // SVG path data -> PDF path operators (quadratics become cubics; arcs are flattened)
  function svgToOps(d, out) {
    const tok = d.match(/[MmLlHhVvCcSsQqTtAaZz]|-?\d*\.?\d+(?:e-?\d+)?/g) || []; let i = 0, cmd = '', x = 0, y = 0, sx = 0, sy = 0, cx = null, cy = null, qx = null, qy = null;
    const num = () => +tok[i++];
    const emitC = (x1, y1, x2, y2, x3, y3) => { out.push(fmt(x1) + ' ' + fmt(y1) + ' ' + fmt(x2) + ' ' + fmt(y2) + ' ' + fmt(x3) + ' ' + fmt(y3) + ' c'); cx = x2; cy = y2; x = x3; y = y3; qx = qy = null; };
    while (i < tok.length) {
      const t = tok[i]; if (/[A-Za-z]/.test(t)) { cmd = t; i++; if (cmd === 'Z' || cmd === 'z') { out.push('h'); x = sx; y = sy; cx = cy = qx = qy = null; continue; } }
      const rel = cmd === cmd.toLowerCase();
      switch (cmd.toUpperCase()) {
        case 'M': { const nx = num(), ny = num(); x = rel ? x + nx : nx; y = rel ? y + ny : ny; sx = x; sy = y; out.push(fmt(x) + ' ' + fmt(y) + ' m'); cmd = rel ? 'l' : 'L'; cx = cy = qx = qy = null; break; }
        case 'L': { const nx = num(), ny = num(); x = rel ? x + nx : nx; y = rel ? y + ny : ny; out.push(fmt(x) + ' ' + fmt(y) + ' l'); cx = cy = qx = qy = null; break; }
        case 'H': { const nx = num(); x = rel ? x + nx : nx; out.push(fmt(x) + ' ' + fmt(y) + ' l'); cx = cy = qx = qy = null; break; }
        case 'V': { const ny = num(); y = rel ? y + ny : ny; out.push(fmt(x) + ' ' + fmt(y) + ' l'); cx = cy = qx = qy = null; break; }
        case 'C': { const a = [num(), num(), num(), num(), num(), num()]; const [x1, y1, x2, y2, x3, y3] = rel ? [x + a[0], y + a[1], x + a[2], y + a[3], x + a[4], y + a[5]] : a; emitC(x1, y1, x2, y2, x3, y3); break; }
        case 'S': { const a = [num(), num(), num(), num()]; const x1 = cx === null ? x : 2 * x - cx, y1 = cy === null ? y : 2 * y - cy; const [x2, y2, x3, y3] = rel ? [x + a[0], y + a[1], x + a[2], y + a[3]] : a; emitC(x1, y1, x2, y2, x3, y3); break; }

/* ================= exercise generator ================= */
/* A song = {name, key, groups, bpm, notes:[{p,start(beats in 16ths units… we use "slots" of a 16th), len(slots), tie?}], bars} — times are in 16th slots */
function genExercise(g,seedName){
  const P=gradeParams(g);

    else if(barPos===0&&chance(0.12)&&P.vals.indexOf(16)>=0&&S>=16) cell=[16];
    else if(barPos===0&&chance(0.15)&&P.vals.indexOf(12)>=0&&S===12) cell=[12];

    for(let len of cell){

}

          if(!micOn&&now()-gateSince>1.2&&!gateHinted){ gateHinted=true; toast('Wait mode needs the mic \u2014 or tap the screen for each note') }

    }
    /* melody voices */
    const inResp=song.fuseInfo&&songTime/song.slot>=song.fuseInfo.respSlot;
    while(trigIdx<song.notes.length&&song.notes[trigIdx].start*song.slot<=target){ const n=song.notes[trigIdx]; trigIdx++; if(n.rest) continue;
      const g=(mode==='fuse')?(inResp?0:0.32):mode==='record'?0:(mode==='sing'||mode==='wait')?(guide==='on'?0.32:guide==='soft'?0.1:0):0.32;
      if(g>0) voices.push(voice(pitchOf(n),n.vel||90,(n.len*song.slot)/rate*0.95,g)) }
    songTime=target;
    if(tickOn||mode==='fuse'){ while(beatIdx<song.beats.length&&song.beats[beatIdx].t<=songTime){ tickSound(song.beats[beatIdx].accent); beatIdx++ } }
    /* collect pitch samples for the current note */
    const idx=currentNoteIndex();
    if(idx>=0&&(mode==='sing'||mode==='wait'||mode==='record'||(mode==='fuse'&&inResp))){ const n=song.notes[idx]; const st=noteStats[idx]; const frac=(songTime/song.slot-n.start)/n.len;
      if(frac>0.15){ st.total++; if(micOn&&sung.voiced){ const c=centsOff(sung.midi,pitchOf(n)); st.samples.push(c); } } }
    if(micOn&&sung.voiced&&songTime>=0){ const tgt=idx>=0?pitchOf(song.notes[idx]):null; let m=sung.midi; let c=0; if(tgt!=null){ c=centsOff(m,tgt); if(octaveMode==='auto') m=tgt+c/100 } trail.push({t:songTime,m,c}); if(trail.length>6000) trail.shift() }
    if(loopOn&&loopB>loopA+0.15&&songTime>=loopB){ seek(loopA) }
    if(songTime>=song.duration){ playing=false; stopVoices(); updateUI(); if(mode==='fuse'&&fuse.active) fuseFinish(); else if(mode==='record'){ recStop(); showResult('Your take', micOn?' \u2014 tap \u25b6 My take to hear it with your pitch on the score':'') } else if(mode==='sing'||mode==='wait') showResult(); else toast('Finished \u2014 '+song.name) }
  }
  if(voices.length>64) voices.splice(0,voices.length-32);
  draw(); $('progFill').style.width=song?(100*Math.max(0,Math.min(1,songTime/song.duration)))+'%':'0%';
}

/* ================= PDF: the exercise as a printed melody ================= */
function vocalsPDF(){
  if(!song){ toast('Pick an exercise or load a MIDI first'); return; }
  const slot=song.slot, S=song.S||song.groups.reduce((a,b)=>a+b,0); const tp=transpose||0;
  const notes=song.notes.filter(n=>!n.rest).map(n=>({p:n.p+tp,start:n.start*slot,dur:n.len*slot*0.98,tie:!!n.tie}));
  const groups=song.groups; const eight=groups.some(g=>g===6); const sig=eight?{num:groups.length*3,den:8}:{num:groups.length,den:4};
  const per=eight?2:4; const beats=[]; for(let k=0;k*per<song.bars*S+per;k++) beats.push({t:k*per*slot,accent:(k%sig.num)===0});   // crotchet beats, or quavers in x/8
  const key=effKey(); const keySf=key?key.f:0;
  const r=Engraver.printScore({title:song.name||'Vocal exercise',subtitle:'Voice · '+effKeyName(),staves:[{clef:'G',notes}],beats,sig,keySf,GLY,pglyph:(c, g, x, y, s, f) => { c.save(); c.translate(x, y); c.scale(s, f ? s : -s); c.fill(g.p); c.restore(); },sp:6});
  if(!r){ toast('Nothing to print'); return; } Engraver.share(r,toast);
}

<script>
/* Keep the screen awake whenever the app is genuinely in use, so an iPhone's
   auto-lock cannot kill a practice session. "In use" means one of two things:
   the app is making sound (metronome, backing, drill playback, game clicks),
   or the microphone is live - which is the Sight Fuse case, where the student
   reads and plays for minutes without touching the glass and the app itself
   may be nearly silent. Self-contained so it cannot collide with app code. */
(function () {
  var QUIET = 4000, POLL = 1500;
  var lastSound = 0, streams = [], lock = null, pending = false;
  function mark() { lastSound = Date.now(); }
  function watch(c) {
    ["createOscillator", "createBufferSource"].forEach(function (fn) {
      if (typeof c[fn] !== "function") return;
      var orig = c[fn].bind(c);
      c[fn] = function () {
        var n = orig.apply(null, arguments);
        if (n && typeof n.start === "function") {
          var st = n.start.bind(n);
          n.start = function () { mark(); return st.apply(null, arguments); };
        }
        return n;
      };
    });
    return c;
  }
  var O = window.AudioContext || window.webkitAudioContext;
  if (O) {
    var W = function () { return watch(Reflect.construct(O, Array.prototype.slice.call(arguments))); };
    W.prototype = O.prototype;
    try { window.AudioContext = W; window.webkitAudioContext = W; } catch (e) {}
  }
  var md = navigator.mediaDevices;
  if (md && typeof md.getUserMedia === "function") {
    var gum = md.getUserMedia.bind(md);
    md.getUserMedia = function () {
      return gum.apply(null, arguments).then(function (s) { streams.push(s); return s; });
    };
  }
  function micLive() {
    for (var i = 0; i < streams.length; i++) {
      var t = streams[i].getAudioTracks ? streams[i].getAudioTracks() : [];
      for (var j = 0; j < t.length; j++) if (t[j].readyState === "live" && t[j].enabled) return true;
    }
    return false;
  }
  function acquire() {
    if (lock || pending || !navigator.wakeLock || !navigator.wakeLock.request) return;
    pending = true;
    navigator.wakeLock.request("screen").then(function (l) {
      pending = false; lock = l;
      l.addEventListener("release", function () { lock = null; });
    }).catch(function () { pending = false; });
  }
  function release() {
    if (!lock) return;
    var l = lock; lock = null;
    try { l.release(); } catch (e) {}
  }
  setInterval(function () {
    var busy = (Date.now() - lastSound < QUIET) || micLive();
    if (busy && !document.hidden) acquire(); else release();
  }, POLL);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) release();
  });
})();
</script>
