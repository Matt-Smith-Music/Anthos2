<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07111f">
<title>World Beats</title>
<style>
:root{
  --sea:#07111f; --deep:#0c1a2e; --panel:#101f35; --line:#1f3352;
  --sand:#e8c88a; --bone:#f3ecdc; --mute:#7d8797;
  --fire:#ff5a3c; --tuned:#2ee6c5; --warn:#ffb340;
  --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--sea);color:var(--bone);
  font:15px/1.35 -apple-system,"Helvetica Neue",Inter,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;padding-top:var(--safe-top)}
.top{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 6px;min-height:56px;background:var(--sea)}
.jamhead{display:flex;align-items:center;gap:8px;padding:6px 10px}
.jamhead button{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;flex:0 0 auto}
.jamttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.jamttl b{font-size:14px;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jamttl span{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#jamChord{font:900 26px/1 "Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;color:var(--tuned);min-width:64px;text-align:right}
.jamchips{display:flex;gap:6px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:none}.jamchips button{flex:0 0 auto;height:30px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--bone)}.jamchips button.on{background:var(--sand);color:#1a1200;border-color:var(--sand)}
.jamrow{display:flex;gap:8px;padding:0 10px 6px}.jamxy{flex:1;height:74px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#132743,#0c1a2e);position:relative;touch-action:none;overflow:hidden}.jamxy i{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--tuned);box-shadow:0 0 12px var(--tuned);transform:translate(-50%,-50%);left:55%;top:55%}.jamxy span{position:absolute;left:8px;bottom:4px;font-size:10px;color:var(--mute)}
.jamctl{display:grid;grid-template-columns:1fr 1fr;gap:6px}.jamctl button.plus{grid-column:1/3;background:#0f3d36;border-color:var(--tuned);color:var(--tuned)}
#mash1{position:absolute;inset:0;z-index:30;background:#000;display:flex;flex-direction:column}#mash1.hidden{display:none}.m1bar{display:flex;align-items:center;gap:8px;padding:6px 10px;padding-top:calc(6px + var(--safe-top));background:var(--sea)}.m1bar button{height:34px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;flex:0 0 auto}.m1bar span{flex:1;min-width:0;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#m1Frame{flex:1;width:100%;border:0;background:#000}.m1vol{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--bone);flex:0 0 auto}.m1vol input{width:90px;accent-color:var(--tuned);margin:0}.jamctl button{height:34px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;color:var(--bone)}
.jamkeys{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:6px;padding:0 10px 8px;touch-action:none;min-height:0}.jamkeys .row{display:grid;gap:5px;min-height:0}
.jamkeys .pad{position:relative;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:12px;color:var(--mute);min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.jamkeys .pad.root{background:#2a2412;border-color:var(--sand);color:var(--sand)}.jamkeys .pad.chord{box-shadow:inset 0 0 0 2px var(--tuned);color:var(--tuned)}.jamkeys .pad.down{background:var(--tuned);color:#04201b;border-color:var(--tuned)}
.flagbg{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .6s;pointer-events:none}
.flagbg.on{opacity:1}
.flagscrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(7,17,31,0) 0,rgba(7,17,31,0) 24%,rgba(7,17,31,.5) 36%,rgba(7,17,31,.78) 58%,rgba(7,17,31,.86) 100%)}
.brand{position:relative;z-index:1;margin-left:88px;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;display:flex;flex-direction:column;gap:2px;font:900 14px/1 "Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;letter-spacing:.02em;color:var(--sand);text-shadow:0 1px 3px rgba(0,0,0,.7)}
.brand small{display:none;font:500 11px/1.2 -apple-system,"Helvetica Neue",sans-serif;letter-spacing:.14em;color:var(--mute);margin-top:3px}
.transport{position:relative;z-index:1;flex:0 0 auto;display:flex;align-items:center;gap:6px}
.transport>button,.bpm{height:48px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.transport>button{padding:0 10px;font-weight:600}
#btnPlay.on{background:var(--sand);color:#1a1200;border-color:var(--sand)}
#btnRec.on{background:var(--fire);color:#fff;border-color:var(--fire);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.bpm{display:flex;align-items:stretch;overflow:hidden}
.bpm button{padding:0 15px;font-weight:700;font-size:20px;min-width:44px}
.bpm #bpmTap{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0 6px;min-width:70px;touch-action:none;cursor:ns-resize;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.bpm #bpmTap b{font-size:21px}.bpm #bpmTap small{font-size:9px;color:var(--mute);letter-spacing:.1em}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
#globe,#skin{width:100%;flex:1;min-height:0;display:block;touch-action:pinch-zoom}
.here{padding:6px 14px 2px}
#hereName{font:900 34px/1 "Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;text-transform:uppercase;letter-spacing:.02em;color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hereMeta{color:var(--mute);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
#hereBlend{height:4px;border-radius:2px;background:var(--line);margin-top:8px;position:relative;overflow:hidden}
#hereBlend i{position:absolute;top:0;bottom:0;left:0;background:var(--fire);transition:width .15s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--bone);font-size:13px;white-space:nowrap}
.chips button.on{background:var(--sand);color:#1a1200;border-color:var(--sand);font-weight:700}
.chips button.tuned{border-color:var(--tuned);color:var(--tuned)}
.gridhead{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;color:var(--mute);font-size:13px}
.gridhead b{color:var(--bone)}
.gridhead button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-size:12px}
#grid{flex:1;overflow:auto;padding:0 8px 8px;-webkit-overflow-scrolling:touch}
.lane{display:grid;grid-template-columns:64px 1fr;gap:6px;align-items:center;margin:4px 0}
.lane .nm{font-size:11px;color:var(--mute);text-align:right;padding-right:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-radius:6px;padding:6px 4px}
.lane .nm.mute{opacity:.35;text-decoration:line-through}
.lane .nm.tuned{color:var(--tuned)}
.steps{display:grid;gap:3px}
.st{aspect-ratio:1;border-radius:5px;background:var(--deep);border:1px solid var(--line);position:relative;min-width:0}
.st.b1{border-color:#2c4468}
.st.h{background:#9b6a3a;border-color:#c98d4e}
.st.a{background:var(--fire);border-color:#ff8a70}
.st.g{background:#4c3d2c;border-color:#7a5a3a}
.st.r{background:var(--warn);border-color:#ffd07a}
.st.t{background:#177a6c;border-color:var(--tuned)}
.st.now{box-shadow:0 0 0 2px var(--bone) inset}
.skinbar{display:flex;gap:8px;padding:8px 12px}
.skinbar button{flex:1;height:54px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.skinbar button.on{background:var(--sand);color:#1a1200;border-color:var(--sand)}
.skinbar button.hold{background:var(--fire);color:#fff;border-color:var(--fire)}
footer{padding:4px 12px calc(6px + var(--safe-bot));display:flex;flex-direction:column;gap:6px}
.big{display:flex;align-items:center;justify-content:center;gap:14px}
.big>button{height:54px;min-width:92px;padding:0 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.big>button small{font-size:10px;font-weight:500;color:var(--mute);letter-spacing:.04em;margin-top:2px}
#btnMash{width:80px;height:80px;min-width:0;padding:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a7a,var(--fire) 55%,#b8321c);border:0;color:#fff;font:900 18px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;letter-spacing:.06em;box-shadow:0 8px 24px rgba(255,90,60,.35)}
#btnMash:active,#btnJump:active,#btnWarp:active{transform:scale(.94)}
#btnWarp.on{background:#3b0f2e;border-color:#ff3cb0;color:#ff8ad2;box-shadow:0 0 18px rgba(255,60,176,.45);animation:pulse 1s infinite}
#btnWarp.on small{color:#ff8ad2}
.opts button.kit{border-color:#3a5a87}
.opts button.kit.on{background:var(--sand);color:#1a1200;border-color:var(--sand);font-weight:700}
.opts .sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
.opts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opts button{flex:0 0 auto;padding:7px 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--bone);white-space:nowrap}
.take{position:absolute;left:12px;right:12px;bottom:calc(200px + var(--safe-bot));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;z-index:5}
.take.hidden{display:none}
.take span{flex:1;font-size:13px;color:var(--mute)}
.take button{padding:8px 10px;border-radius:9px;border:1px solid var(--line);font-weight:600}
.take button.save{background:var(--sand);color:#1a1200;border-color:var(--sand)}
#toast{position:absolute;left:50%;top:calc(var(--safe-top) + 66px);transform:translateX(-50%);background:var(--bone);color:#1a1200;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
#gate{position:absolute;inset:0;background:rgba(7,17,31,.92);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:20;text-align:center;padding:24px}
#gate p.engine{font-size:12px;letter-spacing:.14em;color:var(--mute);margin:-6px 0 4px}
#gate h1{font:900 54px/1 "Avenir Next Condensed","Arial Narrow",sans-serif;color:var(--sand);margin:0}
#gate p{color:var(--mute);max-width:280px;margin:0}
#gate button{padding:14px 28px;border-radius:999px;background:var(--fire);color:#fff;font-weight:800;font-size:17px}

.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px;height:44px}
.tabs button{flex:1;border-radius:11px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--deep);color:var(--bone);box-shadow:0 1px 0 var(--line) inset}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoomctl button{width:38px;height:38px;border-radius:12px;background:rgba(16,31,53,.85);border:1px solid var(--line);font-size:20px;font-weight:700;color:var(--bone)}
.zoomctl small{display:block;text-align:center;font-size:10px;color:var(--mute)}
.lane{grid-template-columns:60px 24px 1fr}
.harmrow{display:flex;align-items:center;gap:6px;margin:6px 0 10px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.harmrow .hnm{font-size:11px;color:var(--tuned);width:52px;text-align:right;padding-right:2px}
.harmrow .hsw{height:26px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mute);background:var(--deep)}
.harmrow .hsw.on{background:var(--tuned);color:#04201b;border-color:var(--tuned)}
.harmrow .role{height:24px;padding:0 8px;border-radius:7px;border:1px solid var(--line);font-size:11px;color:var(--mute);background:var(--deep)}
.harmrow .role.on{color:var(--bone);border-color:var(--sand);background:#2a2412}
.harmrow.off .role{opacity:.35}
.harmrow .hprog{margin-left:auto;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lane .so{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--mute);display:flex;align-items:center;justify-content:center}
.lane .so.on{background:var(--warn);color:#1a1200;border-color:var(--warn)}
.sw{display:flex;align-items:center;gap:8px;flex:0 0 auto;padding:0 10px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--bone);height:32px}
.sw input{width:110px;accent-color:var(--sand);margin:0}
.sw b{min-width:44px;text-align:right;color:var(--sand)}
.sw button{padding:4px 8px;border-radius:7px;border:1px solid var(--line);font-size:11px;color:var(--mute)}
.sw button.on{background:var(--sand);color:#1a1200;border-color:var(--sand)}
.here{display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:start}
.here #hereName,.here #hereMeta,.here #hereBlend{grid-column:1}
.here #btnScore2{grid-column:2;grid-row:1/3;align-self:center;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;color:var(--bone)}
#score{position:absolute;inset:0;background:var(--sea);z-index:15;display:none;flex-direction:column}
#score.on{display:flex}
#score .bar{display:flex;align-items:center;gap:8px;padding:10px 12px calc(10px + var(--safe-bot));border-top:1px solid var(--line)}
#score .bar span{flex:1;font-size:13px;color:var(--mute)}
#score .bar button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:600}
#score .bar button.save{background:var(--sand);color:#1a1200;border-color:var(--sand)}
#scoreWrap{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px}
#scoreCv{display:block;background:#fbf7ee;border-radius:10px;width:100%;height:auto}
.skinbar .seg{flex:1.6;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:3px}
.skinbar .seg button{flex:1;height:auto;border:0;border-radius:11px;background:none;font-size:15px;color:var(--mute)}
.skinbar .seg button.on{background:var(--sand);color:#1a1200}
.skinbar .seg button.warp.on{background:#3b0f2e;color:#ff8ad2;box-shadow:0 0 0 1px #ff3cb0 inset}
@media (orientation:landscape) and (max-height:560px){
 #app{display:grid;grid-template-columns:1fr 236px;grid-template-rows:auto 1fr;grid-template-areas:"main top" "main foot";padding-top:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
 main{grid-area:main}
 .top{grid-area:top;flex-direction:column;align-items:stretch;padding:62px 10px 6px;min-height:0}
 .brand{display:flex;flex-direction:row;align-items:baseline;gap:5px;font-size:18px;margin-left:0}
 .brand small{display:inline;margin:0;letter-spacing:.06em;font-size:10px}
 .transport{justify-content:space-between}
 .transport>button{padding:0 10px;height:36px}
 .bpm{height:44px}
 footer{grid-area:foot;overflow:auto;padding:4px 10px 6px;gap:6px}
 .tabs{height:38px}
 .big{gap:6px}
 .big>button{min-width:0;flex:1;height:48px;padding:0 4px;font-size:13px}
 #btnMash{width:62px;height:62px;flex:0 0 62px;font-size:15px}
 .opts{flex-wrap:wrap}
 .sw{width:100%;padding:0 8px}
 .sw input{flex:1;width:auto;min-width:36px}
 .sw b{min-width:38px}
 .here{padding:2px 12px}
 #hereName{font-size:22px}
 #hereMeta{font-size:11px}
 .chips{padding:3px 10px}
 .chips button{padding:5px 10px;font-size:12px}
 .skinbar{padding:6px 10px}
 .skinbar button{height:48px}
}
@media (prefers-reduced-motion:reduce){#btnRec.on{animation:none}}
#syncSlot{display:inline-flex;align-items:center;flex:none}
#syncSlot .asx-btn{min-height:34px;padding:0 12px 0 10px;font-size:14px}
#syncSlot{position:relative;z-index:1}
@media (max-width:560px){
  .top{flex-wrap:wrap;row-gap:6px}
  .top>.brand{margin-left:0}
  .top>.transport{flex:1 1 100%;justify-content:space-between}
}
.wb-follow :is(#zoomIn,#zoomOut,#regionChips button,#patternChips button,#btnJump,#btnMash,#btnWarp,#bpmDn,#bpmUp,#bpmTap,#lockBtn,#humBtn,#harmBtn,#melBtn,#swingRange,#swingAuto,#btnClearEdits,#btnFill,#btnStutter,#modeMorph,#modeWarp,#grid .st,#gridHarm){opacity:.38}
.followtag{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;background:rgba(98,214,255,.16);border:1px solid rgba(98,214,255,.6);color:#c9f1ff;font-weight:700;font-size:13px;line-height:1.35}

<body>
<div id="app">
  <header class="top">
    <canvas class="flagbg" id="flagA"></canvas><canvas class="flagbg" id="flagB"></canvas><div class="flagscrim"></div>
    <a class="appsPill" href="index.html" aria-label="Back to all apps" style="position:static;margin-right:8px;flex:none">‹ Apps</a><div class="brand"><span>World</span><span>Beats</span><small>MASH-2</small></div>
    <span id="syncSlot"></span>
    <div class="transport">
      <div class="bpm"><button id="bpmDn" aria-label="Slower">−</button><button id="bpmTap" title="Drag up or down to change, tap in time to set it"><b id="bpmVal">96</b><small>BPM</small></button><button id="bpmUp" aria-label="Faster">+</button></div>
      <button id="btnRec">Rec</button>
      <button id="btnPlay">Play</button>
    </div>
  </header>
  <main>
    <section id="viewWorld" class="view on">
      <canvas id="globe"></canvas>
      <div class="zoomctl"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button><small id="zoomLbl">1×</small></div>
      <div class="here">
        <div id="hereName">Havana</div>
        <div id="hereMeta">Spin the globe. The groove under the crosshair plays.</div>
        <div id="hereBlend"><i></i></div>
        <div id="followTag" class="followtag" hidden></div>
        <button id="btnScore2">Score</button>
      </div>
      <div id="patternChips" class="chips"></div>
      <div id="regionChips" class="chips"></div>
    </section>
    <section id="viewGrid" class="view">
      <div class="gridhead"><span id="gridTitle"></span><span><button id="btnScore">Score</button> <button id="btnClearEdits">Reset</button></span></div>
      <div id="grid"></div>
    </section>
    <section id="viewJam" class="view">
      <div class="jamhead"><button id="jamBack">&larr; World</button><div class="jamttl"><b id="jamWhere">&mdash;</b><span id="jamKey"></span></div><div id="jamChord">&mdash;</div></div>
      <div class="jamchips" id="jamPatches"></div>
      <div class="jamrow"><div id="jamXY" class="jamxy"><i></i><span>filter &middot; resonance</span></div><div class="jamctl"><button id="jamMash">Mash</button><button id="jamScale">Scale: region</button><button id="jamOctDn">Octave &minus;</button><button id="jamOctUp">Octave +</button><button id="jamPlus" class="plus">Jam+ &middot; full MASH-1</button></div></div>
      <div id="jamKeys" class="jamkeys"></div>
    </section>
    <section id="viewSkin" class="view">
      <canvas id="skin"></canvas>
      <div class="skinbar">
        <div class="seg"><button id="modeSkin" class="on">Skin</button><button id="modeMorph">Morph</button><button id="modeWarp" class="warp">Warp</button></div>
        <button id="btnRecSkin">Rec</button><button id="btnStutter">Stutter</button>
        <button id="btnFill">Fill</button>
        <button id="btnLearn">Learn</button>
      </div>
    </section>
  </main>
  <footer>
    <nav class="tabs"><button data-view="World" class="on">World</button><button data-view="Grid">Grid</button><button data-view="Skin">Skin</button><button data-view="Jam">Jam</button></nav>
    <div class="big">
      <button id="btnJump">Jump<small>random city</small></button>
      <button id="btnMash">MASH</button>
      <button id="btnWarp">Warp<small>glitch it</small></button>
    </div>
    <div class="opts" id="optRow">
      <label class="sw">Vol <input type="range" id="volRange" min="0" max="100" value="75"></label>
      <label class="sw">Swing <input type="range" id="swingRange" min="0" max="100" value="0"><b id="swingPct">auto</b><button id="swingAuto" class="on">auto</button></label>
      <button id="lockBtn">Global tempo: off</button>
      <button id="grooveBtn" hidden>Others’ grooves: on</button>
      <button id="humBtn">Human: on</button>
      <button id="harmBtn">Harmony: on</button>
      <button id="loopBtn">Export 4 bars</button>
      <button id="melBtn">Tuned: on</button>
    </div>

        let i = cur.k;
        if (S.stutter) {
          const len = S.stutter.len || Math.max(1, Math.round(p.spb / 2));
          i = (S.stutter.at + ((S.stutter.n++) % len)) % p.s;
        }
        const quiet = silent();
        if (quiet) {   // the teacher has switched this device's groove off: keep time, make no sound
          if (i % p.spb === 0) G.pulse[p.region] = when;
          S.queue.push({ i, t: when });
          if (S.queue.length > 256) S.queue.shift();
        } else origSched(p, i, when);
        log.push({ run: cur.run, bar: cur.bar, k: cur.k, x, T, when, pat: p.id, quiet, epoch: epochOf(ctx, when) });
        if (log.length > 4000) log.splice(0, 1500);
      }
      cur.k++;
      if (cur.k >= p.s) nextBar();
    }
  }

  /* ---- controls ---- */
  function playLabel() {
    const s = sy();
    const on = lastMode === 'solo' ? S.playing : !!(s && s.playing());
    $('btnPlay').classList.toggle('on', on);
    $('btnPlay').textContent = on ? 'Stop' : 'Play';
  }
  function roomStart() {
    const s = sy();
    if (!S.A) return;
    if (!s.hasControl()) { notice(leaderName() + ' is in control'); return; }
    if (lastMode === 'lead') sendMark(true);
    s.start(Math.round(S.bpm * 10) / 10, S.A.s / S.A.spb);
  }
  UI.play = function (on, byHand) {
    if (lastMode === 'solo') return origPlay(on);
    const s = sy();
    if (on && !s.playing()) {
      if (lastMode === 'lead' || byHand) roomStart();   // Jump, Mash and the like only start the room for the teacher
    } else if (!on && s.playing()) {
      if (s.hasControl()) s.stop(); else notice(leaderName() + ' is in control');
    }
    playLabel();
  };
  $('btnPlay').onclick = () => UI.play(lastMode === 'solo' ? !S.playing : !sy().playing(), true);
  S.tick = function () { if (lastMode !== 'solo') return; return origTick(); };
  S.requestFill = function () {
    if (lastMode === 'lead') { sendMark(true, true); return; }
    if (lastMode === 'follow') return;
    origFill();
  };
  for (const id of ['bpmDn', 'bpmUp', 'bpmTap']) $(id).addEventListener('pointerdown', () => { bpmTouchedAt = performance.now(); }, true);

  const LOCKED = '#globe,#zoomIn,#zoomOut,#regionChips button,#patternChips button,#btnJump,#btnMash,#btnWarp,' +
    '#bpmDn,#bpmUp,#bpmTap,#lockBtn,#humBtn,#harmBtn,#melBtn,#swingRange,#swingAuto,#btnClearEdits,#btnFill,' +
    '#btnStutter,#modeMorph,#modeWarp,#grid .st,#gridHarm';
  for (const ev of ['pointerdown', 'click', 'input', 'wheel', 'keydown']) {
    document.addEventListener(ev, e => {
      if (lastMode !== 'follow') return;
      const el = e.target && e.target.closest ? e.target.closest(LOCKED) : null;
      if (!el) return;
      if (ev === 'keydown' && !/^(Enter| |Spacebar|Arrow)/.test(e.key)) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      if (ev !== 'input') notice('Following ' + leaderName() + '. Only the teacher can steer.');
    }, { capture: true, passive: false });
  }

  function grooveLabel() {
    $('grooveBtn').textContent = 'Others\u2019 grooves: ' + (grooveOthers ? 'on' : 'off');
  }
  $('grooveBtn').addEventListener('click', () => {
    if (lastMode !== 'lead') return;
    grooveOthers = !grooveOthers;
    try { localStorage.setItem('wb.grooveOthers', grooveOthers ? 'on' : 'off'); } catch (e) { /* storage blocked */ }
    sy().share('groove', { on: grooveOthers });
    grooveLabel();
    UI.toast(grooveOthers ? 'Everyone\u2019s groove is on' : 'Only your device plays the groove now');
  });
  function followUI() {
    const f = lastMode === 'follow';
    document.body.classList.toggle('wb-follow', f);
    if (f && K.mode !== 'skin') {
      K.mode = 'skin';
      ['Skin', 'Morph', 'Warp'].forEach(n => $('mode' + n).classList.toggle('on', n === 'Skin'));
    }
    $('grooveBtn').hidden = lastMode !== 'lead';
    grooveLabel();
  }
  function followText() {
    const q = silent();
    const txt = lastMode === 'follow' ? 'Following ' + leaderName() + (q ? '. Your groove is off.' : '') : '';
    const el = $('followTag');
    if (el.textContent !== txt) { el.textContent = txt; el.hidden = !txt; }
    if (q !== wasSilent) {
      wasSilent = q;
      if (lastMode === 'follow') UI.toast(leaderName() + (q ? ' switched your groove off' : ' switched your groove back on'));
    }
  }

  /* ---- the follower's globe glides to wherever the teacher is looking ---- */
  G.frame = function () {
    const now = performance.now(), dt = Math.min(.1, (now - frameAt) / 1000);
    frameAt = now;
    const n = lastMode === 'follow' ? sy().shared('nav') : null;
    if (n && typeof n.y === 'number') {
      this.anim = null; this.vx = this.vy = 0; this.dragging = false; this.pinch = null;
      const k = 1 - Math.exp(-dt / .12);
      const dy = ((n.y - this.yaw + Math.PI) % TWO_PI + TWO_PI) % TWO_PI - Math.PI;
      const dp = n.p - this.pitch, dz = n.z - this.zoom;
      if (Math.abs(dy) > 1e-5 || Math.abs(dp) > 1e-5 || Math.abs(dz) > 1e-4) {
        const close = Math.abs(dy) < 1e-4 && Math.abs(dp) < 1e-4 && Math.abs(dz) < 1e-3;
        this.yaw = close ? this.yaw + dy : this.yaw + dy * k;
        this.pitch = close ? n.p : this.pitch + dp * k;
        if (Math.abs(dz) > 1e-4) { this.zoom = close ? n.z : this.zoom + dz * k; if (UI.zoomLabel) UI.zoomLabel(); }
        this.dirty = true;
        this.select();
      }
    }
    return origFrame();
  };

  /* ---- the loop that runs everything above ---- */
  function loop() {
    const m = mode();
    if (m !== lastMode) {
      const was = lastMode;
      lastMode = m;
      if (was === 'solo' && S.playing) origStop();   // joining a room: the room decides when to play
      if (m === 'solo' && cur) { cur = null; origStop(); W.clear(); }
      if (m === 'lead') { navKey = ''; markKey = ''; sy().share('groove', { on: grooveOthers }); }
      followUI();
      playLabel();
    }
    if (m === 'solo') return;
    const s = sy();
    followText();
    if (m === 'lead') { leadNav(); sendMark(false); }
    if ((m === 'lead' || m === 'free') && setBpm != null && Math.abs(S.bpm - setBpm) > .01 && performance.now() - bpmTouchedAt < 2500) {
      pendingBpm = S.bpm; pendingAt = performance.now(); setBpm = S.bpm;
      clearTimeout(bpmTimer);
      bpmTimer = setTimeout(() => { const x = sy(); if (x && x.hasControl() && pendingBpm != null) x.setTempo(Math.round(pendingBpm)); }, 250);
    }
    const tr = s.tr;
    if (!A.ctx || !tr) return;
    if (tr.playing && tr.segs && tr.segs.length) {
      if (!s.locked()) return;
      if (!cur || cur.run !== tr.run) beginRun(tr);
      schedule();
    } else if (cur) {
      if (tr.stopT != null && s.now() < tr.stopT && s.locked()) { schedule(); return; }
      cur = null;
      origStop();
      W.clear();
      playLabel();
    } else if (m === 'follow' && Math.abs(S.bpm - tr.bpm) > .01) {
      S.bpm = tr.bpm; setBpm = S.bpm;
    }
  }
  setInterval(() => { try { loop(); } catch (e) { console.error('World Beats sync:', e); } }, 25);
  room.on('transport', playLabel);
  room.on('change', () => { if (mode() !== lastMode) loop(); });
  window.__wbSync = { log, mode: () => lastMode, cur: () => cur };
  return { mode: () => lastMode };
})();
</script>
</body>
</html>
