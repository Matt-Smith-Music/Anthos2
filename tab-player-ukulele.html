<script>
/* Keep the screen awake whenever the app is genuinely in use, so an iPhone's
   auto-lock cannot kill a practice session. "In use" means one of two things:
   the app is making sound (metronome, backing, drill playback, game clicks),
   or the microphone is live - which is the Sight Fuse case, where the student
   reads and plays for minutes without touching the glass and the app itself
   may be nearly silent. Self-contained so it cannot collide with app code. */
(function () {
  var QUIET = 4000, POLL = 1500;
  var lastSound = 0, streams = [], lock = null, pending = false;
  function mark() { lastSound = Date.now(); }
  function watch(c) {
    ["createOscillator", "createBufferSource"].forEach(function (fn) {
      if (typeof c[fn] !== "function") return;
      var orig = c[fn].bind(c);
      c[fn] = function () {
        var n = orig.apply(null, arguments);
        if (n && typeof n.start === "function") {
          var st = n.start.bind(n);
          n.start = function () { mark(); return st.apply(null, arguments); };
        }
        return n;
      };
    });
    return c;
  }
  var O = window.AudioContext || window.webkitAudioContext;
  if (O) {
    var W = function () { return watch(Reflect.construct(O, Array.prototype.slice.call(arguments))); };
    W.prototype = O.prototype;
    try { window.AudioContext = W; window.webkitAudioContext = W; } catch (e) {}
  }
  var md = navigator.mediaDevices;
  if (md && typeof md.getUserMedia === "function") {
    var gum = md.getUserMedia.bind(md);
    md.getUserMedia = function () {
      return gum.apply(null, arguments).then(function (s) { streams.push(s); return s; });
    };
  }
  function micLive() {
    for (var i = 0; i < streams.length; i++) {
      var t = streams[i].getAudioTracks ? streams[i].getAudioTracks() : [];
      for (var j = 0; j < t.length; j++) if (t[j].readyState === "live" && t[j].enabled) return true;
    }
    return false;
  }
  function acquire() {
    if (lock || pending || !navigator.wakeLock || !navigator.wakeLock.request) return;
    pending = true;
    navigator.wakeLock.request("screen").then(function (l) {
      pending = false; lock = l;
      l.addEventListener("release", function () { lock = null; });
    }).catch(function () { pending = false; });
  }
  function release() {
    if (!lock) return;
    var l = lock; lock = null;
    try { l.release(); } catch (e) {}
  }
  setInterval(function () {
    var busy = (Date.now() - lastSound < QUIET) || micLive();
    if (busy && !document.hidden) acquire(); else release();
  }, POLL);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) release();
  });
})();
</script>

<script>
function parseMIDI(buf){
  const dv=new DataView(buf); let pos=0;
  const u8=()=>dv.getUint8(pos++);
  const u16=()=>{const v=dv.getUint16(pos); pos+=2; return v};
  const u32=()=>{const v=dv.getUint32(pos); pos+=4; return v};
  const vlq=()=>{let v=0,b; do{b=u8(); v=(v<<7)|(b&0x7F)}while(b&0x80); return v};
  const tag=()=>String.fromCharCode(u8(),u8(),u8(),u8());
  if(tag()!=='MThd') throw new Error('Not a MIDI file');
  const hlen=u32(); const hEnd=pos+hlen;
  u16(); const ntrk=u16(); const div=u16(); pos=hEnd;
  if(div&0x8000) throw new Error('SMPTE-timed MIDI is not supported');
  const tempos=[], raw=[], tsigs=[]; let keysig=null;
  for(let ti=0; ti<ntrk; ti++){
    if(pos+8>dv.byteLength) break;
    const id=tag(); const len=u32(); const end=pos+len;
    if(id!=='MTrk'){ pos=end; continue }
    let tick=0, status=0;
    const open={};
    const endNote=(ch,p,tk)=>{
      const k=ch*128+p, a=open[k];
      if(a&&a.length){
        const s=a.shift();
        raw.push({p,ch,track:ti,vel:s.v,st:s.t,et:Math.max(tk,s.t+1)});
      }
    };
    while(pos<end){
      tick+=vlq();
      let st=u8();
      if(st<0x80){ if(!status){continue} pos--; st=status }
      if(st===0xFF){
        const type=u8(); const l=vlq(); const dstart=pos;
        if(type===0x51&&l===3){ tempos.push({tick,us:(u8()<<16)|(u8()<<8)|u8()}) }
        else if(type===0x58&&l>=2){ tsigs.push({tick,num:u8(),den:Math.pow(2,u8())}) }
        else if(type===0x59&&l>=2&&keysig===null){ let sf=u8(); if(sf>127) sf-=256; keysig={sf:Math.max(-7,Math.min(7,sf)),mi:u8()} }
        pos=dstart+l; status=0;
      } else if(st===0xF0||st===0xF7){
        pos+=vlq(); status=0;
      } else {
        status=st;
        const cmd=st&0xF0, ch=st&0x0F;
        if(cmd===0x90){ const p=u8(), v=u8(); if(v>0){ (open[ch*128+p]=open[ch*128+p]||[]).push({t:tick,v}) } else endNote(ch,p,tick) }
        else if(cmd===0x80){ const p=u8(); u8(); endNote(ch,p,tick) }
        else if(cmd===0xC0||cmd===0xD0){ u8() }
        else { u8(); u8() }
      }
    }
    for(const k in open){
      for(const s of open[k]){
        const kk=+k;
        raw.push({p:kk%128, ch:(kk-kk%128)/128, track:ti, vel:s.v, st:s.t, et:s.t+div});
      }
    }
    pos=end;
  }
  if(!raw.length) throw new Error('No notes found in this file');
  tempos.sort((a,b)=>a.tick-b.tick);
  if(!tempos.length||tempos[0].tick>0) tempos.unshift({tick:0,us:500000});
  const segs=[]; let sec=0;
  for(let i=0;i<tempos.length;i++){
    if(i>0) sec+=(tempos[i].tick-tempos[i-1].tick)/div*(tempos[i-1].us/1e6);
    segs.push({tick:tempos[i].tick, sec, us:tempos[i].us});
  }
  const toSec=tk=>{
    let s=segs[0];
    for(const g of segs){ if(g.tick<=tk) s=g; else break }
    return s.sec+(tk-s.tick)/div*(s.us/1e6);
  };

function demoRaw() {
  // a 12-bar blues riff in A at 100 bpm, 4/4
  const spb = 0.6, notes = [], beats = [];
  const riff = r => [[r, 0, 1], [r, 1, 1], [r + 7, 2, 1], [r + 7, 3, 1], [r + 9, 4, 1], [r + 9, 5, 1], [r + 7, 6, 1], [r + 7, 7, 1]];
  const bars = [45, 45, 45, 45, 50, 50, 45, 45, 52, 50, 45, 52];
  bars.forEach((r, b) => riff(r).forEach(([p, e, len]) => notes.push({p, start: (b * 8 + e) * spb / 2, dur: len * spb / 2 * 0.9, track: 0, vel: 96, ch: 0})));
  for (let i = 0; i < 48; i++) beats.push({t: i * spb, accent: i % 4 === 0});
  return {notes, beats, name: 'Blues riff in A (demo)'};
}
function buildTracks(r) {
  const map = new Map(); r.notes.forEach(n => { const k = n.track + ':' + (n.ch === undefined ? 0 : n.ch); if (!map.has(k)) map.set(k, {key: k, track: n.track, ch: n.ch || 0, n: 0, lo: 200, hi: 0}); const t = map.get(k); t.n++; t.lo = Math.min(t.lo, n.p); t.hi = Math.max(t.hi, n.p); });
  return [...map.values()].filter(t => t.ch !== 9).sort((a, b) => b.n - a.n);
}

  } finally { ctx = savedCtx; TH = savedTH; SC.sp = savedSC.sp; SC.bottom = savedSC.bottom; songTime = savedTime; waitFor = savedWait; marks.clear(); savedMarks.forEach(([k, v]) => marks.set(k, v)); }
  return {bytes: pdf.bytes(), pages: pageSystems.length, name: (song.name || raw.name || 'score').replace(/[^\w\- ]+/g, '').trim() || 'score'};
}
async function sharePDF() {
  const r = exportPDF(); if (!r) return;
  const blob = new Blob([r.bytes], {type: 'application/pdf'}); const file = new File([blob], r.name + '.pdf', {type: 'application/pdf'});
  try { if (navigator.share && (!navigator.canShare || navigator.canShare({files: [file]}))) { await navigator.share({files: [file], title: r.name}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = r.name + '.pdf'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  toast('PDF saved: ' + r.pages + (r.pages === 1 ? ' page' : ' pages'));
}

/* ================= wiring ================= */
$('bLoad').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { const r = parseMIDI(await f.arrayBuffer()); loadRaw(r, f.name.replace(/\.[^.]+$/, '')); toast('Loaded'); } catch (err) { toast('Could not read that file: ' + err.message); } e.target.value = ''; });
$('bDemo').addEventListener('click', () => { loadRaw(demoRaw()); });
$('track').addEventListener('change', e => { S.track = +e.target.value; useTrack(); });
$('segMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.mode = b.dataset.m; saveS(); if (S.mode !== 'listen' && !micOn) toast(S.mode === 'mark' ? 'Turn the mic on and Mark colours each note green or red as it passes' : 'Turn the mic on — Wait pauses at each note until it hears you play it'); restart(); });
$('bPlay').addEventListener('click', () => { if (!song) { toast('Load a MIDI or press Demo first'); return; } audio(); playing = !playing; if (playing && songTime >= song.end) restart(); updateUI(); });
$('bRestart').addEventListener('click', () => { restart(); });
$('tDn').addEventListener('click', () => { S.rate = Math.max(0.4, +(S.rate - 0.05).toFixed(2)); saveS(); updateUI(); });
$('tUp').addEventListener('click', () => { S.rate = Math.min(1.5, +(S.rate + 0.05).toFixed(2)); saveS(); updateUI(); });
$('bLoop').addEventListener('click', () => { S.loop = !S.loop; if (S.loop && S.A === null && S.B === null) toast('Looping the whole piece — drag across the loop strip to pick bars'); updateUI(); });
/* loop strip: drag to select bars the first time; after that drag either end, drag the middle to move the whole loop, tap inside to toggle, ✕ clears */
let loopDrag = null;
function barLines() { const a = song.beats.filter(b => b.accent).map(b => b.t); if (!a.length || a[0] > 0.001) a.unshift(0); if (a[a.length - 1] < song.end - 0.05) a.push(song.end); return a; }
function barIdxDown(t) { const a = barLines(); let r = 0; for (let k = 0; k < a.length; k++) if (a[k] <= t + 0.02) r = k; return r; }
function barIdxUp(t) { const a = barLines(); for (let k = 0; k < a.length; k++) if (a[k] >= t - 0.02) return k; return a.length - 1; }
const seekTo = t => { songTime = clamp(t, 0, song.end); nextIdx = song.notes.findIndex(n => n.start >= songTime - 0.001); if (nextIdx < 0) nextIdx = song.notes.length; marks.clear(); waitFor = null; };
function updateLoopBar() { const has = song && S.A !== null && S.B !== null && S.B > S.A; $('loopHint').style.display = has ? 'none' : 'flex'; $('loopClear').style.display = has ? 'block' : 'none';
  const reg = $('loopRegion'); $('hA').hidden = !has; $('hB').hidden = !has;
  if (has) { reg.style.display = 'block'; reg.style.opacity = S.loop ? '1' : '0.45'; const l = S.A / song.end * 100, w = (S.B - S.A) / song.end * 100; reg.style.left = l + '%'; reg.style.width = w + '%'; $('hA').style.left = l + '%'; $('hB').style.left = (l + w) + '%'; $('hA').style.opacity = $('hB').style.opacity = S.loop ? '1' : '0.6'; } else reg.style.display = 'none';
  $('bLoop').textContent = 'Loop: ' + (S.loop ? 'on' : 'off'); $('bLoop').classList.toggle('on', S.loop); }
$('loopBar').addEventListener('pointerdown', e => {
  if (!song || e.target === $('loopClear')) return; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
  const r = $('loopBar').getBoundingClientRect(); const x = e.clientX - r.left; const has = S.A !== null && S.B !== null && S.B > S.A;
  const xA = has ? S.A / song.end * r.width : -1e9, xB = has ? S.B / song.end * r.width : -1e9; const grab = 24;
  let mode = 'new'; if (has) { const dA = Math.abs(x - xA), dB = Math.abs(x - xB); if (dA <= grab || dB <= grab) mode = dA <= dB ? 'a' : 'b'; else if (x > xA && x < xB) mode = 'move'; }
  const a = barLines(); loopDrag = {mode, x0: x, w: r.width, moved: false, ia: has ? barIdxDown(S.A) : 0, ib: has ? barIdxUp(S.B) : 0, len: has ? barIdxUp(S.B) - barIdxDown(S.A) : 1, bars: a};
});
$('loopBar').addEventListener('pointermove', e => {
  if (!loopDrag || !song) return; const d = loopDrag; const r = $('loopBar').getBoundingClientRect(); const x = clamp(e.clientX - r.left, 0, r.width); if (Math.abs(x - d.x0) > 5) d.moved = true; if (!d.moved) return;
  const t = x / r.width * song.end, a = d.bars, last = a.length - 1;
  if (d.mode === 'a') { const k = Math.min(barIdxDown(t), d.ib - 1); S.A = a[Math.max(0, k)]; }
  else if (d.mode === 'b') { const k = Math.max(barIdxUp(t), d.ia + 1); S.B = a[Math.min(last, k)]; }
  else if (d.mode === 'move') { const t0 = d.x0 / r.width * song.end; const shift = barIdxDown(t) - barIdxDown(t0); const ia = clamp(d.ia + shift, 0, last - d.len); S.A = a[ia]; S.B = a[ia + d.len]; }
  else { const tA = Math.min(d.x0, x) / r.width * song.end, tB = Math.max(d.x0, x) / r.width * song.end; const ia = barIdxDown(tA); const ib = Math.max(barIdxUp(tB), ia + 1); S.A = a[ia]; S.B = a[Math.min(last, ib)]; }
  S.loop = true; updateLoopBar();
});
$('loopBar').addEventListener('pointerup', e => {
  if (!loopDrag) return; const d = loopDrag; loopDrag = null; const r = $('loopBar').getBoundingClientRect(); const has = S.A !== null && S.B !== null && S.B > S.A;
  if (d.moved) { if (has) seekTo(S.A); }
  else if (d.mode === 'move' || d.mode === 'a' || d.mode === 'b') { S.loop = !S.loop; if (S.loop) seekTo(S.A); }
  else seekTo(d.x0 / r.width * song.end);
  updateUI();
});
$('loopBar').addEventListener('pointercancel', () => { loopDrag = null; updateLoopBar(); });
$('loopClear').addEventListener('click', () => { S.A = null; S.B = null; S.loop = false; updateUI(); });
$('sound').innerHTML = SOUNDS.map((x, i) => `<option value="${i}">${x.name}</option>`).join(''); $('sound').value = String(S.sound || 0);
$('sound').addEventListener('change', () => { S.sound = +$('sound').value; saveS(); });
$('bOct').addEventListener('click', () => { S.oct = S.oct >= 1 ? -1 : S.oct + 1; saveS(); if (raw) useTrack(); updateUI(); });
function paperUI() { $('bPaper').classList.toggle('on', !!S.paper); $('bPaper').textContent = S.paper ? 'Paper: on' : 'Paper'; $('stage').style.background = S.paper ? THEMES.paper.bg : THEMES.dark.bg; }
$('bPaper').addEventListener('click', () => { S.paper = !S.paper; saveS(); paperUI(); }); paperUI();
$('bPdf').addEventListener('click', () => { sharePDF(); });
function autoUI() { $('bAuto').textContent = 'Auto: ' + (S.auto === false ? 'off' : 'on'); $('bAuto').classList.toggle('on', S.auto !== false); }
$('bAuto').addEventListener('click', () => { S.auto = S.auto === false; saveS(); autoUI(); if (raw) useTrack(); updateUI(); toast(S.auto === false ? 'Playing the file where it was written — use Octave to move it by hand' : 'Auto: the file is moved into this instrument\'s register'); }); autoUI();
(function () { const keys = Object.keys(INSTR.tunings); if (keys.length > 1) { $('bStrings').hidden = false; if (S.strings && INSTR.tunings[S.strings]) setStrings(S.strings); $('bStrings').textContent = 'Strings: ' + NS;
  $('bStrings').addEventListener('click', () => { const i = keys.indexOf(String(NS)); setStrings(keys[(i + 1) % keys.length]); $('bStrings').textContent = 'Strings: ' + NS; saveS(); if (raw) useTrack(); updateUI(); }); } })();
$('bScore').addEventListener('click', () => { S.score = !S.score; saveS(); updateUI(); });
$('segLevel').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.level = b.dataset.l; saveS(); document.querySelectorAll('#segLevel button').forEach(x => x.classList.toggle('sel', x === b)); if (raw) useTrack();
  toast({'1': 'Level 1: the tune, one note per beat', '2': 'Level 2: single-note line, nothing shorter than a quaver', '3': 'Level 3: as written, chords thinned to two notes', 'full': 'Full piece as written'}[S.level]); });
document.querySelectorAll('#segLevel button').forEach(x => x.classList.toggle('sel', x.dataset.l === (S.level || 'full')));
$('bMore').addEventListener('click', () => { document.body.classList.toggle('showAll'); $('bMore').textContent = document.body.classList.contains('showAll') ? 'Less' : 'More'; });
$('bMic').addEventListener('click', micToggle);
$('cv').addEventListener('pointerdown', e => { if (!song) return; const r = cv.getBoundingClientRect(); const W = r.width; const H = r.height; const scoreH = S.score ? Math.min(Math.max(72, H * 0.4), 160) : 0; const ls = clamp((H - 24 - (scoreH + 10)) / 5, 14, 46); layout(W, ls); const playX = W * 0.24; const t = timeAtX(xAtTime(songTime) + (e.clientX - r.left - playX)); songTime = clamp(t, 0, song.end); nextIdx = song.notes.findIndex(n => n.start >= songTime - 0.001); if (nextIdx < 0) nextIdx = song.notes.length; marks.clear(); hits = 0; misses = 0; waitFor = null; updateUI(); });
updateUI();
