<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<title>Keys Room</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{--bg:#101315;--panel:#171B1E;--panel2:#1D2226;--line:#2A3136;--ink:#EEF0F2;--mut:#8E98A3;--acc:#5BC8F5;--accL:#9ADFFB;--accD:#2E8FBF;--good:#58D68D;--bad:#FF6B6B;--teal:#4FB3A6}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#appBack{display:flex;align-items:center;gap:7px;height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0 12px;background:#0C0E10;color:var(--ink);font:700 14px/1 system-ui,sans-serif;text-decoration:none;border-bottom:1px solid var(--line)}
#appBack .chev{font-size:19px;line-height:1;margin-top:-2px;color:var(--acc)}
.psLink{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:99999;font:700 12px/1 system-ui,sans-serif;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#0C0E10}
header{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--acc)}
.logo small{font-weight:600;font-size:11px;color:var(--mut);margin-left:6px}
.grades{display:flex;gap:5px;padding:6px 14px 4px;overflow-x:auto;scrollbar-width:none}
.grades::-webkit-scrollbar{display:none}
.grades button{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:8px 11px;font:700 13px/1 inherit;font-family:inherit;min-height:36px;cursor:pointer}
.grades button.on{background:var(--acc);border-color:var(--acc);color:#15130E}
.tabs{display:flex;gap:2px;margin:6px 14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:none;border:none;font-family:inherit;text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:700;padding:10px 12px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);background:#22171A}
.tabs button[hidden]{display:none}
.famnote{color:var(--mut);font-size:12.5px;line-height:1.45;max-width:64ch;margin:6px 0 2px}
.chip.fit{border-color:#3F5B57;color:var(--teal)}
.chip.fit.sel{border-color:var(--teal);color:var(--ink);background:#15302C}
.demo{display:grid;gap:6px;margin:8px 0}
.demo .bar{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:48px;padding:6px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;font:800 14px/1.1 inherit;text-align:center}
.demo .bar small{font:600 9.5px/1.2 inherit;color:var(--mut);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.demo .bar.now{border-color:var(--acc);background:#14262E}
main{padding:10px 14px 40px}
.panel{display:none}.panel.on{display:block}
h3{margin:14px 0 4px;font-size:15px}
p.lead{margin:0 0 10px;color:var(--mut);font-size:13px;line-height:1.45;max-width:64ch}
.lab{font:700 11px/1 inherit;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:10px 0 5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font:600 12.5px/1 inherit;font-family:inherit;color:var(--mut);cursor:pointer;min-height:32px}
.chip.sel{border-color:var(--acc);color:var(--ink)}
.chip.req{border-color:#3F5B57;color:var(--teal)}
.chip.req.sel{border-color:var(--teal);color:var(--ink);background:#15302C}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;min-height:38px;padding:8px 13px;font:700 13.5px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--accL),var(--accD));border-color:var(--acc);color:#15130E}
.btn.on{border-color:var(--acc);color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.scale-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:12px 0 8px;flex-wrap:wrap}
.big{font-size:32px;font-weight:800;line-height:1;letter-spacing:.01em}
.spelt{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;margin-top:6px;white-space:pre-wrap}
.degline{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);white-space:pre-wrap}
.use{color:var(--mut);font-size:12.5px;margin-top:4px;max-width:60ch}
.fb-scroll{overflow-x:auto;padding:6px 0 10px;-webkit-overflow-scrolling:touch}
.fb-svg{display:block}
.fb-note{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;font-weight:700}
.fb-fretnum{fill:#7A6C61;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px}
.fb-str{fill:#8E98A3;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px}
.boxes{display:flex;gap:14px;flex-wrap:wrap;padding:6px 0}
.chordbox{width:132px;text-align:center}
.chordbox svg{display:block;width:100%}
.chordbox .cap{font-weight:800;font-size:16px;margin:4px 0 0}
.chordbox .sub{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.chordbox button{width:100%;margin-top:6px}
.note{color:var(--mut);font-size:13px;line-height:1.45;max-width:60ch;margin:8px 0}
.strum{display:grid;gap:4px;margin:10px 0}
.strum .cells{display:grid;gap:3px}
.strum .cell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 18px/1 inherit}
.strum .cell small{font:600 10px/1 inherit;color:var(--mut);margin-top:5px}
.strum .cell.beat{border-color:#3A4350}
.strum .cell.now{background:#3A2A26;border-color:var(--acc)}
.strum .cell.rest{color:var(--mut);font-weight:600}
.strum .cell.mute{color:var(--bad)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{background:#000;color:#fff;border:none;width:44px;height:38px;font-size:20px;font-family:inherit}
.stepper b{min-width:62px;text-align:center;font-size:16px}
.exam h3{margin-top:16px}
.exam ul{margin:4px 0 0 18px;padding:0;color:var(--ink);font-size:13.5px;line-height:1.55}
.exam li b{color:var(--acc)}
.mnome{text-align:center;padding:20px 0}
.mnome .bpm{font-size:64px;font-weight:800;line-height:1}
.mnome .dots{display:flex;gap:8px;justify-content:center;margin:14px 0}
.mnome .dots i{width:16px;height:16px;border-radius:50%;background:#2A3136}
.mnome .dots i.on{background:var(--acc);box-shadow:0 0 12px var(--acc)}
.mnome .dots i.one.on{background:#fff;box-shadow:0 0 12px #fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.on{opacity:.95}
</style>
<style>
.kb-scroll{overflow-x:auto;padding:6px 0 10px;-webkit-overflow-scrolling:touch}
.kb{display:block}
.kb .wk{fill:#F3F1EC;stroke:#8E98A3;stroke-width:1}
.kb .bk{fill:#15181B;stroke:#000;stroke-width:1}
.kb .wk.rh{fill:#9ADFFB}.kb .bk.rh{fill:#2E8FBF}
.kb .wk.lh{fill:#FFBC79}.kb .bk.lh{fill:#C77C32}
.kb .wk.root{fill:#FF9F40}.kb .bk.root{fill:#C77C32}
.kb .fin{font:800 12px/1 'JetBrains Mono',ui-monospace,Menlo,monospace;fill:#101315;pointer-events:none}
.kb .fin.onb{fill:#EEF0F2}
.kb .nm{font:600 10px/1 'JetBrains Mono',ui-monospace,Menlo,monospace;fill:#5A6470;pointer-events:none}
.kb .ord{font:800 11px/1 inherit;fill:#101315;pointer-events:none}
.chart{display:grid;gap:6px;margin:10px 0}
.chart .bar{background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:58px;padding:8px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;font:800 17px/1.1 inherit;text-align:center}
.chart .bar small{font:600 10px/1 inherit;color:var(--mut);margin-top:6px;letter-spacing:.08em;text-transform:uppercase}
.chart .bar.now{border-color:var(--acc);background:#14262E}
.chart .bar.solo{border-style:dashed;color:var(--acc)}
.pb-row{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:8px 0}
.pb-row .c{background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 13px/1 inherit}
.pb-row .c small{color:var(--mut);font-size:9px;margin-top:4px}
.pb-row .c.rest{color:var(--mut)}
.pb-row .c.now{border-color:var(--acc);background:#14262E}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
</style>
</head>

<a id="appBack" href="index.html"><span class="chev">‹</span>All apps</a><a class="psLink" href="practice-schedule.html?app=keys-room&name=Keys%20Room" target="_blank" rel="noopener">Schedule</a>
<header><div class="logo">Keys Room<small>Anthos keyboards ladder · Initial to Grade 8 · jazz &amp; gospel voicings at 8</small></div></header>
<div class="grades" id="grades"></div>
<nav class="tabs" id="tabs"><button data-t="chords" class="on">Chords</button><button data-t="scales">Scales</button><button data-t="arps">Arpeggios</button><button data-t="voic" id="tabVoic" hidden>Voicings</button><button data-t="session">Session skills</button><button data-t="playback">Playback</button><button data-t="exam">Exam</button><button data-t="mnome">Metronome</button></nav>
<main>
  <section class="panel on" id="p-chords">
    <p class="lead" id="chordsLead"></p>
    <div class="lab">Chord</div><div class="chips" id="chordTypes"></div>
    <div class="lab">Root</div><div class="chips" id="chordRoots"></div>
    <div class="lab">Voicing</div><div class="chips" id="chordVoic"></div>
    <div id="chordView"></div>
  </section>
  <section class="panel" id="p-scales">
    <p class="lead" id="scalesLead"></p>
    <div class="lab">Keys this grade</div><div class="chips" id="scaleKeys"></div>
    <div class="lab">Scale</div><div class="chips" id="scaleTypes"></div>
    <div class="lab">Root</div><div class="chips" id="scaleRoots"></div>
    <div id="scaleView"></div>
  </section>
  <section class="panel" id="p-arps">
    <p class="lead" id="arpsLead"></p>
    <div class="lab">Arpeggio</div><div class="chips" id="arpTypes"></div>
    <div class="lab">Root</div><div class="chips" id="arpRoots"></div>
    <div id="arpView"></div>
  </section>
  <section class="panel" id="p-voic">
    <p class="lead" id="voicLead"></p>
    <div class="lab">Family</div><div class="chips" id="voicFam"></div>
    <p class="famnote" id="voicFamNote"></p>
    <div class="lab">Chord</div><div class="chips" id="voicTypes"></div>
    <div class="lab">Root</div><div class="chips" id="voicRoots"></div>
    <div class="lab">Voicing</div><div class="chips" id="voicShapes"></div>
    <div id="voicView"></div>
    <div class="lab">Hear it in context</div><div class="chips" id="voicDemos"></div>
    <div id="voicDemoView"></div>
  </section>
  <section class="panel" id="p-session">
    <p class="lead" id="sessionLead"></p>
    <div class="row"><span class="lab" style="margin:0">Style</span><div class="chips" id="ssStyles"></div></div>
    <div class="row"><span class="lab" style="margin:0">Key</span><div class="chips" id="ssKeys"></div></div>
    <div class="row"><button class="btn primary" id="ssPlay">▶ Backing</button><button class="btn" id="ssNew">New chart</button><div class="stepper"><button id="ssDn">−</button><b id="ssBpm">100</b><button id="ssUp">+</button></div><button class="btn on" id="ssComp">Chords: on</button><button class="btn" id="ssShow">Show voicings</button></div>
    <div id="ssView"></div>
  </section>
  <section class="panel" id="p-playback">
    <p class="lead" id="pbLead"></p>
    <div class="row"><button class="btn primary" id="pbPlay">▶ Test</button><button class="btn" id="pbNew">New test</button><button class="btn" id="pbReveal">Reveal</button><div class="stepper"><button id="pbDn">−</button><b id="pbBpm">80</b><button id="pbUp">+</button></div></div>
    <div id="pbView"></div>
  </section>
  <section class="panel exam" id="p-exam"><div id="examView"></div></section>
  <section class="panel" id="p-mnome">
    <div class="mnome"><div class="bpm" id="mBpm">80</div><div class="dots" id="mDots"></div>
      <div class="row" style="justify-content:center"><button class="btn" id="mDn">−5</button><button class="btn" id="mDn1">−1</button><button class="btn primary" id="mGo">Start</button><button class="btn" id="mUp1">+1</button><button class="btn" id="mUp">+5</button></div>
      <div class="row" style="justify-content:center"><div class="chips" id="mSig"><button class="chip sel" data-n="4">4/4</button><button class="chip" data-n="3">3/4</button><button class="chip" data-n="2">2/4</button><button class="chip" data-n="6">6/8</button></div></div></div>
  </section>
</main>

['scaleView', 'arpView'].forEach(id => $(id).addEventListener('click', e => { if (keyTap(e)) return; const t = e.target.closest('[data-act]'); if (!t) return; const rh = JSON.parse($(id).dataset.rh), lh = JSON.parse($(id).dataset.lh); const bpm = 60 + S.grade * 10; if (t.dataset.act === 'rh') playSeq(rh.concat(rh.slice(0, -1).reverse()), bpm, 0.45); else if (t.dataset.act === 'lh') playSeq(lh.concat(lh.slice(0, -1).reverse()), bpm, 0.45); else playBoth(rh, lh, bpm); }));
$('ssView').addEventListener('click', keyTap); $('pbView').addEventListener('click', keyTap);
$('ssPlay').addEventListener('click', () => { ssOn ? stopSS() : startSS(); });
$('ssNew').addEventListener('click', () => { stopSS(); makeChart(); renderSession(); });
$('ssDn').addEventListener('click', () => { S.ssBpm = Math.max(50, (S.ssBpm || STYLES[S.style].bpm) - 4); saveS(); $('ssBpm').textContent = S.ssBpm; if (ssOn) { stopSS(); startSS(); } });
$('ssUp').addEventListener('click', () => { S.ssBpm = Math.min(200, (S.ssBpm || STYLES[S.style].bpm) + 4); saveS(); $('ssBpm').textContent = S.ssBpm; if (ssOn) { stopSS(); startSS(); } });
$('ssComp').addEventListener('click', () => { S.comp = !S.comp; saveS(); renderSession(); });
$('ssShow').addEventListener('click', () => { S.showV = !S.showV; saveS(); renderSession(); });
$('pbPlay').addEventListener('click', () => { pbOn ? stopPB() : startPB(); });
$('pbNew').addEventListener('click', () => { stopPB(); makePlayback(); renderPlayback(); });
$('pbReveal').addEventListener('click', () => { if (!pbTest) makePlayback(); pbTest.revealed = !pbTest.revealed; renderPlayback(); });
$('pbDn').addEventListener('click', () => { S.pbBpm = Math.max(50, S.pbBpm - 4); saveS(); $('pbBpm').textContent = S.pbBpm; });
$('pbUp').addEventListener('click', () => { S.pbBpm = Math.min(160, S.pbBpm + 4); saveS(); $('pbBpm').textContent = S.pbBpm; });
$('mGo').addEventListener('click', () => { mOn ? mStop() : mStart(); });
[['mDn', -5], ['mDn1', -1], ['mUp1', 1], ['mUp', 5]].forEach(([id, d]) => $(id).addEventListener('click', () => { S.mBpm = Math.max(30, Math.min(240, S.mBpm + d)); saveS(); renderMnome(); }));
$('mSig').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; S.mSig = +b.dataset.n; mBeat = 0; saveS(); renderMnome(); });
document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab)); document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + S.tab));
renderAll();
</script>
