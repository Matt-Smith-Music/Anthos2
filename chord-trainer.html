<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Chord Trainer</title>
<style>
:root{
  --accent:#4cc9f0; --accent-dim:#2b7f9c;
  --bg:#0d0f14; --panel:#161a22; --panel2:#1d222c; --line:#2a313e;
  --text:#e8eaf0; --dim:#8b93a7; --good:#7ee08a; --warn:#f0b45a;
  --r:12px; --fs:15px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font:var(--fs)/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:104px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}

/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:40;background:rgba(13,15,20,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding:8px 12px}
.back{border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:5px 11px;font-size:13px;color:var(--dim);text-decoration:none}
h1{font-size:19px;color:var(--accent)}
.sub{color:var(--dim);font-size:12.5px;margin-left:auto}

/* ---- buttons ---- */
.btn{border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  cursor:pointer;transition:border-color .12s,background .12s;font-size:14px}
.btn:hover{border-color:#3b4557}
.btn:active{transform:translateY(1px)}
.btn.on{border-color:var(--accent);color:var(--accent);
  background:linear-gradient(180deg,rgba(76,201,240,.18),rgba(76,201,240,.06))}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn.play{border-color:var(--accent-dim);color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* single line that scrolls sideways — keeps the controls off the chords */
.tline.strip-row,.strip-row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;padding-bottom:2px}
.strip-row::-webkit-scrollbar{display:none}
.strip-row .btn{flex:0 0 auto}
.stage .btn{flex:0 0 auto}
.row.tight{gap:4px}
.lbl{color:var(--dim);font-size:12px;margin-right:2px}

/* ---- tabs ---- */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .btn{white-space:nowrap}

/* ---- panels ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px;margin:8px 0}
.panel h2{font-size:15px;margin-bottom:6px}
.note{color:var(--dim);font-size:13px}
.note b{color:var(--text);font-weight:600}
.divider{height:1px;background:var(--line);margin:10px 0}

/* ---- chord cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.card.sel{border-color:var(--accent)}
.cname{font-size:15px;font-weight:600;letter-spacing:-.01em}
.cmeta{color:var(--dim);font-size:11.5px;text-align:center;line-height:1.35}
.cbtns{display:flex;gap:4px;margin-top:2px}
svg{display:block;touch-action:manipulation}

/* ---- scale strip ---- */
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;
  background:var(--panel2);cursor:pointer;color:var(--dim)}
.chip.on{border-color:var(--accent);color:var(--accent)}

/* ---- chart ---- */
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.bar{border:1px solid var(--line);border-radius:8px;padding:9px 4px;text-align:center;
  background:var(--panel2);font-size:14px;min-height:44px;display:flex;
  align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.bar.now{border-color:var(--accent);background:rgba(76,201,240,.12)}
.bar span{font-weight:600}
.bar .two{font-size:12.5px;opacity:.85}

/* ---- transport ---- */
.transport{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(13,15,20,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.transport .wrap{display:flex;flex-direction:column;gap:5px}
.tline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.big{font-size:15px;padding:7px 14px;border-radius:11px}
.nowplaying{font-size:13px;color:var(--dim);flex:1;min-width:120px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowplaying b{color:var(--accent)}
/* tempo: big enough to hit, hold to repeat, drag the number */
.bpmgrp{display:flex;align-items:stretch;height:44px;border:1px solid var(--line);
  border-radius:11px;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.bpmgrp button{border:0;background:none;color:var(--text);font-size:20px;font-weight:600;
  min-width:44px;padding:0 12px;cursor:pointer}
.bpmgrp button:active{background:rgba(255,255,255,.06)}
.bpmgrp #tTempoLbl{min-width:62px;font-size:17px;border-left:1px solid var(--line);
  border-right:1px solid var(--line);touch-action:none;cursor:ns-resize;color:var(--accent)}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:9px;padding:5px 7px;font:inherit;font-size:13px;max-width:44vw}

/* ---- misc ---- */
.stage{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.stagebtn{min-width:0;white-space:nowrap}
.hide{display:none}
.deg{font-variant-numeric:tabular-nums}
.warnbox{border-left:2px solid var(--warn);padding-left:10px;color:var(--dim);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:90;
  background:var(--panel2);border:1px solid var(--accent);border-radius:10px;
  padding:8px 14px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .chart{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <a class="back" href="index.html">‹ Apps</a>
  <h1>Chord Trainer</h1>
  <span class="sub" id="subline">guitar</span>
</div></div>

<div class="wrap">
  <div class="row strip-row" style="padding:8px 0 0">
    <div class="row tight" id="instRow" style="flex-wrap:nowrap"></div>
    <span style="width:1px;height:20px;background:var(--line);flex:0 0 auto"></span>
    <div class="row tight" id="showRow" style="flex-wrap:nowrap"></div>
  </div>
  <div class="row strip-row" style="padding:6px 0 0">
    <span class="lbl" style="flex:0 0 auto">Grade</span>
    <div class="row tight" id="gradeRow" style="flex-wrap:nowrap"></div>
  </div>
  <div class="row strip-row" style="padding:6px 0 0">
    <span class="lbl" style="flex:0 0 auto">Key</span>
    <div class="row tight" id="rootRow" style="flex-wrap:nowrap"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</div>

<div class="transport"><div class="wrap">
  <div class="tline">
    <button class="btn big play" id="tPlay">▶ Play</button>
    <span class="nowplaying" id="tNow">Pick a chord or a progression</span>
    <button class="btn sm" id="tMash">Mash</button>
    <button class="btn sm" id="tStop">Stop</button>
  </div>
  <div class="tline strip-row">
    <select id="tProg"></select>
    <select id="tStyle"></select>
    <select id="tMetre"></select>
    <div class="bpmgrp" style="flex:0 0 auto"><button id="tDn" aria-label="Slower">−</button><button id="tTempoLbl" title="Drag up or down to change">120</button><button id="tUp" aria-label="Faster">+</button></div>
    <button class="btn sm" id="tPdf" style="flex:0 0 auto">PDF</button>
    <button class="btn sm" id="tMidi" style="flex:0 0 auto">MIDI</button>
    <button class="btn sm" id="tCount" style="flex:0 0 auto">Count-in</button>
    <button class="btn sm on" id="tDrums" style="flex:0 0 auto">Drums</button>
    <button class="btn sm on" id="tBass" style="flex:0 0 auto">Bass</button>
    <button class="btn sm on" id="tComp" style="flex:0 0 auto">Chords</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script src="room-sync.js"></script>
<script src="anthos-sync.js"></script>
<script>
/* ============================================================
   Chord Trainer — theory core
   Pure logic, no DOM. Tested in node, then inlined into the page.
   ============================================================ */

const SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];

/* Roots offered in the app, with the spelling guitarists actually use */
const ROOTS = [
  {pc:0,  name:'C'},  {pc:1, name:'Db'}, {pc:2,  name:'D'},  {pc:3,  name:'Eb'},
  {pc:4,  name:'E'},  {pc:5, name:'F'},  {pc:6,  name:'F#'}, {pc:7,  name:'G'},
  {pc:8,  name:'Ab'}, {pc:9, name:'A'},  {pc:10, name:'Bb'}, {pc:11, name:'B'}
];

const pcName = (pc, flat) => (flat ? FLAT : SHARP)[((pc % 12) + 12) % 12];

/* Spelling. A chord tone takes its letter from where it sits above the root,
   not from whether the key happens to use sharps. The third of G minor is a
   B of some kind, so it is B flat — never A sharp. */
const LETTERS = ['C','D','E','F','G','A','B'];
const LETTER_PC = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};
/* how many letter-steps above the root each degree sits */
const DEG_STEP = {'1':0,'b9':1,'9':1,'#9':1,'2':1,'b3':2,'3':2,
  '11':3,'#11':3,'4':3,'b5':4,'5':4,'#5':4,'b13':5,'13':5,'6':5,'b7':6,'7':6};
const ACC = {'-2':'bb','-1':'b','0':'','1':'#','2':'##'};
function spell(rootName, degLabel, pc, type){
  const m = /^([A-G])(#|b)?/.exec(rootName || '');
  let step = DEG_STEP[degLabel];
  /* a chord can override where a tone sits: the bb7 of a dim7 is a 7th */
  const ex = type && CHORDS[type] && CHORDS[type].sp;
  if (ex){ const semis = Object.keys(ex).find(k => DEG[+k % 12] === degLabel || IVNAME[+k] === degLabel);
    if (semis != null) step = ex[semis]; }
  if (!m || step == null) return pcName(pc, /b/.test(rootName || ''));
  const letter = LETTERS[(LETTERS.indexOf(m[1]) + step) % 7];
  let acc = (((pc - LETTER_PC[letter]) % 12) + 12) % 12;
  if (acc > 6) acc -= 12;
  const mark = ACC[String(acc)];
  return mark == null ? pcName(pc, true) : letter + mark;
}
/* the name a root goes by, from the table rather than a blanket rule */
const rootName = pc => (ROOTS.find(r => r.pc === ((pc % 12) + 12) % 12) || {}).name
  || pcName(pc, false);

/* Degree labels, by semitone distance from the root, per chord family.
   Used for the "Showing: degrees" readout. */
const DEG = {
  0:'1', 1:'b9', 2:'9', 3:'b3', 4:'3', 5:'11', 6:'b5', 7:'5',
  8:'#5', 9:'13', 10:'b7', 11:'7'
};

/* Scale steps are named as steps, not as chord extensions. */
const SDEG = {
  0:'1', 1:'b2', 2:'2', 3:'b3', 4:'3', 5:'4', 6:'b5', 7:'5',
  8:'b6', 9:'6', 10:'b7', 11:'7'
};

/* The name an interval takes in a chord depends on the chord.
   The 5 semitones in Csus4 is a 4th; in C11 it is an 11th.
   The 9 semitones in C6 is a 6th; in C13 it is a 13th. */
const IVNAME = {0:'1',2:'2',3:'b3',4:'3',5:'4',6:'b5',7:'5',8:'#5',9:'6',
  10:'b7',11:'7',13:'b9',14:'9',15:'#9',17:'11',18:'#11',20:'b13',21:'13'};
function degNamer(type){
  const map = {};
  for (const i of (CHORDS[type] ? CHORDS[type].iv : []))
    if (IVNAME[i]) map[((i % 12) + 12) % 12] = IVNAME[i];
  return semis => {
    const pc = ((semis % 12) + 12) % 12;
    return map[pc] != null ? map[pc] : DEG[pc];
  };
}

/* ------------------------------------------------------------
   Chord formulas. Semitones from the root.
   'core' = the notes a voicing must not contradict.
   'drop' = tones that may be left out of a grip (usually 5, 1).
   ------------------------------------------------------------ */
const CHORDS = {
  /* triads */
  'maj':      {label:'',        iv:[0,4,7],            family:'major'},
  'min':      {label:'m',       iv:[0,3,7],            family:'minor'},
  'dim':      {label:'dim',     iv:[0,3,6],            family:'dim'},
  'aug':      {label:'aug',     iv:[0,4,8],            family:'aug'},
  'sus2':     {label:'sus2',    iv:[0,2,7],            family:'sus'},
  'sus4':     {label:'sus4',    iv:[0,5,7],            family:'sus'},
  '5':        {label:'5',       iv:[0,7],              family:'power'},
  /* sixths + added notes */
  '6':        {label:'6',       iv:[0,4,7,9],          family:'major'},
  'm6':       {label:'m6',      iv:[0,3,7,9],          family:'minor'},
  'add9':     {label:'add9',    iv:[0,4,7,14],         family:'major'},
  'madd9':    {label:'m(add9)', iv:[0,3,7,14],         family:'minor'},
  '69':       {label:'6/9',     iv:[0,4,7,9,14],       family:'major'},
  'm69':      {label:'m6/9',    iv:[0,3,7,9,14],       family:'minor'},
  /* sevenths */
  'maj7':     {label:'maj7',    iv:[0,4,7,11],         family:'major'},
  '7':        {label:'7',       iv:[0,4,7,10],         family:'dom'},
  'm7':       {label:'m7',      iv:[0,3,7,10],         family:'minor'},
  'm7b5':     {label:'m7b5',    iv:[0,3,6,10],         family:'halfdim'},
  'dim7':     {label:'dim7',    iv:[0,3,6,9],          family:'dim', sp:{9:6}},
  'mmaj7':    {label:'m(maj7)', iv:[0,3,7,11],         family:'minor'},
  '7sus4':    {label:'7sus4',   iv:[0,5,7,10],         family:'sus'},
  '7b5':      {label:'7b5',     iv:[0,4,6,10],         family:'dom'},
  '7s5':      {label:'7#5',     iv:[0,4,8,10],         family:'dom'},
  'maj7s5':   {label:'maj7#5',  iv:[0,4,8,11],         family:'major'},
  'maj7s11':  {label:'maj7#11', iv:[0,4,7,11,18],      family:'major'},
  /* extensions */
  '9':        {label:'9',       iv:[0,4,7,10,14],      family:'dom'},
  'maj9':     {label:'maj9',    iv:[0,4,7,11,14],      family:'major'},
  'm9':       {label:'m9',      iv:[0,3,7,10,14],      family:'minor'},
  '11':       {label:'11',      iv:[0,4,7,10,14,17],   family:'dom'},
  'm11':      {label:'m11',     iv:[0,3,7,10,14,17],   family:'minor'},
  '13':       {label:'13',      iv:[0,4,7,10,14,21],   family:'dom'},
  'maj13':    {label:'maj13',   iv:[0,4,7,11,14,21],   family:'major'},
  'm13':      {label:'m13',     iv:[0,3,7,10,14,21],   family:'minor'},
  '9sus4':    {label:'9sus4',   iv:[0,5,7,10,14],      family:'sus'},
  /* altered dominants */
  '7b9':      {label:'7b9',     iv:[0,4,7,10,13],      family:'dom'},
  '7s9':      {label:'7#9',     iv:[0,4,7,10,15],      family:'dom'},
  '7s11':     {label:'7#11',    iv:[0,4,7,10,18],      family:'dom'},
  '7b13':     {label:'7b13',    iv:[0,4,7,10,20],      family:'dom'},
  '13b9':     {label:'13b9',    iv:[0,4,7,10,13,21],   family:'dom'},
  '7s5b9':    {label:'7#5b9',   iv:[0,4,8,10,13],      family:'dom'},
  '7s5s9':    {label:'7#5#9',   iv:[0,4,8,10,15],      family:'dom'},
  '7b5b9':    {label:'7b5b9',   iv:[0,4,6,10,13],      family:'dom'},
  '7b5s9':    {label:'7b5#9',   iv:[0,4,6,10,15],      family:'dom'}
};

/* Which tones a four-note grip is allowed to leave out.
   A grip is wrong if it adds a note the chord hasn't got;
   it is only thin if it misses one of these. */
const OMITTABLE = {
  '9':[7], 'maj9':[7], 'm9':[7], '11':[7,4], 'm11':[7], '13':[7,14],
  'maj13':[7,14], 'm13':[7,14], '7b9':[7], '7s9':[7], '7s11':[7],
  '7b13':[7], '13b9':[7,14], '7s5b9':[7], '7s5s9':[7], '7b5b9':[7],
  '7b5s9':[7], 'maj7s11':[7], '69':[7], 'm69':[7], '9sus4':[7]
};

/* ------------------------------------------------------------
   Tunings. MIDI note of each open string, low to high.
   ------------------------------------------------------------ */
const TUNINGS = {
  guitar:  {name:'Guitar',       strings:[40,45,50,55,59,64], labels:['E','A','D','G','B','E']},
  bass4:   {name:'Bass',         strings:[28,33,38,43],       labels:['E','A','D','G']},
  bass5:   {name:'Bass (5)',     strings:[23,28,33,38,43],    labels:['B','E','A','D','G']}
};

/* ------------------------------------------------------------
   Open chord library (guitar, standard tuning).
   frets low→high, -1 = don't play. Every shape is checked by
   test.js against its formula before it ships.
   ------------------------------------------------------------ */
const OPEN = [
  /* --- major triads --- */
  {r:4,  t:'maj',  f:[0,2,2,1,0,0],    fg:[0,2,3,1,0,0], grp:'Major'},
  {r:9,  t:'maj',  f:[-1,0,2,2,2,0],   fg:[0,0,1,2,3,0], grp:'Major'},
  {r:2,  t:'maj',  f:[-1,-1,0,2,3,2],  fg:[0,0,0,1,3,2], grp:'Major'},
  {r:7,  t:'maj',  f:[3,2,0,0,0,3],    fg:[2,1,0,0,0,3], grp:'Major'},
  {r:7,  t:'maj',  f:[3,2,0,0,3,3],    fg:[2,1,0,0,3,4], grp:'Major', alt:'big G'},
  {r:0,  t:'maj',  f:[-1,3,2,0,1,0],   fg:[0,3,2,0,1,0], grp:'Major'},
  {r:5,  t:'maj',  f:[-1,-1,3,2,1,1],  fg:[0,0,3,2,1,1], grp:'Major', alt:'small F'},
  /* --- minor triads --- */
  {r:4,  t:'min',  f:[0,2,2,0,0,0],    fg:[0,2,3,0,0,0], grp:'Minor'},
  {r:9,  t:'min',  f:[-1,0,2,2,1,0],   fg:[0,0,2,3,1,0], grp:'Minor'},
  {r:2,  t:'min',  f:[-1,-1,0,2,3,1],  fg:[0,0,0,2,3,1], grp:'Minor'},
  /* --- dominant sevenths --- */
  {r:4,  t:'7',    f:[0,2,0,1,0,0],    fg:[0,2,0,1,0,0], grp:'Dominant 7'},
  {r:4,  t:'7',    f:[0,2,2,1,3,0],    fg:[0,2,3,1,4,0], grp:'Dominant 7', alt:'with the 5th on top'},
  {r:9,  t:'7',    f:[-1,0,2,0,2,0],   fg:[0,0,2,0,3,0], grp:'Dominant 7'},
  {r:2,  t:'7',    f:[-1,-1,0,2,1,2],  fg:[0,0,0,2,1,3], grp:'Dominant 7'},
  {r:7,  t:'7',    f:[3,2,0,0,0,1],    fg:[3,2,0,0,0,1], grp:'Dominant 7'},
  {r:0,  t:'7',    f:[-1,3,2,3,1,0],   fg:[0,3,2,4,1,0], grp:'Dominant 7'},
  {r:11, t:'7',    f:[-1,2,1,2,0,2],   fg:[0,2,1,3,0,4], grp:'Dominant 7'},
  {r:5,  t:'7',    f:[-1,-1,3,2,4,1],  fg:[0,0,3,2,4,1], grp:'Dominant 7'},
  /* --- major sevenths --- */
  {r:0,  t:'maj7', f:[-1,3,2,0,0,0],   fg:[0,3,2,0,0,0], grp:'Major 7'},
  {r:9,  t:'maj7', f:[-1,0,2,1,2,0],   fg:[0,0,3,1,4,0], grp:'Major 7'},
  {r:2,  t:'maj7', f:[-1,-1,0,2,2,2],  fg:[0,0,0,1,2,3], grp:'Major 7'},
  {r:4,  t:'maj7', f:[0,2,1,1,0,-1],   fg:[0,3,1,2,0,0], grp:'Major 7'},
  {r:7,  t:'maj7', f:[3,2,0,0,0,2],    fg:[3,2,0,0,0,1], grp:'Major 7'},
  {r:5,  t:'maj7', f:[-1,-1,3,2,1,0],  fg:[0,0,3,2,1,0], grp:'Major 7'},
  /* --- minor sevenths --- */
  {r:4,  t:'m7',   f:[0,2,0,0,0,0],    fg:[0,2,0,0,0,0], grp:'Minor 7'},

     n:'Everything: rootless, quartal, upper structures and reharmonising.'}
};
function gradeAllows(g){
  const types = new Set(), groups = new Set(), barre = new Set(), stages = new Set();
  for (let i = 1; i <= g; i++){
    const a = GRADE_ADD[i]; if (!a) continue;
    a.types.forEach(t => types.add(t));
    a.groups.forEach(x => groups.add(x));
    a.barre.forEach(x => barre.add(x));
    a.stages.forEach(x => stages.add(x));
  }
  return {types, groups, barre, stages};
}

/* ------------------------------------------------------------
   Barre chords. These are the open shapes made movable: the root
   sits on the 6th, 5th or 4th string and the whole shape slides up.
   Built from the OPEN library above, so they inherit its checking.
   ------------------------------------------------------------ */
const BARRE_SETS = [
  {id:'E', root:4, low:0, name:'Root on the 6th string', shape:'E shape'},
  {id:'A', root:9, low:1, name:'Root on the 5th string', shape:'A shape'},
  {id:'D', root:2, low:2, name:'Root on the 4th string', shape:'D shape'}
];
function barreShapes(setId){
  const set = BARRE_SETS.find(s => s.id === setId);
  return OPEN.filter(o =>
    o.r === set.root && o.f[set.low] === 0 &&
    o.f.slice(0, set.low).every(f => f === -1) && o.t !== '5');
}
/* move a shape so its root lands on the wanted pitch class */
function barreAt(shape, rootPc, setId){
  const set = BARRE_SETS.find(s => s.id === setId);
  const off = (((rootPc - set.root) % 12) + 12) % 12;
  return {frets: shape.f.map(f => f < 0 ? -1 : f + off), off, type: shape.t, set};
}

/* ============================================================
   Voicing generator
   Everything below is worked out from the chord's own notes,
   so a voicing can't disagree with its chord.
   ============================================================ */

/* Four-note types that drop voicings are built from. */
const DROP_TYPES = ['maj7','7','m7','m7b5','dim7','mmaj7','6','m6'];

/* Close position, as semitones above the root, for a given inversion. */
function closePos(iv, inv){
  const n = iv.length, out = [];
  for (let k = 0; k < n; k++) out.push(iv[(inv + k) % n]);
  for (let k = 1; k < out.length; k++) while (out[k] <= out[k-1]) out[k] += 12;
  return out;
}

const dropN = (v, n) => {          /* drop the nth voice from the top */
  const a = v.slice(), i = a.length - n, moved = a[i] - 12;
  a.splice(i, 1); a.push(moved);
  return a.sort((x, y) => x - y);
};
const drop2  = v => dropN(v, 2);
const drop3  = v => dropN(v, 3);
const drop24 = v => {                /* drop the 2nd and 4th voices from the top */
  const a = v.slice(), n = a.length;
  return [a[n-4] - 12, a[n-2] - 12, a[n-3], a[n-1]].sort((x, y) => x - y);
};

/* String sets, named low→high by string index (0 = lowest string). */
const SETS_GUITAR = {
  drop2: [
    {ix:[2,3,4,5], name:'strings 4·3·2·1'},
    {ix:[1,2,3,4], name:'strings 5·4·3·2'},
    {ix:[0,1,2,3], name:'strings 6·5·4·3'}
  ],
  drop3: [
    {ix:[1,3,4,5], name:'strings 5·3·2·1', skip:[2]},
    {ix:[0,2,3,4], name:'strings 6·4·3·2', skip:[1]}
  ],
  drop24: [
    {ix:[1,2,4,5], name:'strings 5·4·2·1', skip:[3]},
    {ix:[0,1,3,4], name:'strings 6·5·3·2', skip:[2]},
    {ix:[0,2,3,5], name:'strings 6·4·3·1', skip:[1,4]}
  ]
};

/* Put a set of pitches (semitones above the root) on a set of strings.
   Returns every playable placement up the neck. */
function place(offsets, rootPc, set, tuning, opt){
  opt = opt || {};
  const maxFret = opt.maxFret == null ? 15 : opt.maxFret;
  const maxSpan = opt.maxSpan == null ? 5  : opt.maxSpan;
  const strings = tuning.strings, out = [];
  for (let oct = 1; oct <= 7; oct++){
    const rootMidi = rootPc + 12 * oct;
    const frets = new Array(strings.length).fill(-1);
    let ok = true, used = [];
    for (let i = 0; i < set.length; i++){
      const fret = rootMidi + offsets[i] - strings[set[i]];
      if (fret < 0 || fret > maxFret){ ok = false; break; }
      frets[set[i]] = fret;
      if (fret > 0) used.push(fret);
    }
    if (!ok) continue;
    const span = used.length ? Math.max(...used) - Math.min(...used) : 0;
    if (span > maxSpan) continue;
    const low = used.length ? Math.min(...used) : 0;
    out.push({frets, span, low, oct});
  }
  return out;
}

/* All drop 2 / drop 3 / drop 2&4 voicings for a chord, per string set. */
function dropVoicings(type, rootPc, kind, tuning, sets){
  const iv = CHORDS[type].iv.slice(0, 4);
  const fn = kind === 'drop2' ? drop2 : kind === 'drop3' ? drop3 : drop24;
  const list = sets || SETS_GUITAR[kind] || SETS_GUITAR.drop2;
  const res = [];
  for (const set of list){
    for (let inv = 0; inv < 4; inv++){
      const v = fn(closePos(iv, inv));
      const base = v[0];
      const rel = v.map(x => x - base);                 /* shape, from its own bass */
      const bassOffset = ((base % 12) + 12) % 12;       /* which chord tone is in the bass */
      const offsets = rel.map(x => x + bassOffset);
      for (const p of place(offsets, rootPc, set.ix, tuning, {maxSpan: kind === 'drop3' ? 6 : 5})){
        res.push({
          type, kind, inv, set: set.name, skip: set.skip || [],
          frets: p.frets, span: p.span, low: p.low,
          bass: (rootPc + bassOffset) % 12,
          degrees: offsets.map(o => DEG[((o % 12) + 12) % 12])
        });
      }
    }
  }
  res.sort((a, b) => a.low - b.low || a.inv - b.inv);
  return res;
}

/* Shell voicings: root, 3rd (or 4th), 7th — the two-handed jazz staple. */
function shells(type, rootPc, tuning){
  const iv = CHORDS[type].iv;
  const third = iv.find(x => x === 3 || x === 4 || x === 5);
  const sev   = iv.find(x => x === 9 || x === 10 || x === 11);
  if (third == null || sev == null) return [];
  const forms = [
    {name:'1 · 7 · 3',  offs:[0, sev, third + 12]},
    {name:'1 · 3 · 7',  offs:[0, third, sev]}
  ];
  const out = [];
  const sets = tuning.strings.length >= 6
    ? [{ix:[0,1,2], name:'root on 6'}, {ix:[1,2,3], name:'root on 5'},
       {ix:[0,2,3], name:'root on 6, string 5 muted', skip:[1]},
       {ix:[1,3,4], name:'root on 5, string 4 muted', skip:[2]}]
    : [{ix:[0,1,2], name:'root on E'}, {ix:[1,2,3], name:'root on A'},
       {ix:[0,2,3], name:'root on E, A muted', skip:[1]}];
  for (const f of forms){
    for (const s of sets){
      if (new Set(s.ix).size !== s.ix.length) continue;
      for (const p of place(f.offs, rootPc, s.ix, tuning, {maxSpan:5})){
        out.push({type, kind:'shell', name:f.name, set:s.name, skip:s.skip||[],
                  frets:p.frets, span:p.span, low:p.low,
                  degrees:f.offs.map(o => DEG[((o % 12) + 12) % 12])});
      }
    }
  }
  out.sort((a,b) => a.low - b.low);
  return out;
}

/* Rootless A and B forms. Bass player (or your thumb) supplies the root. */
const ROOTLESS = {
  'm7':   {A:[3,7,10,14],  B:[10,14,15,19]},
  '7':    {A:[4,7,10,14],  B:[10,14,16,19]},
  'maj7': {A:[4,7,11,14],  B:[11,14,16,19]},
  '7b9':  {A:[4,7,10,13],  B:[10,13,16,19]},
  '7s9':  {A:[4,7,10,15],  B:[10,15,16,19]},
  '7b13': {A:[4,8,10,14],  B:[10,14,16,20]},
  'm7b5': {A:[3,6,10,14],  B:[10,14,15,18]},
  '13':   {A:[4,9,10,14],  B:[10,14,16,21]},
  '7s11': {A:[4,10,14,18], B:[10,14,18,16+12]}
};

function rootlessVoicings(type, rootPc, tuning){
  const r = ROOTLESS[type]; if (!r) return [];
  const sets = tuning.strings.length >= 6
    ? [{ix:[2,3,4,5], name:'strings 4·3·2·1'}, {ix:[1,2,3,4], name:'strings 5·4·3·2'}]
    : [{ix:[0,1,2,3], name:'all four strings'}];
  const out = [];
  for (const form of ['A','B']){
    const offs = r[form], base = offs[0];
    for (const s of sets){
      for (const p of place(offs.map(o => o - base + ((base % 12) + 12) % 12),
                            rootPc, s.ix, tuning, {maxSpan:5})){
        out.push({type, kind:'rootless', name:form + ' form', set:s.name,
                  frets:p.frets, span:p.span, low:p.low,
                  degrees:offs.map(o => DEG[((o % 12) + 12) % 12])});
      }
    }
  }
  out.sort((a,b) => a.low - b.low);
  return out;
}

/* Quartal stacks. The So What voicing is three 4ths with a 3rd on top. */
/* Fourths only stack up into something usable over modal chords. Over a
   diminished, augmented or altered chord they stop describing the chord. */
const QUARTAL_OK = ['maj','min','m7','m9','m11','m13','m6','m69','7','9','13',
  '7sus4','9sus4','sus4','maj7','maj9','maj13','6','69'];
function quartalStack(type){
  if (!QUARTAL_OK.includes(type)) return null;
  const fam = CHORDS[type].family;
  return fam === 'sus'   ? [0,5,10,14,19]
       : fam === 'minor' ? [0,5,10,15,19]
       : fam === 'dom'   ? [0,5,10,16,21]
       : fam === 'major' ? [2,7,11,16,21]
       : [0,5,10,15,19];
}
function quartal(type, rootPc, tuning){
  const from = quartalStack(type);
  if (!from) return [];
  const out = [];
  const sets = tuning.strings.length >= 6
    ? [{ix:[1,2,3,4,5], name:'strings 5→1'}, {ix:[0,1,2,3,4], name:'strings 6→2'}]
    : [{ix:[0,1,2,3], name:'all four strings'}];
  for (const s of sets){
    const offs = from.slice(0, s.ix.length);
    for (const p of place(offs, rootPc, s.ix, tuning, {maxSpan:5})){
      out.push({type, kind:'quartal', name:'So What stack', set:s.name,
                frets:p.frets, span:p.span, low:p.low,
                degrees:offs.map(o => DEG[((o % 12) + 12) % 12])});
    }
  }
  out.sort((a,b) => a.low - b.low);
  return out;
}

/* ---------- keyboard ---------- */
const WHITE = [0,2,4,5,7,9,11];
const isBlack = pc => !WHITE.includes(((pc % 12) + 12) % 12);

/* Put a set of semitone offsets into a comfortable register. */
function inRegister(offsets, rootPc, centre, lo, hi){
  lo = lo == null ? 48 : lo; hi = hi == null ? 86 : hi;
  const base = rootPc + 12 * Math.round((centre - rootPc - offsets[0]) / 12);
  let notes = offsets.map(o => base + o);
  const span = Math.max(...notes) - Math.min(...notes);
  if (span <= hi - lo){
    while (Math.max(...notes) > hi) notes = notes.map(n => n - 12);
    while (Math.min(...notes) < lo) notes = notes.map(n => n + 12);
  }
  return notes;
}

/* Right-hand fingering: thumb on the lowest, 5 on the top, the rest
   spread between. Not a substitute for a teacher, but it is the
   grouping a pianist would actually reach for. */
function rhFingers(notes){
  const n = notes.length;
  if (n <= 1) return [1];
  if (n === 2) return [1, 5];
  if (n === 3) return [1, notes[1] - notes[0] > 4 ? 3 : 2, 5];
  if (n === 4) return [1, 2, 3, 5];
  return [1, 2, 3, 4, 5].slice(0, n);
}

/* Every piano voicing the app can build, as offsets from the root. */
function pianoVoicings(type, rootPc, kind){
  const out = [];
  const iv = CHORDS[type] ? CHORDS[type].iv : null;
  if (!iv) return out;
  const push = (lhOff, rhOff, name, sub) => {
    const lh = lhOff.length ? inRegister(lhOff, rootPc, 45, 33, 59) : [];
    const rh = inRegister(rhOff, rootPc, 62);
    out.push({lh, rh, name, sub:sub || '', kind,
              degrees: rhOff.map(o => DEG[((o % 12) + 12) % 12])});
  };

  if (kind === 'shell'){
    const third = iv.find(x => x === 3 || x === 4 || x === 5);
    const sev = iv.find(x => x === 9 || x === 10 || x === 11);
    if (third == null || sev == null) return out;
    push([0], [third, sev], 'Left hand root, right hand 3 and 7', '3 · 7');
    push([0], [sev, third + 12], 'Same two notes, other way up', '7 · 3');
    push([0, sev], [third + 12], 'Root and 7th in the left hand', 'LH 1 · 7');
    return out;
  }
  if (kind === 'rootless'){
    const r = ROOTLESS[type]; if (!r) return out;
    push([], r.A, 'A form — starts on the 3rd', 'no root, the bass has it');
    push([], r.B, 'B form — starts on the 7th', 'no root, the bass has it');
    push([0], r.A, 'A form with the root underneath', 'for playing alone');
    return out;
  }
  if (kind === 'drop2' || kind === 'drop3' || kind === 'drop24'){
    const four = iv.slice(0, 4);
    if (four.length < 4) return out;
    const fn = kind === 'drop2' ? drop2 : kind === 'drop3' ? drop3 : drop24;
    for (let inv = 0; inv < 4; inv++){
      const v = fn(closePos(four, inv));
      const base = v[0], bassOff = ((base % 12) + 12) % 12;
      const offs = v.map(x => x - base + bassOff);
      push([0], offs,
        ['Root position','1st inversion','2nd inversion','3rd inversion'][inv],
        kind === 'drop2' ? 'drop 2' : kind === 'drop3' ? 'drop 3' : 'drop 2 & 4');
    }
    return out;
  }
  if (kind === 'close'){
    const four = iv.slice(0, 4);
    for (let inv = 0; inv < Math.min(4, four.length); inv++){
      const v = closePos(four, inv), base = v[0], bassOff = ((base % 12) + 12) % 12;
      push([0], v.map(x => x - base + bassOff),
        ['Root position','1st inversion','2nd inversion','3rd inversion'][inv], 'close position');
    }
    return out;
  }
  if (kind === 'quartal'){
    const offs = quartalStack(type);
    if (!offs) return out;
    push([0], offs.slice(1), 'So What stack', 'fourths');
    push([], offs, 'Both hands, no root below', 'fourths');
    return out;
  }
  if (kind === 'gospel'){
    GOSPEL.filter(g => g.type === type).forEach(g => push(g.lh, g.rh, g.n, 'gospel'));
    return out;
  }
  if (kind === 'ust'){
    if (!['7','9','13'].includes(type)) return out;
    const sev = iv.find(x => x === 9 || x === 10 || x === 11) || 10;
    const third = 4;
    UST.forEach(u => {
      const triad = (u.q === 'min' ? [0,3,7] : [0,4,7]).map(x => x + u.off);
      push([0, sev], triad.map(x => x + 12),
        (u.q === 'min' ? 'minor' : 'major') + ' triad on the ' + DEG[u.off % 12], u.gives);
    });
    return out;
  }
  return out;
}

/* ---------- chord detection, for imported files ---------- */
/* Deliberately a short list. Offering every altered dominant would make
   the guesses worse, not better. */
const DETECT = ['maj','min','7','maj7','m7','m7b5','dim7','sus4','sus2',
  '6','m6','69','add9','9','maj9','m9','13','7b9','aug','5','mmaj7','7sus4'];

function detectChord(weights, bassPc){
  /* weights: 12 numbers, how long each pitch class sounded */
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return null;
  let best = null;
  for (let r = 0; r < 12; r++){
    for (const type of DETECT){
      const tmpl = new Set(CHORDS[type].iv.map(i => (r + i) % 12));
      let hit = 0, extra = 0;
      for (let pc = 0; pc < 12; pc++){
        if (!weights[pc]) continue;
        if (tmpl.has(pc)) hit += weights[pc]; else extra += weights[pc];
      }
      const core = CHORDS[type].iv.filter(i => i === 0 || i === 3 || i === 4
        || i === 10 || i === 11).map(i => (r + i) % 12);
      let missing = 0;
      for (const pc of core) if (!weights[pc]) missing += 1;
      let score = hit / total - 1.25 * (extra / total)
                - 0.13 * missing - 0.035 * tmpl.size;
      if (bassPc === r) score += 0.16;
      if (bassPc != null && !tmpl.has(bassPc)) score -= 0.10;
      if (!best || score > best.score) best = {root:r, type, score};
    }
  }
  return best;
}

const WB = {
  ctx:null, out:null, noiseBuf:null,
  init(ctx, dest){
    if (this.ctx) return;
    this.ctx = ctx; this.out = dest;
    const n = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = n;
  },
  noise(t,l,vel,out,mod){ const ctx=this.ctx,s=ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type=l.t; f.frequency.setValueAtTime(l.f*(mod.nf||1),t); f.Q.value=l.q||1; if(l.to) f.frequency.exponentialRampToValueAtTime(l.to,t+l.d);
    const g=ctx.createGain(); const st=t+(l.dl||0),d=l.d*(mod.nd||1); g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(l.a*vel,st+.002); g.gain.exponentialRampToValueAtTime(.001,st+d+.002);
    s.connect(f); f.connect(g); g.connect(out); s.start(st); s.stop(st+d+.05); },
  osc(t,l,vel,out,mod,fmul){ const ctx=this.ctx,o=ctx.createOscillator(); o.type=mod.w||l.w||'sine';
    const f0=l.f*(fmul||1)*(mod.nf&&l.f>300?mod.nf:1); o.frequency.setValueAtTime(f0,t); if(l.to) o.frequency.exponentialRampToValueAtTime(Math.max(20,l.to*(fmul||1)),t+Math.min(l.d,.5));
    const g=ctx.createGain(),d=l.d*(mod.od||1); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(l.a*vel,t+(l.c||.002)); g.gain.exponentialRampToValueAtTime(.001,t+d+.002);
    o.connect(g); g.connect(out); o.start(t); o.stop(t+d+.05); },
  metal(t,m,vel,out,mod){ const ctx=this.ctx,g=ctx.createGain(),hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=m.hp||1000;
    const d=m.d*(mod.nd||1); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(m.a*vel,t+.002); g.gain.exponentialRampToValueAtTime(.001,t+d+.002);
    m.fs.forEach(r=>{const o=ctx.createOscillator(); o.type=m.w||'square'; o.frequency.value=m.f*r*(mod.nf||1); o.connect(hp); o.start(t); o.stop(t+d+.05);}); hp.connect(g); g.connect(out); },
  gong(t,m,vel,out){ const ctx=this.ctx,g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(m.a*vel*.22,t+.012); g.gain.linearRampToValueAtTime(m.a*vel*.3,t+.25); g.gain.exponentialRampToValueAtTime(.001,t+m.d); g.connect(out);
    [[1,1,1],[1.006,.5,1],[1.52,.55,.75],[1.98,.4,.6],[2.49,.32,.5],[3.02,.22,.4],[3.53,.15,.32],[4.2,.1,.25]].forEach(([r,amp,dk])=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=m.f*r; const eg=ctx.createGain(); eg.gain.setValueAtTime(amp,t); eg.gain.exponentialRampToValueAtTime(.001,t+m.d*dk); o.connect(eg); eg.connect(g); o.start(t); o.stop(t+m.d+.1); }); },
  hit(name, t, vel){
    if (!this.ctx) return;
    const v = V[name]; if (!v) return;
    vel = Math.max(.05, Math.min(1.4, vel == null ? 1 : vel));
    const ctx = this.ctx, mod = {};

    if (v.bp){ const b = ctx.createBiquadFilter(); b.type='bandpass'; b.frequency.value=v.bp.f; b.Q.value=v.bp.q; b.connect(vg); out = b; }

    if (v.gg) this.gong(t,v.gg,vel,out);
  }
