/* ============================================================
   Getting music in: MIDI files, PDF chord charts, pasted text
   ============================================================ */

/* ---------- MIDI ---------- */
function parseMidi(bytes){
  const dv = new DataView(bytes.buffer || bytes, bytes.byteOffset || 0, bytes.byteLength);
  let p = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(bytes[p++]); return s; };
  const u32 = () => { const v = dv.getUint32(p); p += 4; return v; };
  const u16 = () => { const v = dv.getUint16(p); p += 2; return v; };

  if (str(4) !== 'MThd') throw new Error('That is not a MIDI file.');
  const hlen = u32(); const format = u16(); const ntrk = u16(); const div = u16();
  p += hlen - 6;
  if (div & 0x8000) throw new Error('This file uses SMPTE timing, which the app cannot read.');
  const ppq = div;

  const notes = [], tempos = [], timeSigs = [], keySigs = [];
  for (let t = 0; t < ntrk; t++){
    if (p >= bytes.length) break;
    if (str(4) !== 'MTrk'){ break; }
    const len = u32(), end = p + len;
    let tick = 0, running = 0;
    const open = {};
    while (p < end){
      /* variable length delta */
      let d = 0, b;
      do { b = bytes[p++]; d = (d << 7) | (b & 0x7f); } while (b & 0x80);
      tick += d;
      let status = bytes[p];
      if (status & 0x80){ p++; running = status; } else status = running;
      const type = status & 0xf0, chan = status & 0x0f;
      if (status === 0xff){
        const meta = bytes[p++];
        let l = 0; do { b = bytes[p++]; l = (l << 7) | (b & 0x7f); } while (b & 0x80);
        if (meta === 0x51 && l === 3)
          tempos.push({tick, us:(bytes[p] << 16) | (bytes[p+1] << 8) | bytes[p+2]});
        if (meta === 0x58 && l >= 2)
          timeSigs.push({tick, num:bytes[p], den:Math.pow(2, bytes[p+1])});
        if (meta === 0x59 && l >= 2)
          keySigs.push({tick, sf:(bytes[p] << 24) >> 24, minor:bytes[p+1]});
        p += l;
      } else if (status === 0xf0 || status === 0xf7){
        let l = 0; do { b = bytes[p++]; l = (l << 7) | (b & 0x7f); } while (b & 0x80);
        p += l;
      } else if (type === 0x90 || type === 0x80){
        const pitch = bytes[p++], vel = bytes[p++];
        const key = chan + ':' + pitch;
        if (type === 0x90 && vel > 0){
          (open[key] = open[key] || []).push(tick);
        } else {
          const st = open[key] && open[key].shift();
          if (st != null && tick > st) notes.push({pitch, start:st, end:tick, chan, track:t});
        }
      } else if (type === 0xa0 || type === 0xb0 || type === 0xe0){ p += 2; }
      else if (type === 0xc0 || type === 0xd0){ p += 1; }
      else { p++; }
    }
    p = end;
  }
  notes.sort((a, b) => a.start - b.start || a.pitch - b.pitch);
  return {ppq, format, notes, tempos, timeSigs, keySigs};
}

/* Turn the notes into bars of chords. Percussion (channel 10) is ignored —
   it has no pitch worth reading. */
function midiToChart(m, opts){
  opts = opts || {};
  const notes = m.notes.filter(n => n.chan !== 9);
  if (!notes.length) throw new Error('No pitched notes in that file — is it a drum track?');
  const ts = m.timeSigs[0] || {num:4, den:4};
  const beatsPerBar = ts.num * (4 / ts.den);            /* in crotchets */
  const barTicks = beatsPerBar * m.ppq;
  const last = Math.max(...notes.map(n => n.end));
  const nBars = Math.min(opts.maxBars || 64, Math.max(1, Math.ceil(last / barTicks)));

  const segs = [];
  for (let b = 0; b < nBars; b++){
    for (let h = 0; h < 2; h++){
      const s = b * barTicks + h * barTicks / 2, e = s + barTicks / 2;
      const w = new Array(12).fill(0);
      let lowest = null, lowestPitch = 999;
      for (const n of notes){
        const ov = Math.min(n.end, e) - Math.max(n.start, s);
        if (ov <= 0) continue;
        w[n.pitch % 12] += ov;
        if (n.pitch < lowestPitch){ lowestPitch = n.pitch; lowest = n.pitch % 12; }
      }
      const got = detectChord(w, lowest);
      segs.push({bar:b, half:h, chord:got, empty:w.every(x => x === 0)});
    }
  }
  /* carry a chord through a silent half bar rather than leaving a hole */
  let prev = null;
  for (const s of segs){ if (s.empty || !s.chord) s.chord = prev; else prev = s.chord; }
  while (segs.length && !segs[0].chord) segs.shift();

  const bars = [];
  for (let b = 0; b < nBars; b++){
    const a = segs.find(s => s.bar === b && s.half === 0);
    const c = segs.find(s => s.bar === b && s.half === 1);
    const list = [];
    if (a && a.chord) list.push({rootPc:a.chord.root, type:a.chord.type});
    if (c && c.chord && (!a || !a.chord
        || c.chord.root !== a.chord.root || c.chord.type !== a.chord.type))
      list.push({rootPc:c.chord.root, type:c.chord.type});
    if (list.length) bars.push({chords:list, meter:ts.num + '/' + ts.den});
  }
  /* squash a run of identical bars down to something readable */
  const tempo = m.tempos.length ? Math.round(60000000 / m.tempos[0].us) : 120;
  return {bars, tempo, meter:ts.num + '/' + ts.den,
          key:m.keySigs.length ? m.keySigs[0] : null};
}

/* ---------- PDF text ---------- */
/* Only works on a PDF that still has its text in it. A scan is a picture
   of a chart, and there is nothing in the page to read. */
async function extractPdfText(bytes){
  const raw = Array.from(bytes).map(b => String.fromCharCode(b)).join('');
  const chunks = [];
  const re = /stream\r?\n?/g;
  let mm;
  while ((mm = re.exec(raw))){
    const start = mm.index + mm[0].length;
    const endIx = raw.indexOf('endstream', start);
    if (endIx < 0) continue;
    const head = raw.slice(Math.max(0, mm.index - 400), mm.index);
    let data = raw.slice(start, endIx);
    if (/FlateDecode/.test(head)){
      try {
        const arr = new Uint8Array(data.length);
        for (let i = 0; i < data.length; i++) arr[i] = data.charCodeAt(i) & 0xff;
        const ds = new DecompressionStream('deflate');
        const buf = await new Response(
          new Blob([arr]).stream().pipeThrough(ds)).arrayBuffer();
        data = new TextDecoder('latin1').decode(new Uint8Array(buf));
      } catch(e){ continue; }
    } else if (/\/Filter/.test(head)) continue;
    if (/(Tj|TJ)/.test(data)) chunks.push(data);
    re.lastIndex = endIx;
  }
  if (!chunks.length) return '';
  let out = '';
  for (const c of chunks){
    const tre = /\((?:\\.|[^\\()])*\)\s*Tj|\[((?:\((?:\\.|[^\\()])*\)|[^\]])*)\]\s*TJ|T\*|Td|TD|ET/g;
    let t;
    while ((t = tre.exec(c))){
      const s = t[0];
      if (s === 'T*' || s === 'Td' || s === 'TD' || s === 'ET'){ out += '\n'; continue; }
      const strs = s.match(/\((?:\\.|[^\\()])*\)/g) || [];
      for (const q of strs)
        out += q.slice(1, -1).replace(/\\([nrt()\\])/g, (x, ch) =>
          ch === 'n' ? '\n' : ch === 'r' ? '' : ch === 't' ? ' ' : ch);
      out += ' ';
    }
    out += '\n';
  }
  return out;
}

/* ---------- chord symbols in plain text ---------- */
const SUFFIX = [
  ['maj13','maj13'], ['maj9','maj9'], ['maj7','maj7'], ['M7','maj7'], ['Δ','maj7'],
  ['m7b5','m7b5'], ['m7♭5','m7b5'], ['ø','m7b5'], ['dim7','dim7'], ['dim','dim'], ['°','dim7'],
  ['mmaj7','mmaj7'], ['m(maj7)','mmaj7'],
  ['m13','m13'], ['m11','m11'], ['m9','m9'], ['m7','m7'], ['m6','m6'],
  ['min7','m7'], ['min','min'], ['-7','m7'],
  ['13b9','13b9'], ['7b9','7b9'], ['7#9','7s9'], ['7#11','7s11'], ['7b13','7b13'],
  ['7#5','7s5'], ['7b5','7b5'], ['7alt','7s5s9'],
  ['9sus4','9sus4'], ['9sus','9sus4'], ['7sus4','7sus4'], ['7sus','7sus4'],
  ['sus4','sus4'], ['sus2','sus2'], ['sus','sus4'],
  ['add9','add9'], ['6/9','69'], ['69','69'],
  ['aug','aug'], ['+','aug'],
  ['13','13'], ['11','11'], ['9','9'], ['7','7'], ['6','6'], ['5','5'],
  ['m','min'], ['','maj']
];
const LETTER = {C:0, D:2, E:4, F:5, G:7, A:9, B:11};

function parseChordSymbol(tok){
  tok = (tok || '').trim().replace(/[♭]/g, 'b').replace(/[♯]/g, '#');
  const m = /^([A-G])([#b]?)(.*)$/.exec(tok);
  if (!m) return null;
  let rootPc = (LETTER[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12;
  let rest = m[3], bassPc = null;
  const slash = rest.indexOf('/');
  if (slash >= 0){
    const b = /^([A-G])([#b]?)$/.exec(rest.slice(slash + 1));
    if (b) bassPc = (LETTER[b[1]] + (b[2] === '#' ? 1 : b[2] === 'b' ? -1 : 0) + 12) % 12;
    rest = rest.slice(0, slash);
  }
  for (const [suf, type] of SUFFIX){
    if (rest === suf) return {rootPc, type, bassPc};
  }
  return null;
}

/* Pull a chart out of free text. Bar lines are used if they are there. */
function parseChordText(text){
  if (!text) return [];
  const clean = text.replace(/[｜∣]/g, '|').replace(/\u00a0/g, ' ');
  const hasBars = (clean.match(/\|/g) || []).length >= 2;
  const bars = [];
  if (hasBars){
    for (const seg of clean.split('|')){
      const toks = seg.split(/\s+/).filter(Boolean);
      const chords = toks.map(parseChordSymbol).filter(Boolean);
      if (chords.length) bars.push({chords: chords.slice(0, 2)});
    }
  } else {
    const toks = clean.split(/[\s,\n]+/).filter(Boolean);
    for (const t of toks){
      const c = parseChordSymbol(t);
      if (c) bars.push({chords:[c]});
    }
  }
  return bars;
}

/* ============================================================
   iReal Pro — the published irealbook:// protocol
   The app's own export uses irealb://, which is their proprietary
   obfuscated format; this reads the open one they document for
   third parties, and tells you plainly when it has been handed
   the other kind.
   ============================================================ */
const IREAL_Q = {
  '':'maj', '5':'5', '2':'sus2', 'add9':'add9', '+':'aug', 'o':'dim', 'h':'m7b5',
  'sus':'sus4', '^':'maj7', '-':'min', '^7':'maj7', '-7':'m7', '7':'7',
  '7sus':'7sus4', 'h7':'m7b5', 'o7':'dim7', '^9':'maj9', '^13':'maj13',
  '6':'6', '69':'69', '^7#11':'maj7s11', '^9#11':'maj7s11', '^7#5':'maj7s5',
  '-6':'m6', '-69':'m69', '-^7':'mmaj7', '-^9':'mmaj7', '-9':'m9', '-11':'m11',
  '-7b5':'m7b5', 'h9':'m7b5', '-b6':'min', '-#5':'min', '9':'9', '7b9':'7b9',
  '7#9':'7s9', '7#11':'7s11', '7b5':'7b5', '7#5':'7s5', '9#11':'7s11',
  '9b5':'7b5', '9#5':'7s5', '7b13':'7b13', '7#9#5':'7s5s9', '7#9b5':'7b5s9',
  '7#9#11':'7s9', '7b9#11':'7b9', '7b9b5':'7b5b9', '7b9#5':'7s5b9',
  '7b9#9':'7b9', '7b9b13':'7b9', '7alt':'7s5s9', '13':'13', '13#11':'13',
  '13b9':'13b9', '13#9':'13', '7b9sus':'9sus4', '7susadd3':'7sus4',
  '9sus':'9sus4', '13sus':'9sus4', '7b13sus':'9sus4', '11':'11',
  'min13':'m13', 'min^11':'mmaj7', 'min^13':'mmaj7', 'maj13#11':'maj13',
  'maj7b5':'maj7', 'maj7#9':'maj7', 'min7b6':'m7', 'min9b6':'m9',
  'maj(add4)':'maj', 'min(add4)':'min', '7(add13)':'13'
};
/* the ones above that the app has no exact match for */
const IREAL_APPROX = new Set(['^9#11','h9','-b6','-#5','9#11','7#9#11','7b9#11',
  '7b9#9','7b9b13','13#11','13#9','7b9sus','13sus','7b13sus','min^11','min^13',
  'maj13#11','maj7b5','maj7#9','min7b6','min9b6','maj(add4)','min(add4)','7(add13)','-^9']);
const IREAL_T = {'44':'4/4','34':'3/4','24':'2/4','54':'5/4','64':'6/4','74':'7/4',
  '22':'2/4','32':'3/4','58':'5/8','68':'6/8','78':'7/8','98':'9/8','12':'12/8'};

function irealChord(tok){
  const m = /^([A-G])([#b]?)(.*)$/.exec(tok);
  if (!m) return null;
  let rootPc = (LETTER[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12;
  let rest = m[3], bassPc = null;
  const slash = rest.lastIndexOf('/');
  if (slash > 0 || (slash === 0 && rest.length > 1)){
    const bm = /^([A-G])([#b]?)$/.exec(rest.slice(slash + 1));
    if (bm){ bassPc = (LETTER[bm[1]] + (bm[2] === '#' ? 1 : bm[2] === 'b' ? -1 : 0) + 12) % 12;
      rest = rest.slice(0, slash); }
  }
  const type = IREAL_Q[rest];
  if (type == null) return null;
  return {rootPc, type, bassPc, approx: IREAL_APPROX.has(rest), raw: tok};
}

function parseIReal(text){
  let s = (text || '').trim();
  if (/^irealb:\/\//i.test(s))
    throw new Error('That is an irealb:// link — the iReal Pro app own export, which is '
      + 'obfuscated and not published. Export or write the chart as irealbook:// '
      + 'instead, or paste the chords in as text.');
  s = s.replace(/^irealbook:\/\//i, '');
  try { s = decodeURIComponent(s); } catch(e){}
  const parts = s.split('=');
  let title = '', progression = s, key = '';
  if (parts.length >= 6){
    title = parts[0]; key = parts[3];
    progression = parts.slice(5).join('=');     /* a playlist carries more; take the first song */
    const nextSong = progression.indexOf('=');
    if (nextSong > 0 && parts.length > 6) progression = progression.slice(0, nextSong);
  }
  const bars = [];
  let cur = [], meter = null, pending = null, approx = 0, i = 0;
  const push = () => { if (cur.length){ bars.push({chords:cur.slice(), meter:meter || '4/4'}); cur = []; } };
  while (i < progression.length){
    const c = progression[i];
    if (c === '<'){ const e = progression.indexOf('>', i); i = e < 0 ? progression.length : e + 1; continue; }
    if (c === 'T' && IREAL_T[progression.substr(i+1, 2)]){ meter = IREAL_T[progression.substr(i+1,2)]; i += 3; continue; }
    if (c === '*' || c === 'N'){ i += 2; continue; }          /* section marks and endings */
    if ('|[]{}Z'.includes(c)){ push(); i++; continue; }
    if (c === '('){ const e = progression.indexOf(')', i); i = e < 0 ? progression.length : e + 1; continue; }
    if ('YSQfslr,'.includes(c) || c === ' '){ i++; continue; }
    if (c === 'x'){ if (bars.length) bars.push({chords:bars[bars.length-1].chords.slice(), meter:meter||'4/4'}); i++; continue; }
    if (c === 'n'){ i++; continue; }                          /* N.C. */
    if (c === 'p'){ i++; continue; }                          /* hold the chord before */
    const m = /^[A-G][#b]?[^\s|\[\]{}Z,()<]*/.exec(progression.slice(i));
    if (m){
      const ch = irealChord(m[0]);
      if (ch){ if (ch.approx) approx++; cur.push(ch); }
      i += m[0].length; continue;
    }
    i++;
  }
  push();
  return {title, key, bars: bars.filter(b => b.chords.length), approx};
}

/* ============================================================
   PDF out — written by hand so it works with no internet and
   nothing installed. Vector, so it stays sharp at any size.
   ============================================================ */
const PW = 595.28, PH = 841.89, MARGIN = 40;          /* A4 portrait, points */

function PDFDoc(){
  const pages = [];
  let ops = null;
  const esc = s => String(s)
    .replace(/[♭]/g,'b').replace(/[♯]/g,'#').replace(/[♮]/g,'nat ')
    .replace(/[–—]/g,'-').replace(/[·•]/g,'-').replace(/[×]/g,'x')
    .replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[Δ]/g,'maj')
    .replace(/[^\x20-\x7e]/g,'')
    .replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const Y = y => PH - y;
  const api = {
    page(){ ops = []; pages.push(ops); return api; },
    text(x, y, s, size, bold, col){
      ops.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + (size || 10) + ' Tf '
        + (col || '0 0 0') + ' rg ' + x.toFixed(2) + ' ' + Y(y).toFixed(2)
        + ' Td (' + esc(s) + ') Tj ET');
      return api;
    },
    textC(x, y, s, size, bold, col){          /* centred */
      const w = (size || 10) * 0.5 * String(s).length;
      return api.text(x - w / 2, y, s, size, bold, col);
    },
    line(x1, y1, x2, y2, w, col){
      ops.push((col || '0 0 0') + ' RG ' + (w || 0.6) + ' w '
        + x1.toFixed(2) + ' ' + Y(y1).toFixed(2) + ' m '
        + x2.toFixed(2) + ' ' + Y(y2).toFixed(2) + ' l S');
      return api;
    },
    rect(x, y, w, h, stroke, fill, lw){
      const r = x.toFixed(2) + ' ' + Y(y + h).toFixed(2) + ' ' + w.toFixed(2) + ' ' + h.toFixed(2) + ' re';
      if (fill) ops.push(fill + ' rg ' + r + ' f');
      if (stroke) ops.push(stroke + ' RG ' + (lw || 0.6) + ' w ' + r + ' S');
      return api;
    },
    circle(cx, cy, r, fill, stroke){
      const k = r * 0.5523, y = Y(cy);
      ops.push((fill || stroke) + (fill ? ' rg ' : ' RG ')
        + (cx - r).toFixed(2) + ' ' + y.toFixed(2) + ' m '
        + (cx - r).toFixed(2) + ' ' + (y + k).toFixed(2) + ' ' + (cx - k).toFixed(2) + ' ' + (y + r).toFixed(2) + ' ' + cx.toFixed(2) + ' ' + (y + r).toFixed(2) + ' c '
        + (cx + k).toFixed(2) + ' ' + (y + r).toFixed(2) + ' ' + (cx + r).toFixed(2) + ' ' + (y + k).toFixed(2) + ' ' + (cx + r).toFixed(2) + ' ' + y.toFixed(2) + ' c '
        + (cx + r).toFixed(2) + ' ' + (y - k).toFixed(2) + ' ' + (cx + k).toFixed(2) + ' ' + (y - r).toFixed(2) + ' ' + cx.toFixed(2) + ' ' + (y - r).toFixed(2) + ' c '
        + (cx - k).toFixed(2) + ' ' + (y - r).toFixed(2) + ' ' + (cx - r).toFixed(2) + ' ' + (y - k).toFixed(2) + ' ' + (cx - r).toFixed(2) + ' ' + y.toFixed(2) + ' c '
        + (fill ? 'f' : 'S'));
      return api;
    },
    build(title){
      const objs = [];
      const add = s => { objs.push(s); return objs.length; };
      const fontA = add('<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');
      const fontB = add('<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>');
      const pagesId = objs.length + 1 + pages.length * 2 + 1;
      const kids = [];
      for (const p of pages){
        const body = p.join('\n');
        const cid = add('<</Length ' + body.length + '>>\nstream\n' + body + '\nendstream');
        const pid = add('<</Type/Page/Parent ' + pagesId + ' 0 R/MediaBox[0 0 '
          + PW.toFixed(2) + ' ' + PH.toFixed(2) + ']/Resources<</Font<</F1 '
          + fontA + ' 0 R/F2 ' + fontB + ' 0 R>>>>/Contents ' + cid + ' 0 R>>');
        kids.push(pid + ' 0 R');
      }
      const pgs = add('<</Type/Pages/Kids[' + kids.join(' ') + ']/Count ' + kids.length + '>>');
      const info = add('<</Title (' + esc(title || 'Chord Trainer') + ')/Producer (Chord Trainer)>>');
      const cat = add('<</Type/Catalog/Pages ' + pgs + ' 0 R>>');
      let out = '%PDF-1.4\n', offs = [];
      objs.forEach((o, i) => { offs.push(out.length); out += (i + 1) + ' 0 obj\n' + o + '\nendobj\n'; });
      const xref = out.length;
      out += 'xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n';
      for (const o of offs) out += String(o).padStart(10, '0') + ' 00000 n \n';
      out += 'trailer\n<</Size ' + (objs.length + 1) + '/Root ' + cat + ' 0 R/Info '
           + info + ' 0 R>>\nstartxref\n' + xref + '\n%%EOF';
      const bytes = new Uint8Array(out.length);
      for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;
      return bytes;
    }
  };
  return api;
}

/* ---------- a chord box, drawn the same way as on screen ---------- */
function pdfGrip(d, x, y, frets, opt){
  const T = opt.tuning, n = T.strings.length;
  const fretted = frets.filter(f => f > 0);
  const maxF = fretted.length ? Math.max(...fretted) : 0;
  const minF = fretted.length ? Math.min(...fretted) : 0;
  const base = maxF <= 4 ? 0 : minF - 1;
  const sw = 9, fh = 11, rows = 5, w = (n - 1) * sw;
  const dn = opt.type ? degNamer(opt.type) : (s => DEG[((s % 12) + 12) % 12]);
  d.textC(x + w / 2, y - 16, opt.name || '', 9, true);
  for (let i = 0; i < n; i++){
    const sx = x + i * sw;
    d.line(sx, y, sx, y + rows * fh, 0.5, '0.45 0.45 0.45');
    if (frets[i] < 0) d.textC(sx, y - 3, 'x', 7, false, '0.4 0.4 0.4');
    else if (frets[i] === 0){
      const lab = dn(T.strings[i] % 12 - opt.rootPc);
      d.textC(sx, y - 3, lab, 6, false, '0.25 0.35 0.55');
    }
  }
  for (let r = 0; r <= rows; r++)
    d.line(x, y + r * fh, x + w, y + r * fh, r === 0 && base === 0 ? 2 : 0.5,
           r === 0 && base === 0 ? '0.1 0.1 0.1' : '0.45 0.45 0.45');
  if (base > 0) d.text(x - 11, y + fh - 3, String(base + 1), 7);
  for (let i = 0; i < n; i++){
    const f = frets[i]; if (f <= 0) continue;
    const cy = y + (f - base - 0.5) * fh;
    if (cy > y + rows * fh) continue;
    const pc = (T.strings[i] + f) % 12;
    const isRoot = pc === opt.rootPc;
    d.circle(x + i * sw, cy, 4, isRoot ? '0.15 0.45 0.65' : '0.2 0.2 0.2');
    d.textC(x + i * sw, cy + 2.2, dn(pc - opt.rootPc), 5.2, true, '1 1 1');
  }
  return rows * fh + 26;
}

/* ---------- a two-octave keyboard ---------- */
function pdfKeys(d, x, y, notes, rootPc, type){
  const lowC = 48, oct = 2, ww = 11, wh = 42, bw = 7, bh = 26;
  const dn = type ? degNamer(type) : (s => DEG[((s % 12) + 12) % 12]);
  const set = new Set(notes);
  let wi = 0;
  for (let m = lowC; m < lowC + 12 * oct; m++){
    if (isBlack(m)) continue;
    const kx = x + wi * ww;
    const on = set.has(m);
    d.rect(kx, y, ww, wh, '0.3 0.3 0.3', on ? '0.72 0.85 0.93' : '1 1 1', 0.5);
    if (on) d.textC(kx + ww / 2, y + wh - 5, dn(m % 12 - rootPc), 5.5, true, '0.1 0.1 0.1');
    wi++;
  }
  wi = 0;
  for (let m = lowC; m < lowC + 12 * oct; m++){
    if (isBlack(m)) continue;
    wi++;
    if (isBlack(m + 1) && m + 1 < lowC + 12 * oct){
      const kx = x + wi * ww - bw / 2, on = set.has(m + 1);
      d.rect(kx, y, bw, bh, '0.1 0.1 0.1', on ? '0.15 0.45 0.65' : '0.15 0.15 0.15', 0.4);
      if (on) d.textC(kx + bw / 2, y + bh - 4, dn((m + 1) % 12 - rootPc), 5, true, '1 1 1');
    }
  }
  return wh + 10;
}

/* ---------- the whole sheet ---------- */
function buildPdf(o){
  /* o: {title, key, bars, grips, scales, instrument, tempo, style} */
  const d = PDFDoc(); d.page();
  let y = MARGIN + 6;
  const W = PW - MARGIN * 2;
  const newPage = h => { if (y + h > PH - MARGIN){ d.page(); y = MARGIN + 6; } };

  d.text(MARGIN, y, o.title, 17, true); y += 18;
  d.text(MARGIN, y, o.subtitle, 9.5, false, '0.35 0.35 0.35'); y += 20;

  /* chart */
  if (o.bars && o.bars.length){
    d.text(MARGIN, y, 'Chart', 11, true); y += 12;
    const perRow = 4, bw = W / perRow, bh = 34;
    let lastMeter = null;
    for (let i = 0; i < o.bars.length; i++){
      if (i % perRow === 0) newPage(bh + 6);
      const col = i % perRow, row = Math.floor(i / perRow);
      const bx = MARGIN + col * bw;
      const by = y + (i % perRow === 0 && i > 0 ? 0 : 0);
      if (i % perRow === 0 && i > 0) { }
      const b = o.bars[i];
      d.rect(bx, by, bw, bh, '0.55 0.55 0.55', null, 0.6);
      const names = b.chords.map(c => c.label).join('   ');
      d.textC(bx + bw / 2, by + bh / 2 + 3, names, b.chords.length > 1 ? 10 : 12, true);
      if (b.meter && b.meter !== lastMeter){
        d.text(bx + 3, by + 9, b.meter, 7, true, '0.15 0.45 0.65');
        lastMeter = b.meter;
      }
      d.text(bx + 3, by + bh - 3, String(i + 1), 6, false, '0.6 0.6 0.6');
      if (col === perRow - 1 || i === o.bars.length - 1) y += bh;
    }
    y += 16;
  }

  /* grips */
  if (o.grips && o.grips.length){
    newPage(30); d.text(MARGIN, y, o.gripTitle || 'The shapes', 11, true); y += 24;
    let x = MARGIN, rowH = 0;
    for (const g of o.grips){
      const wNeed = g.keys ? 160 : (g.tuning.strings.length - 1) * 9 + 26;
      if (x + wNeed > PW - MARGIN){ x = MARGIN; y += rowH + 16; rowH = 0; }
      newPage(90);
      let h;
      if (g.keys){
        d.textC(x + 70, y - 4, g.name, 9, true);
        h = pdfKeys(d, x, y, g.notes, g.rootPc, g.type) + 6;
      } else {
        h = pdfGrip(d, x + 12, y + 10, g.frets,
          {tuning:g.tuning, rootPc:g.rootPc, type:g.type, name:g.name});
      }
      if (g.sub) d.textC(x + wNeed / 2, y + h + 2, g.sub, 6.5, false, '0.45 0.45 0.45');
      rowH = Math.max(rowH, h + 10);
      x += wNeed + 14;
    }
    y += rowH + 18;
  }

  /* chord scales */
  if (o.scales && o.scales.length){
    newPage(30); d.text(MARGIN, y, 'What to play over it', 11, true); y += 14;
    for (const s of o.scales){
      newPage(14);
      d.text(MARGIN, y, s.chord, 9.5, true);
      d.text(MARGIN + 62, y, s.text, 9, false, '0.3 0.3 0.3');
      y += 12.5;
    }
    y += 10;
  }

  if (o.footer){ newPage(14); d.text(MARGIN, PH - MARGIN + 8, o.footer, 7.5, false, '0.55 0.55 0.55'); }
  return d.build(o.title);
}

function savePdf(bytes, filename){
  const blob = new Blob([bytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

/* ============================================================
   MIDI out — write the chart as a Standard MIDI File
   ============================================================ */
const PPQ = 480;
function vlq(n){ const b = [n & 127]; n = Math.floor(n / 128);
  while (n > 0){ b.unshift((n & 127) | 128); n = Math.floor(n / 128); } return b; }
const be32 = n => [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
const be16 = n => [(n>>8)&255, n&255];
const ascii = s => [...s].map(c => c.charCodeAt(0) & 255);
const chunk = (id, d) => [...ascii(id), ...be32(d.length), ...d];

/* events: [{t, b:[...]}] -> a track chunk */
function track(events, name){
  events.sort((a, b) => a.t - b.t || (a.b[0] & 0xf0) - (b.b[0] & 0xf0));
  let data = [...vlq(0), 0xFF, 0x03, ...vlq(name.length), ...ascii(name)];
  let last = 0;
  for (const e of events){ data.push(...vlq(Math.max(0, e.t - last)), ...e.b); last = e.t; }
  data.push(...vlq(0), 0xFF, 0x2F, 0);
  return chunk('MTrk', data);
}

function buildMidiFile(o){
  /* o: {tempo, bars:[{meter, grid, chords:[{comp, bassMidi, label}]}], groove, title} */
  const us = Math.round(60000000 / o.tempo);
  const conductor = [{t:0, b:[0xFF, 0x51, 3, (us>>16)&255, (us>>8)&255, us&255]}];
  const chordEv = [], bassEv = [], drumEv = [];
  let t = 0, lastSig = null;

  for (const bar of o.bars){
    const grid = bar.grid;
    const tickPer = Math.round(PPQ / grid.spb);
    const barLen = grid.s * tickPer;
    const sig = /^(\d+)\/(\d+)$/.exec(grid.label || '');
    const key = sig ? sig[1] + '/' + sig[2] : '4/4';
    if (key !== lastSig){
      const n = sig ? +sig[1] : 4, d = sig ? +sig[2] : 4;
      conductor.push({t, b:[0xFF, 0x58, 4, n, Math.round(Math.log2(d)), 24, 8]});
      lastSig = key;
    }
    /* chords, split across the bar the way the app plays them */
    const cs = bar.chords, split = cs.length > 1 ? Math.round(barLen / 2) : barLen;
    cs.forEach((c, i) => {
      const on = t + (i === 0 ? 0 : split);
      const off = t + (cs.length > 1 ? (i === 0 ? split : barLen) : barLen);
      (c.comp || []).forEach(n => {
        chordEv.push({t:on, b:[0x90, n, 76]});
        chordEv.push({t:Math.max(on + 10, off - 10), b:[0x80, n, 0]});
      });
      if (c.bassMidi != null){
        bassEv.push({t:on, b:[0x91, c.bassMidi, 88]});
        bassEv.push({t:Math.max(on + 10, off - 10), b:[0x81, c.bassMidi, 0]});
      }
    });
    /* the groove, if one of the world patterns is playing */
    if (grid.lanes){
      for (const lane in grid.lanes){
        if (lane === 'mel') continue;
        const note = (typeof GM_DRUM !== 'undefined' && GM_DRUM[lane]) || 39;
        const row = grid.lanes[lane];
        for (let i = 0; i < grid.s; i++){
          const ch = row[i];
          if (!ch || ch === '.') continue;
          const at = t + i * tickPer;
          const vel = Math.round(96 * (typeof VEL !== 'undefined' ? (VEL[ch] || 0.8) : 0.8));
          drumEv.push({t:at, b:[0x99, note, Math.max(1, Math.min(127, vel))]});
          drumEv.push({t:at + 20, b:[0x89, note, 0]});
        }
      }
    }
    t += barLen;
  }
  conductor.push({t, b:[0xFF, 0x01, 0]});

  const tracks = [track(conductor, o.title || 'Chord Trainer')];
  /* a sound for each part, so it opens with something sensible */
  chordEv.unshift({t:0, b:[0xC0, o.prog == null ? 26 : o.prog]});
  bassEv.unshift({t:0, b:[0xC1, 33]});
  if (chordEv.length > 1) tracks.push(track(chordEv, 'Chords'));
  if (bassEv.length > 1) tracks.push(track(bassEv, 'Bass'));
  if (drumEv.length) tracks.push(track(drumEv, 'Drums'));

  const bytes = [...chunk('MThd', [...be16(1), ...be16(tracks.length), ...be16(PPQ)])];
  tracks.forEach(tr => bytes.push(...tr));
  return new Uint8Array(bytes);
}

function saveBlob(bytes, filename, mime){
  const blob = new Blob([bytes], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);
}

/* ============================================================
   Sound
   Kept to the suite's rule: every held note is faded out, never
   cut, and live triggers are booked a few milliseconds ahead.
   ============================================================ */
let AC = null, master = null, live = [];

function ac(){
  if (AC) return AC;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  return AC;
}
const LEAD = 0.015;                       /* book triggers slightly ahead */
const now = () => ac().currentTime + LEAD;

function unlock(){
  const a = ac();
  if (a.state !== 'running') a.resume();
  const b = a.createBuffer(1, 1, 22050);
  const s = a.createBufferSource(); s.buffer = b; s.connect(a.destination); s.start(0);
}
document.addEventListener('touchstart', unlock, {once:true});
document.addEventListener('mousedown', unlock, {once:true});
document.addEventListener('keydown', unlock, {once:true});

/* Fade, never cut. A stop() that freezes the gain at its scheduled
   value ends the note with a click — this is the fix that took a
   while to find in the Scale Trainer, so it stays. */
function fadeOut(g, t, tau){
  tau = tau || 0.04;
  try { g.gain.cancelAndHoldAtTime(t); }
  catch(e){ try { g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); } catch(e2){} }
  g.gain.setTargetAtTime(0.0001, t, tau);
}

function stopAll(){
  if (!AC) return;
  const t = AC.currentTime;
  for (const v of live){ try { fadeOut(v.g, t, 0.02); v.node.stop(t + 0.18); } catch(e){} }
  live = [];
}

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

/* --- plucked string: two detuned oscillators under a closing filter --- */
function pluck(midi, t, dur, vol){
  const a = ac(); vol = (vol == null ? 0.5 : vol);
  const f = mtof(midi);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(vol * 0.28, t + 0.09);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(Math.min(7000, f * 9), t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(420, f * 2.2), t + 0.55);
  lp.Q.value = 0.8;
  const o1 = a.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
  const o2 = a.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f;
  o2.detune.value = 6;
  o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(master);
  const end = t + Math.max(dur, 0.35);
  o1.start(t); o2.start(t);
  fadeOut(g, end, 0.12);
  o1.stop(end + 0.5); o2.stop(end + 0.5);
  live.push({node:o1, g}); live.push({node:o2, g});
}

/* --- electric piano-ish, for comping --- */
function ep(midi, t, dur, vol){
  const a = ac(); vol = (vol == null ? 0.28 : vol);
  const f = mtof(midi);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.25);
  const o1 = a.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
  const o2 = a.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 2;
  const g2 = a.createGain(); g2.gain.value = 0.18; o2.connect(g2);
  o1.connect(g); g2.connect(g); g.connect(master);
  const end = t + Math.max(dur, 0.3);
  o1.start(t); o2.start(t);
  fadeOut(g, end, 0.09);
  o1.stop(end + 0.4); o2.stop(end + 0.4);
  live.push({node:o1, g}); live.push({node:o2, g});
}

/* --- bass --- */
function bassNote(midi, t, dur, vol){
  const a = ac(); vol = (vol == null ? 0.5 : vol);
  const f = mtof(midi);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.014);
  g.gain.exponentialRampToValueAtTime(vol * 0.4, t + 0.18);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(f * 6, t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(180, f * 2.4), t + 0.3);
  const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
  const sub = a.createOscillator(); sub.type = 'sine'; sub.frequency.value = f / 2;
  const sg = a.createGain(); sg.gain.value = 0.5; sub.connect(sg); sg.connect(lp);
  o.connect(lp); lp.connect(g); g.connect(master);
  const end = t + Math.max(dur * 0.9, 0.2);
  o.start(t); sub.start(t);
  fadeOut(g, end, 0.05);
  o.stop(end + 0.3); sub.stop(end + 0.3);
  live.push({node:o, g}); live.push({node:sub, g});
}

/* --- drums --- */
let noiseBuf = null;
function noise(){
  const a = ac();
  if (!noiseBuf){
    noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = a.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
}
function kick(t, v){
  const a = ac(); v = v || 0.9;
  const g = a.createGain(); g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
  const o = a.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(128, t);
  o.frequency.exponentialRampToValueAtTime(44, t + 0.09);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.4);
}
function snare(t, v){
  const a = ac(); v = v || 0.55;
  const n = noise(), hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
  const g = a.createGain(); g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  n.connect(hp); hp.connect(g); g.connect(master); n.start(t); n.stop(t + 0.2);
  const o = a.createOscillator(); o.type = 'triangle'; o.frequency.value = 190;
  const g2 = a.createGain(); g2.gain.setValueAtTime(v * 0.5, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.12);
}
function hat(t, v, open){
  const a = ac(); v = v || 0.22;
  const n = noise(), hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7200;
  const g = a.createGain(); g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.3 : 0.05));
  n.connect(hp); hp.connect(g); g.connect(master);
  n.start(t); n.stop(t + (open ? 0.34 : 0.08));
}
function ride(t, v){
  const a = ac(); v = v || 0.17;
  const n = noise(), bp = a.createBiquadFilter(); bp.type = 'bandpass';
  bp.frequency.value = 5200; bp.Q.value = 1.2;
  const g = a.createGain(); g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
  n.connect(bp); bp.connect(g); g.connect(master); n.start(t); n.stop(t + 0.46);
  const o = a.createOscillator(); o.type = 'square'; o.frequency.value = 780;
  const g2 = a.createGain(); g2.gain.setValueAtTime(v * 0.1, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(g2); g2.connect(master); o.start(t); o.stop(t + 0.2);
}
function click(t, accent){
  const a = ac();
  const o = a.createOscillator(); o.type = 'square';
  o.frequency.value = accent ? 1600 : 1100;
  const g = a.createGain(); g.gain.setValueAtTime(accent ? 0.3 : 0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.06);
}

/* --- strum a grip: frets → midi, spread slightly like a pick --- */
function strum(frets, tuning, t, dur, dir, vol){
  const notes = [];
  for (let i = 0; i < frets.length; i++)
    if (frets[i] >= 0) notes.push(tuning.strings[i] + frets[i]);
  if (dir === 'down') notes.reverse();
  notes.forEach((m, i) => pluck(m, t + i * 0.022, dur || 1.6, vol == null ? 0.42 : vol));
  return notes;
}

/* ============================================================
   Sequencer — look-ahead scheduling, so the groove does not
   wobble when the page is busy drawing.
   ============================================================ */
const SEQ = {
  on:false, timer:null, tempo:120, style:'swing', meter:'4/4', groove:null,
  bar:0, step:0, nextTime:0, bars:[], onBar:null, countIn:false, countLeft:0,
  countGrid:null, parts:{drums:true, bass:true, comp:true}
};

/* One grid for both kinds of groove. A slot is the smallest step in the
   bar; spb says how many of them make a beat, so the tempo always counts
   the beat the groove is felt in. */
function gridFor(barIx){
  if (SEQ.groove){
    const p = SEQ.groove;
    return {s:p.s, spb:p.spb, g:p.g, lanes:p.lanes, sw:p.sw || 0,
            label:p.m, pulse:p.spb, world:true};
  }
  const bar = SEQ.bars[barIx % SEQ.bars.length] || {};
  const m = metre(bar.meter || SEQ.meter);
  const pulse = m.unit === 4 ? 4 : 1;          /* slots in one counted pulse */
  return {s:m.beats * pulse, spb:m.unit === 4 ? 4 : 2,
          g:m.groups.map(x => x * pulse), lanes:null, sw:0,
          label:m.id, pulse, snare:m.snare.map(x => x * pulse), world:false};
}
const stepDur = grid => 60 / SEQ.tempo / grid.spb;
const swingOff = (grid, i, d) =>
  (grid.spb % 2 === 0 && i % 2 === 1) ? (grid.sw || 0) * d / 3 : 0;
function startsOf(grid){ const o = []; let k = 0;
  for (const g of grid.g){ o.push(k); k += g; } return o; }
/* where a second chord in the bar comes in */
function splitSlot(grid){
  const st = startsOf(grid), mid = grid.s / 2;
  if (st.length > 1)
    return st.slice(1).reduce((b, x) => Math.abs(x - mid) < Math.abs(b - mid) ? x : b, st[1]);
  return Math.ceil(grid.s / 2);
}

function scheduleSlot(barIx, slot, t0){
  const bar = SEQ.bars[barIx % SEQ.bars.length];
  if (!bar) return;
  const grid = gridFor(barIx), d = stepDur(grid);
  const t = t0 + swingOff(grid, slot, d);
  const st = startsOf(grid), isStart = st.includes(slot), isDown = slot === 0;
  const onPulse = slot % grid.pulse === 0;
  const pulseIx = slot / grid.pulse;

  if (SEQ.parts.drums){
    if (grid.world){
      for (const lane in grid.lanes){
        if (lane === 'mel') continue;            /* the app supplies the harmony */
        const c = grid.lanes[lane][slot];
        if (!c || c === '.') continue;
        WB.hit(lane, t, (VEL[c] || 0.8) * 0.85);
      }
    } else {
      const sn = grid.snare.includes(slot), st4 = SEQ.style;
      const half = Math.floor(grid.pulse / 2);
      if (st4 === 'ballad'){
        if (isDown) kick(t, 0.6);
        if (sn) snare(t, 0.4);
        if (isStart) hat(t, 0.13);
      } else if (st4 === 'swing'){
        if (onPulse){
          ride(t, isStart ? 0.2 : 0.14);
          if (sn) hat(t, 0.16);
          if (isDown) kick(t, 0.28);
        } else if (half && slot % grid.pulse === half && grid.pulse > 1){
          ride(t0 + d * grid.pulse * 0.16, 0.1);
        }
      } else if (st4 === 'bossa'){
        if (onPulse){
          hat(t, isStart ? 0.17 : 0.12);
          if (isDown || (st.length > 1 && slot === st[st.length - 1])) kick(t, 0.55);
          if (sn) snare(t, 0.2);
        } else if (half && slot % grid.pulse === half) hat(t, 0.1);
      } else if (st4 === 'funk'){
        hat(t, onPulse ? 0.2 : 0.1);
        if (isDown) kick(t, 0.9);
        if (isStart && !isDown) kick(t, 0.5);
        if (sn) snare(t, 0.6);
      } else if (st4 === 'rock'){
        if (onPulse){
          hat(t, isStart ? 0.22 : 0.14);
          if (isDown || (isStart && st.length > 2)) kick(t, 0.9);
          if (sn) snare(t, 0.6);
        } else if (half && slot % grid.pulse === half) hat(t, 0.12);
      } else {
        if (onPulse){
          hat(t, isStart ? 0.2 : 0.13);
          if (isDown) kick(t, 0.8);
          if (isStart && !isDown) kick(t, 0.5);
          if (sn) snare(t, 0.5);
        } else if (half && slot % grid.pulse === half) hat(t, 0.11);
      }
    }
  }

  const chords = bar.chords, split = splitSlot(grid);
  const ch = chords[(chords.length > 1 && slot >= split) ? 1 : 0];
  const isNewChord = isDown || (chords.length > 1 && slot === split);
  if (!ch) return;

  if (SEQ.parts.bass && (isStart || isNewChord || (onPulse && !grid.world)))
    for (const n of bassFor(ch, pulseIx, SEQ.style, grid, isStart, isNewChord, slot))
      bassNote(n.m, t + (n.at || 0) * d * grid.pulse, (n.d || 1) * d * grid.pulse, n.v);

  if (SEQ.parts.comp && ch.comp && ch.comp.length){
    const swingy = SEQ.style === 'swing' && !grid.world;
    if (isNewChord) compHit(ch.comp, t, 0.9);
    else if (isStart && (grid.world || SEQ.style !== 'ballad')) compHit(ch.comp, t, 0.5);
    else if (swingy && grid.snare && grid.snare.includes(slot)) compHit(ch.comp, t, 0.45);
  }
}

function compHit(notes, t, vol){
  notes.forEach((m, i) => ep(m, t + i * 0.008, 60 / SEQ.tempo * 1.1, 0.2 * (vol || 1)));
}

function bassFor(ch, pulseIx, style, grid, isStart, isNewChord, slot){
  const root = ch.bassMidi, iv = ch.iv;
  const third = iv.find(x => x === 3 || x === 4)
             || iv.find(x => x === 2 || x === 5) || 7;
  const fifth = iv.find(x => x === 6 || x === 7 || x === 8) || 7;
  const sev = iv.find(x => x === 9 || x === 10 || x === 11);
  const st = startsOf(grid), last = slot >= st[st.length - 1];

  if (grid.world) return isStart ? [{m:pulseIx === 0 ? root : root + fifth - 12,
    at:0, d:0.9, v:0.46}] : [];
  if (style === 'swing'){
    if (grid.spb === 2) return isStart ? [{m:root, at:0, d:2.4, v:0.45}] : [];
    const pool = [0, third, fifth, sev == null ? 9 : sev];
    let note = root + pool[pulseIx % pool.length];
    if (last && ch.nextRoot != null) note = ch.nextRoot - 1;
    if (note > root + 12) note -= 12;
    return [{m:note, at:0, d:0.9, v:0.45}];
  }
  if (style === 'ballad') return isNewChord ? [{m:root, at:0, d:grid.s * 0.8, v:0.5}] : [];
  if (style === 'bossa') return isStart ? [{m:pulseIx === 0 ? root : root + fifth - 12, at:0, d:1.6, v:0.48}] : [];
  if (style === 'funk'){
    const out = [];
    if (isStart) out.push({m:root, at:0, d:0.4, v:0.55});
    if (last) out.push({m:root + third, at:0.6, d:0.3, v:0.4});
    return out;
  }
  if (style === 'rock') return [{m:root, at:0, d:0.45, v:isStart ? 0.5 : 0.35}];
  return isStart || pulseIx % 2 === 0
    ? [{m:pulseIx === 0 ? root : root + fifth - 12, at:0, d:0.9, v:0.48}] : [];
}

function seqStart(bars, onBar, startAt){
  const a = ac(); unlock();
  WB.init(a, master);
  SEQ.bars = bars; SEQ.onBar = onBar;
  SEQ.bar = 0; SEQ.step = 0; SEQ.on = true;
  SEQ.countGrid = gridFor(0);
  SEQ.countLeft = SEQ.countIn ? SEQ.countGrid.g.length : 0;
  /* startAt lets the room decide the downbeat */
  SEQ.nextTime = startAt != null && startAt > a.currentTime ? startAt : a.currentTime + 0.12;
  if (SEQ.timer) clearInterval(SEQ.timer);
  SEQ.timer = setInterval(tick, 25);
  holdScreen(true);
}
function seqStop(){
  SEQ.on = false;
  if (SEQ.timer) clearInterval(SEQ.timer);
  SEQ.timer = null;
  stopAll();
  holdScreen(false);
}
function tick(){
  if (!SEQ.on) return;
  const a = ac();
  while (SEQ.nextTime < a.currentTime + 0.14){
    if (SEQ.countLeft > 0){
      /* one click per counted beat of the bar, every group start accented */
      const grid = SEQ.countGrid, done = grid.g.length - SEQ.countLeft;
      click(SEQ.nextTime, done === 0);
      SEQ.countLeft--;
      SEQ.nextTime += stepDur(grid) * grid.g[done];
      continue;
    }
    const grid = gridFor(SEQ.bar);
    scheduleSlot(SEQ.bar, SEQ.step, SEQ.nextTime);
    if (SEQ.step === 0 && SEQ.onBar){
      const b = SEQ.bar % SEQ.bars.length, when = SEQ.nextTime - a.currentTime;
      setTimeout(() => { if (SEQ.on) SEQ.onBar(b); }, Math.max(0, when * 1000));
    }
    SEQ.nextTime += stepDur(grid);
    SEQ.step++;
    if (SEQ.step >= grid.s){ SEQ.step = 0; SEQ.bar++; }
  }
}

/* Keep the phone awake while it is making sound. */
let wakeLock = null;
async function holdScreen(on){
  try{
    if (on && 'wakeLock' in navigator && !wakeLock)
      wakeLock = await navigator.wakeLock.request('screen');
    else if (!on && wakeLock){ wakeLock.release(); wakeLock = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && SEQ.on) holdScreen(true);
});

</script>
<script>
/* ============================================================
   Keyboard, importing, exporting
   ============================================================ */
const isKeys = () => S.inst === 'keys';

/* ---------- keyboard diagram ---------- */
function keysSVG(notes, rootPc, type, opt){
  opt = opt || {};
  const lh = opt.lh || [];
  const all = notes.concat(lh);
  let lowC = 48, octs = 2;
  if (all.length){
    const lo = Math.min(...all), hi = Math.max(...all);
    lowC = 12 * Math.floor(lo / 12);
    octs = Math.max(2, Math.min(3, Math.ceil((hi - lowC + 1) / 12)));
  }
  const ww = opt.ww || 15, wh = opt.wh || 56, bw = ww * 0.62, bh = wh * 0.62;
  const nW = 7 * octs, W = nW * ww + 2, H = wh + 16;
  const dn = type ? degNamer(type) : (s => DEG[((s % 12) + 12) % 12]);
  const set = new Set(notes), lset = new Set(lh);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  let wi = 0;
  for (let m = lowC; m < lowC + 12 * octs; m++){
    if (isBlack(m)) continue;
    const x = 1 + wi * ww;
    const on = set.has(m), lo = lset.has(m);
    s += `<rect x="${x}" y="8" width="${ww - 1}" height="${wh}" rx="2" fill="${
      on ? '#dfe4ee' : lo ? '#8fa6b8' : '#f4f6fa'}" stroke="#39414f" stroke-width="1"/>`;
    if (on || lo){
      const lab = rootPc != null ? dn(m % 12 - rootPc) : nameOf(m % 12);
      const isR = rootPc != null && m % 12 === rootPc;
      if (isR) s += `<circle cx="${x + (ww-1)/2}" cy="${8 + wh - 13}" r="6.4" fill="var(--accent)"/>`;
      s += `<text x="${x + (ww-1)/2}" y="${8 + wh - 10}" font-size="7.6" text-anchor="middle" fill="${isR ? '#0d0f14' : '#10141c'}" font-weight="600">${lab}</text>`;
    }
    if (m % 12 === 0) s += `<text x="${x + (ww-1)/2}" y="${wh + 15}" font-size="6.6" text-anchor="middle" fill="#5d667a">C${Math.floor(m/12)-1}</text>`;
    wi++;
  }
  wi = 0;
  for (let m = lowC; m < lowC + 12 * octs; m++){
    if (isBlack(m)) continue;
    wi++;
    if (!isBlack(m + 1) || m + 1 >= lowC + 12 * octs) continue;
    const x = 1 + wi * ww - bw / 2;
    const on = set.has(m + 1), lo = lset.has(m + 1);
    s += `<rect x="${x}" y="8" width="${bw}" height="${bh}" rx="1.5" fill="${
      on ? '#4cc9f0' : lo ? '#2b6f8c' : '#1b2029'}" stroke="#0b0e13" stroke-width="1"/>`;
    if (on || lo){
      const lab = rootPc != null ? dn((m + 1) % 12 - rootPc) : nameOf((m + 1) % 12);
      s += `<text x="${x + bw/2}" y="${8 + bh - 5}" font-size="7" text-anchor="middle" fill="${on ? '#0d0f14' : '#dfe4ee'}" font-weight="600">${lab}</text>`;
    }
  }
  return s + '</svg>';
}

function keysScaleSVG(scaleIv, scaleRoot, chordPcs){
  const base = 48 + (((scaleRoot - 48) % 12) + 12) % 12;
  const notes = [];
  for (let o = 0; o < 2; o++) for (const i of scaleIv) notes.push(base + i + 12 * o);
  notes.push(base + 24);
  const lowC = 12 * Math.floor(Math.min(...notes) / 12);
  const octs = Math.max(2, Math.min(3, Math.ceil((Math.max(...notes) - lowC + 1) / 12)));
  const ww = 15, wh = 56, bw = ww * 0.62, bh = wh * 0.62;
  const W = 7 * octs * ww + 2, H = wh + 16;
  const set = new Set(notes.map(n => n % 12));
  const chord = new Set(chordPcs || []);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  let wi = 0;
  for (let m = lowC; m < lowC + 12 * octs; m++){
    if (isBlack(m)) continue;
    const x = 1 + wi * ww, pc = m % 12, on = set.has(pc);
    s += `<rect x="${x}" y="8" width="${ww-1}" height="${wh}" rx="2" fill="${
      on ? (chord.has(pc) ? '#dfe4ee' : '#aab4c6') : '#f4f6fa'}" stroke="#39414f"/>`;
    if (on){
      const isR = pc === scaleRoot % 12;
      if (isR) s += `<circle cx="${x + (ww-1)/2}" cy="${8 + wh - 13}" r="6.4" fill="var(--accent)"/>`;
      s += `<text x="${x + (ww-1)/2}" y="${8 + wh - 10}" font-size="7.4" text-anchor="middle" fill="${isR ? '#0d0f14' : '#10141c'}" font-weight="600">${SDEG[((pc - scaleRoot) % 12 + 12) % 12]}</text>`;
    }
    wi++;
  }
  wi = 0;
  for (let m = lowC; m < lowC + 12 * octs; m++){
    if (isBlack(m)) continue;
    wi++;
    if (!isBlack(m + 1) || m + 1 >= lowC + 12 * octs) continue;
    const x = 1 + wi * ww - bw / 2, pc = (m + 1) % 12, on = set.has(pc);
    s += `<rect x="${x}" y="8" width="${bw}" height="${bh}" rx="1.5" fill="${
      on ? (chord.has(pc) ? '#4cc9f0' : '#2b6f8c') : '#1b2029'}" stroke="#0b0e13"/>`;
    if (on) s += `<text x="${x + bw/2}" y="${8 + bh - 5}" font-size="6.8" text-anchor="middle" fill="#0d0f14" font-weight="600">${SDEG[((pc - scaleRoot) % 12 + 12) % 12]}</text>`;
  }
  return s + '</svg>';
}

function playKeys(v){
  stopAll();
  const t0 = now();
  v.lh.forEach(m => ep(m, t0, 2.2, 0.32));
  v.rh.forEach((m, i) => ep(m, t0 + 0.012 * i, 2.2, 0.3));
}

/* ---------- keyboard versions of the two chord lists ---------- */
const KEYS_OPEN = {
  'Major':['maj','6','add9','69'], 'Minor':['min','m6','madd9'],
  'Dominant 7':['7','9','13'], 'Major 7':['maj7','maj9','maj13'],
  'Minor 7':['m7','m9','m11'], 'Half diminished':['m7b5'],
  'Sus 2':['sus2'], 'Sus 4':['sus4'], 'Add 9':['add9','madd9'],
  'Sixths':['6','m6','69'], 'Ninths':['9','maj9','m9'],
  '7sus4':['7sus4','9sus4'], 'Diminished / augmented':['dim','dim7','aug'],
  'Power':['5'], 'Slash chords':['maj','min','7']
};
function keysOpenList(v){
  const types = KEYS_OPEN[S.grp] || ['maj7','m7','7'];
  const g = el('div', 'grid'); g.style.gridTemplateColumns = 'repeat(auto-fill,minmax(230px,1fr))';
  types.forEach(type => {
    pianoVoicings(type, S.root, 'close').forEach(vo => {
      const card = el('div', 'card');
      card.appendChild(el('div', 'cname', chordName(S.root, type)));
      card.appendChild(el('div', 'cmeta', vo.name));
      card.insertAdjacentHTML('beforeend', keysSVG(vo.rh, S.root, type, {lh:vo.lh}));
      const fg = rhFingers(vo.rh).join(' ');
      card.appendChild(el('div', 'cmeta', 'right hand ' + fg + ' &middot; left hand 5 on the root'));
      const b = el('button', 'btn sm play', '▶');
      b.onclick = () => playKeys(vo);
      card.appendChild(b);
      card.appendChild(scaleStrip(S.root, type));
      g.appendChild(card);
    });
  });
  v.appendChild(g);
}

const STAGE_KIND = {1:'shell', 2:'drop2', 3:'drop3', 4:'drop24', 5:'rootless',
  6:'quartal', 7:'ust', 9:'gospel'};
function keysJazzList(v, stage){
  const kind = STAGE_KIND[stage];
  const list = pianoVoicings(S.type, S.root, kind);
  if (!list.length){
    v.appendChild(el('div', 'panel',
      '<div class="note">Nothing for that chord in this stage. Try another chord type.</div>'));
    return;
  }
  const g = el('div', 'grid'); g.style.gridTemplateColumns = 'repeat(auto-fill,minmax(230px,1fr))';
  list.forEach(vo => {
    const card = el('div', 'card');
    card.appendChild(el('div', 'cname', chordName(S.root, S.type)));
    card.appendChild(el('div', 'cmeta', vo.name + (vo.sub ? '<br>' + vo.sub : '')));
    card.insertAdjacentHTML('beforeend', keysSVG(vo.rh, S.root, S.type, {lh:vo.lh}));
    const b = el('button', 'btn sm play', '▶');
    b.onclick = () => playKeys(vo);
    card.appendChild(b);
    g.appendChild(card);
  });
  v.appendChild(g);
  v.appendChild(scaleStrip(S.root, S.type));
}

/* ---------- mash ---------- */
function mash(){
  const pool = PROGS.filter(p => !p.self && p.id !== 'imported');
  const p = pool[Math.floor(Math.random() * pool.length)];
  S.prog = p.id;
  $('tProg').value = p.id;
  /* most of the time reach for a real groove from the catalogue */
  if (Math.random() < 0.72){
    const g = PATTERNS[Math.floor(Math.random() * PATTERNS.length)];
    applyGroove('w:' + g.region + '|' + g.name);
  } else {
    const styles = ['swing','straight','rock','funk','bossa','ballad'];
    applyGroove('s:' + styles[Math.floor(Math.random() * styles.length)]);
    if (!p.mt && !p.mts){
      const ms = ['4/4','4/4','4/4','3/4','6/8','5/4','7/8','12/8'];
      S.meter = ms[Math.floor(Math.random() * ms.length)];
    } else S.meter = p.mt || S.meter;
    SEQ.meter = S.meter;
    setTempo(70 + Math.floor(Math.random() * 12) * 10);
  }
  $('tStyle').value = S.groove;
  SEQ.userStyle = true;
  store.set('prog', S.prog); store.set('meter', S.meter);
  startProg(S.prog);
  if (S.tab === 'play') render();
  toast(p.n + ' &middot; ' + grooveLabel() + ' &middot; ' + SEQ.tempo);
}

/* ---------- PDF out ---------- */
function gripsForChart(bars){
  const out = [], done = new Set();
  bars.forEach(b => b.chords.forEach(c => {
    if (done.has(c.label)) return; done.add(c.label);
    if (isKeys()){
      const vs = pianoVoicings(c.type, c.rootPc, 'close');
      if (vs.length) out.push({keys:true, notes:vs[0].rh.concat(vs[0].lh),
        rootPc:c.rootPc, type:c.type, name:c.label, sub:vs[0].name});
    } else {
      const vo = pickVoicing(c.rootPc, c.type);
      if (vo) out.push({frets:vo.frets, tuning:tun(), rootPc:c.rootPc,
        type:c.type, name:c.label});
    }
  }));
  return out;
}
function scalesForChart(bars){
  const out = [], done = new Set();
  bars.forEach(b => b.chords.forEach(c => {
    if (done.has(c.label)) return; done.add(c.label);
    const list = (CHORD_SCALES[c.type] || []).slice(0, 3).map(([k, note, off]) =>
      SCALES[k].name + ' on ' + nameOf((c.rootPc + (off || 0)) % 12));
    out.push({chord:c.label, text:list.join(',  ')});
  }));
  return out;
}

function doExportPdf(){
  try{
    const instName = isKeys() ? 'Keyboard' : TUNINGS[S.inst].name;
    let o;
    if (S.tab === 'jazz' && S.stage !== 8){
      const grips = currentShapes();
      o = {title:'Chord Trainer — ' + chordName(S.root, S.type),
           subtitle:(STAGES[S.stage-1] ? STAGES[S.stage-1].n : '') + '  ·  ' + instName
             + '  ·  ' + grips.length + ' voicings',
           gripTitle:'Voicings', grips,
           scales:scalesForChart([{chords:[{rootPc:S.root, type:S.type,
             label:chordName(S.root, S.type)}]}])};
    } else if (S.tab === 'open'){
      const grips = currentShapes();
      o = {title:'Chord Trainer — ' + S.grp, subtitle:instName + '  ·  key of ' + nameOf(S.root),
           gripTitle:S.grp, grips, scales:[]};
    } else {

/* what is on screen right now, for the PDF */
function currentShapes(){
  const T = tun(), out = [];
  if (S.tab === 'open'){
    if (isKeys()){
      (KEYS_OPEN[S.grp] || []).forEach(type =>
        pianoVoicings(type, S.root, 'close').forEach(vo => out.push({keys:true,
          notes:vo.rh.concat(vo.lh), rootPc:S.root, type, sub:vo.name,
          name:chordName(S.root, type)})));
    } else if (isBass()){
      (KEYS_OPEN[S.grp] || ['maj7','m7','7']).forEach(type => {
        const vo = pickVoicing(S.root, type);
        if (vo) out.push({frets:vo.frets, tuning:T, rootPc:S.root, type,
          name:chordName(S.root, type)});
      });
    } else {
      const items = S.grp === 'Slash chords' ? SLASH : OPEN.filter(s => s.grp === S.grp);
      items.forEach(s => out.push({frets:s.f, tuning:TUNINGS.guitar, rootPc:s.r,
        type:s.t, name:s.slash || s.name ? s.name : chordName(s.r, s.t)}));
    }
    return out;
  }
  if (isKeys()){
    pianoVoicings(S.type, S.root, STAGE_KIND[S.stage] || 'close').forEach(vo =>
      out.push({keys:true, notes:vo.rh.concat(vo.lh), rootPc:S.root, type:S.type,
        name:chordName(S.root, S.type), sub:vo.name}));
    return out;
  }
  const bassSets = [{ix:T.strings.map((_, i) => i).slice(0, 4), name:'all four'}];
  let list = [];
  if (S.stage === 1) list = shells(S.type, S.root, T);
  else if (S.stage === 5) list = rootlessVoicings(S.type, S.root, T);
  else if (S.stage === 6) list = quartal(S.type, S.root, T);
  else if (S.stage >= 2 && S.stage <= 4)
    list = dropVoicings(S.type, S.root, ['','','drop2','drop3','drop24'][S.stage],
      T, isBass() ? bassSets : null);
  list.slice(0, 24).forEach(x => out.push({frets:x.frets, tuning:T, rootPc:S.root,
    type:S.type, name:chordName(S.root, S.type),
    sub:x.set || x.name || ''}));
  return out;
}

  }));
}

/* ============================================================
   MIDI in — play a chord on a keyboard and the app names it
   ============================================================ */
const MIDI = {
  on:false, held:new Map(), timer:null, last:null, names:[], echo:true,
  listeners:[], sustain:false, pending:new Set(),
  async connect(){
    if (!navigator.requestMIDIAccess)
      throw new Error('This browser has no MIDI input. Safari on iPhone and iPad '
        + 'does not support it — Chrome or Edge on a computer or Android does.');
    const acc = await navigator.requestMIDIAccess({sysex:false});
    const wire = a => {
      MIDI.names = [];
      for (const inp of a.inputs.values()){
        inp.onmidimessage = e => MIDI.msg(e);
        MIDI.names.push(inp.name || 'MIDI in');
      }
      MIDI.fire();
    };
    wire(acc);
    acc.onstatechange = () => wire(acc);
    this.on = true;
    return this.names;
  },
  msg(e){
    const [st, d1, d2] = e.data, cmd = st & 0xf0;
    if (cmd === 0x90 && d2 > 0){
      this.held.set(d1, d2);
      if (this.echo) pluck(d1, now(), 1.2, 0.34 + d2 / 400);
    } else if (cmd === 0x80 || (cmd === 0x90 && d2 === 0)){
      if (this.sustain) this.pending.add(d1); else this.held.delete(d1);
    } else if (cmd === 0xb0 && d1 === 64){
      this.sustain = d2 >= 64;
      if (!this.sustain){ this.pending.forEach(n => this.held.delete(n)); this.pending.clear(); }
    } else if (cmd === 0xb0 && (d1 === 123 || d1 === 120)){
      this.held.clear(); this.pending.clear();
    } else return;
    clearTimeout(this.timer);
    /* a chord rolled by hand arrives as several messages — let it settle */
    this.timer = setTimeout(() => this.settle(), 70);
  },
  settle(){
    const notes = [...this.held.keys()].sort((a, b) => a - b);
    let res = null;
    if (notes.length >= 2){
      const w = new Array(12).fill(0);
      notes.forEach(n => { w[n % 12] += 1; });
      res = detectChord(w, notes[0] % 12);
    }
    this.last = {notes, res};
    this.fire();
  },
  fire(){ this.listeners.forEach(f => { try { f(this.last); } catch(e){} }); }
};

/* how well what you played matches the chord on screen */
function matchAgainst(notes, rootPc, type){
  if (!notes || !notes.length) return null;
  const want = new Set(CHORDS[type].iv.map(i => (rootPc + i) % 12));
  const got = new Set(notes.map(n => n % 12));
  const missing = [...want].filter(p => !got.has(p));
  const extra = [...got].filter(p => !want.has(p));
  const dn = degNamer(type);
  return {
    ok: !missing.length && !extra.length,
    missing: missing.map(p => dn(p - rootPc)),
    extra: extra.map(p => nameOf(p)),
    bassOk: notes[0] % 12 === rootPc
  };
}

function midiPanel(v){
  const p = el('div', 'panel');
  p.appendChild(el('h2', null, 'A MIDI keyboard'));
  p.appendChild(el('div', 'note',

  const cmp = el('div', 'note'); cmp.style.marginTop = '6px';
  readout.appendChild(big); readout.appendChild(sub); readout.appendChild(cmp);

  const paint = last => {
    if (!last || !last.notes.length){ big.textContent = '—';
      sub.textContent = MIDI.on ? 'nothing held' : 'not connected'; cmp.textContent = ''; return; }
    const names = last.notes.map(n => nameOf(n % 12) + (Math.floor(n / 12) - 1)).join('  ');
    if (last.res){
      const r = last.res;
      big.textContent = chordName(r.root, r.type);
      const dn = degNamer(r.type);
      sub.innerHTML = names + '<br>' + last.notes.map(n => dn(n % 12 - r.root)).join('  ');
    } else {
      big.textContent = last.notes.length === 1 ? nameOf(last.notes[0] % 12) : '?';
      sub.textContent = names;
    }
    const m = matchAgainst(last.notes, S.root, S.type);
    if (m){
      cmp.innerHTML = 'against <b>' + chordName(S.root, S.type) + '</b>: '
        + (m.ok ? (m.bassOk ? 'that is it' : 'right notes, root not in the bass')
                : [m.missing.length ? 'missing ' + m.missing.join(', ') : '',
                   m.extra.length ? 'extra ' + m.extra.join(', ') : ''].filter(Boolean).join(' · '));
    }
  };
  MIDI.listeners = [paint];

  const row = el('div', 'row'); row.style.marginTop = '8px';
  const btn = el('button', 'btn sm play', MIDI.on ? 'Connected' : 'Connect a keyboard');
  btn.onclick = async () => {
    try{
      const names = await MIDI.connect();
      btn.textContent = 'Connected';
      btn.classList.add('on');
      toast(names.length ? names.join(', ') : 'No MIDI devices found');
    } catch(e){ toast(e.message); }
  };
  const echo = el('button', 'btn sm' + (MIDI.echo ? ' on' : ''), 'Sound the notes');
  echo.onclick = () => { MIDI.echo = !MIDI.echo; echo.classList.toggle('on', MIDI.echo); };
  row.appendChild(btn); row.appendChild(echo);
  p.appendChild(readout); p.appendChild(row);
  if (MIDI.on && MIDI.names.length)
    p.appendChild(el('div', 'note', 'Listening to: ' + MIDI.names.join(', ')));
  p.appendChild(el('div', 'warnbox',
    'Web MIDI does not exist in Safari, so this will not work on an iPhone or iPad. '
    + 'On a computer or an Android tablet in Chrome or Edge it does.'));
  v.appendChild(p);
  paint(MIDI.last);
}

   World grooves in the transport
   ============================================================ */
function fillGrooveSelect(sel){
  const simple = [['swing','Swing'],['straight','Straight 8s'],['rock','Rock'],
    ['funk','Funk'],['bossa','Bossa'],['ballad','Ballad']];
  let html = '<optgroup label="Simple">'
    + simple.map(([id, n]) => '<option value="s:' + id + '">' + n + '</option>').join('')
    + '</optgroup>';
  for (const r of wbRegions()){
    html += '<optgroup label="' + r + '">'
      + wbByRegion(r).map(p => '<option value="w:' + p.region + '|' + p.name + '">'
          + p.name + ' · ' + p.m + '</option>').join('')
      + '</optgroup>';
  }
  sel.innerHTML = html;
}
function applyGroove(val, keepTempo){
  if (val.slice(0, 2) === 'w:'){
    const [region, name] = val.slice(2).split('|');
    const p = wbFind(region, name);
    SEQ.groove = p;
    S.groove = val;
    if (!keepTempo){
      setTempo(p.dt);
    }
  } else {
    SEQ.groove = null;
    SEQ.style = val.slice(2);
    S.groove = val;
  }
  store.set('groove', val);
}
function grooveLabel(){
  if (SEQ.groove) return SEQ.groove.region + ' · ' + SEQ.groove.name + ' · ' + SEQ.groove.m;
  return SEQ.style + ' · ' + SEQ.meter;
}

/* Write the chart out as a MIDI file: chords, bass, and the groove if a
   world pattern is playing. */
function doExportMidi(){
  try{
    const bars = buildBars(S.prog);
    const prev = SEQ.bars; SEQ.bars = bars;
    const out = bars.map((b, i) => ({meter:b.meter, grid:gridFor(i), chords:b.chords}));
    SEQ.bars = prev;
    const p = PROGS.find(x => x.id === S.prog) || {};
    const title = (p.imported ? (S.importName || 'Imported chart') : (p.n || 'Chart'))
      + ' in ' + nameOf(S.root);
    const bytes = buildMidiFile({tempo:SEQ.tempo, bars:out, title,
      prog: isKeys() ? 0 : isBass() ? 33 : 26});
    saveBlob(bytes, (title.replace(/[^\w ]+/g, '').trim() || 'chart') + '.mid', 'audio/midi');
    toast('MIDI saved');
  } catch(e){ toast('MIDI failed: ' + e.message); }
}

/* ============================================================
   Harmonising a melody note — pick the note the tune is on and
   see the voicings that put it on top. Chord melody, backwards.
   ============================================================ */
function melodyHarmoniser(v){
  const p = el('div', 'panel');
  p.appendChild(el('h2', null, 'Harmonising a melody note'));
  p.appendChild(el('div', 'note',
    'Pick the chord, then the note the melody is sitting on. You get the '
    + 'voicings with that note as the highest string, which is what puts the '
    + 'tune on top of the chord.'));

  const cr = el('div', 'row strip-row'); cr.style.padding = '8px 0 2px';
  cr.appendChild(el('span', 'lbl', 'Chord'));
  DROP_TYPES.forEach(t => {
    const b = el('button', 'btn sm' + (S.type === t ? ' on' : ''), CHORDS[t].label || 'major');
    b.onclick = () => { S.type = t; store.set('type', t); render(); };
    cr.appendChild(b);
  });
  p.appendChild(cr);

  const nr = el('div', 'row strip-row'); nr.style.padding = '2px 0 6px';
  nr.appendChild(el('span', 'lbl', 'Melody note'));
  for (let i = 0; i < 12; i++){
    const pc = (S.root + i) % 12;
    const lab = toneName(pc, S.root, S.type);
    const inChord = CHORDS[S.type].iv.some(x => x % 12 === i);
    const b = el('button', 'btn sm' + (S.melPc === pc ? ' on' : ''), lab);
    if (!inChord) b.style.opacity = '.55';
    b.onclick = () => { S.melPc = S.melPc === pc ? null : pc; render(); };
    nr.appendChild(b);
  }
  p.appendChild(nr);
  v.appendChild(p);

  if (S.melPc == null){
    p.appendChild(el('div', 'note', 'The dimmed notes are not in this chord — '
      + 'pick one and the app will tell you which chords do take it.'));
    return;
  }

  const T = tun(), out = [];
  if (!isKeys()){
    ['drop2','drop3','drop24'].forEach(kind => {
      dropVoicings(S.type, S.root, kind, T).forEach(x => {
        const ns = x.frets.map((f, i) => f < 0 ? null : T.strings[i] + f).filter(n => n != null);
        if (Math.max(...ns) % 12 === S.melPc) out.push({x, kind});
      });
    });
  } else {
    ['close','drop2','drop3','drop24','rootless'].forEach(kind => {
      pianoVoicings(S.type, S.root, kind).forEach(vo => {
        if (vo.rh.length && vo.rh[vo.rh.length - 1] % 12 === S.melPc) out.push({piano:vo, kind});
      });
    });
  }

  const head = el('div', 'panel');
  const deg = degNamer(S.type)(S.melPc - S.root);
  const inChord = CHORDS[S.type].iv.some(x => x % 12 === ((S.melPc - S.root) % 12 + 12) % 12);
  head.appendChild(el('h2', null, toneName(S.melPc, S.root, S.type)
    + ' on top of ' + chordName(S.root, S.type)));
  if (!inChord || !out.length){
    const alts = Object.keys(CHORDS).filter(t => CHORDS[t].iv
      .some(x => (S.root + x) % 12 === S.melPc) && DROP_TYPES.concat(['9','13','m9','maj9','7b9','7s9','7s11','69']).includes(t));
    head.appendChild(el('div', 'note',
      'That note is not in this chord' + (inChord ? ', and no voicing reaches it on top' : '')
      + '. Chords on ' + rootName(S.root) + ' that do take it: '
      + (alts.length ? alts.map(t => chordName(S.root, t)).join(', ') : 'none in the library')
      + '. Reharmonising often means changing the chord so the tune sits right.'));
    v.appendChild(head);
    return;
  }
  head.appendChild(el('div', 'note', 'That is the ' + deg + ' of the chord. '
    + out.length + ' voicings put it on the top string.'));
  v.appendChild(head);

  const g = el('div', 'grid');
  out.slice(0, 24).forEach(o => {
    const card = el('div', 'card');
    card.appendChild(el('div', 'cname', chordName(S.root, S.type)));
    if (o.piano){
      card.insertAdjacentHTML('beforeend', keysSVG(o.piano.rh, S.root, S.type, {lh:o.piano.lh, ww:12, wh:44}));
      card.appendChild(el('div', 'cmeta', o.piano.name));
      const b = el('button', 'btn sm play', '▶'); b.onclick = () => playKeys(o.piano);
      card.appendChild(b);
    } else {
      card.insertAdjacentHTML('beforeend', grip(o.x.frets, {rootPc:S.root, tuning:T, type:S.type}));
      card.appendChild(el('div', 'cmeta',
        ({drop2:'drop 2', drop3:'drop 3', drop24:'drop 2 & 4'})[o.kind] + '<br>' + o.x.set));
      const b = el('button', 'btn sm play', '▶');
      b.onclick = () => { stopAll(); strum(o.x.frets, T, now(), 1.9, 'down'); };
      card.appendChild(b);
    }
    g.appendChild(card);
  });
  v.appendChild(g);
}

/* ============================================================
   Grades, barre chords, and building your own progression
   ============================================================ */
const gradeNow = () => gradeAllows(S.grade || 8);

function gradePicker(){
  const row = $('gradeRow'); if (!row) return;
  row.innerHTML = '';
  for (let g = 1; g <= 8; g++){
    const b = el('button', 'btn sm' + (S.grade === g ? ' on' : ''), String(g));
    b.title = GRADE_ADD[g].n;
    b.onclick = () => { S.grade = g; store.set('grade', g); render(); toast('Grade ' + g + ' — ' + GRADE_ADD[g].n); };
    row.appendChild(b);
  }
}

/* ---------- barre chords, by which string carries the root ---------- */
function viewBarre(v){
  if (isKeys() || isBass()){
    v.appendChild(el('div', 'panel',
      '<div class="note">Barre chords are a guitar thing. Switch the instrument to Guitar to see them.</div>'));
    return;
  }
  const allowed = gradeNow();
  const sets = BARRE_SETS.filter(s => allowed.barre.has(s.id));
  if (!sets.length){
    v.appendChild(el('div', 'panel', '<div class="note">Barre chords start at grade 4. '
      + 'Move the grade up to see them.</div>'));
    return;
  }
  v.appendChild(el('div', 'panel', '<div class="note">These are the open shapes made movable. '
    + 'The root moves to whichever string the section names, and the whole shape slides up — '
    + 'the number to the left of the box is the fret the barre goes on.</div>'));

  sets.forEach(set => {
    const p = el('div', 'panel');
    p.appendChild(el('h2', null, set.name));
    p.appendChild(el('div', 'note', 'Built from the ' + set.shape
      + ' you already know. In this key the barre sits at fret '
      + ((((S.root - set.root) % 12) + 12) % 12) + '.'));
    const shapes = barreShapes(set.id).filter(sh => allowed.types.has(sh.t));
    if (!shapes.length){ p.appendChild(el('div', 'note', 'Nothing at this grade yet.')); v.appendChild(p); return; }
    const g = el('div', 'grid');
    shapes.forEach(sh => {
      const b = barreAt(sh, S.root, set.id);
      const card = el('div', 'card');
      card.appendChild(el('div', 'cname', chordName(S.root, sh.t)));
      card.insertAdjacentHTML('beforeend',
        grip(b.frets, {rootPc:S.root, tuning:TUNINGS.guitar, type:sh.t}));
      card.appendChild(el('div', 'cmeta',
        set.shape + (b.off === 0 ? ', open position' : ', barre at fret ' + b.off)));
      const row = el('div', 'cbtns');
      const pb = el('button', 'btn sm play', '▶');
      pb.onclick = () => { stopAll(); strum(b.frets, TUNINGS.guitar, now(), 1.9, 'down'); };
      row.appendChild(pb); row.appendChild(vampBtn(S.root, sh.t));
      card.appendChild(row);
      g.appendChild(card);
    });
    p.appendChild(g);
    v.appendChild(p);
  });
}

/* ---------- your own progression ---------- */
function loadCustom(){ if (!S.custom) S.custom = store.get('custom', []) || []; return S.custom; }
function saveCustom(){ store.set('custom', S.custom || []); }
function addToCustom(rootPc, type){
  loadCustom();
  S.custom.push({rootPc, type});
  saveCustom();
  toast(chordName(rootPc, type) + ' added — ' + S.custom.length + ' bar'
    + (S.custom.length === 1 ? '' : 's'));
  if (S.tab === 'play') render();
}
function vampBtn(rootPc, type){
  const b = el('button', 'btn sm', '+ Vamp');
  b.title = 'Add this chord to your own progression';
  b.onclick = e => { e.stopPropagation(); addToCustom(rootPc, type); };
  return b;
}

function builderPanel(v){
  loadCustom();
  const p = el('div', 'panel');
  p.appendChild(el('h2', null, 'Your own progression'));
  if (!S.custom.length){
    p.appendChild(el('div', 'note',
      'Empty. Tap "+ Vamp" on any chord — open, barre or jazz — and it lands here. '
      + 'Then drag them into the order you want and play it.'));
    const r0 = el('button', 'btn sm', '🎲 Random changes');
    r0.title = 'Throw a wild progression together. Not all of it will be playable.';
    r0.onclick = () => randomChanges();
    p.appendChild(r0);
    p.appendChild(el('div', 'note', 'The random one picks odd roots, altered chords and '
      + 'sometimes an odd time signature. Some of it will not sit under the fingers — '
      + 'that is rather the point.'));
    v.appendChild(p);
    return;
  }
  p.appendChild(el('div', 'note', 'Drag a chord to move it. Tap the × to take it out.'));
  const list = el('div', 'row'); list.style.cssText = 'margin:8px 0;gap:6px;flex-wrap:wrap';
  S.custom.forEach((c, i) => {
    const chip = el('div', 'chip');
    chip.style.cssText = 'display:flex;align-items:center;gap:6px;padding:8px 10px;'
      + 'font-size:14px;color:var(--text);touch-action:none;cursor:grab;user-select:none';
    chip.dataset.i = i;
    chip.appendChild(el('span', null, chordName(c.rootPc, c.type)));
    const x = el('button', null, '×');
    x.style.cssText = 'border:0;background:none;color:var(--dim);font-size:16px;'
      + 'line-height:1;padding:0 2px;cursor:pointer';
    x.onclick = e => { e.stopPropagation();
      S.custom.splice(+chip.dataset.i, 1); saveCustom(); render(); };
    chip.appendChild(x);
    list.appendChild(chip);
  });
  /* drag to reorder, with pointer events so it works on a touch screen */
  let drag = null;
  list.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('pointerdown', e => {
      if (e.target.tagName === 'BUTTON') return;
      drag = chip; chip.style.opacity = '.55';
      try { chip.setPointerCapture(e.pointerId); } catch(err){}
    });
    chip.addEventListener('pointermove', e => {
      if (!drag) return;
      e.preventDefault();
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const t = under && under.closest ? under.closest('.chip') : null;
      if (t && t !== drag && t.parentElement === list){
        const kids = [...list.children];
        if (kids.indexOf(t) < kids.indexOf(drag)) list.insertBefore(drag, t);
        else list.insertBefore(drag, t.nextSibling);
      }
    });
    const drop = () => {
      if (!drag) return;
      drag.style.opacity = '';
      S.custom = [...list.children].map(ch => S.custom[+ch.dataset.i]);
      [...list.children].forEach((ch, i) => { ch.dataset.i = i; });
      drag = null; saveCustom();
      if (SEQ.on && S.prog === 'custom') startProg('custom');
    };
    chip.addEventListener('pointerup', drop);
    chip.addEventListener('pointercancel', drop);
  });
  p.appendChild(list);
  const row = el('div', 'row');
  const play = el('button', 'btn sm play', '▶ Play it');
  const rnd = el('button', 'btn sm', '🎲 Random changes');
  rnd.title = 'Throw a wild progression together. Not all of it will be playable.';
  rnd.onclick = () => randomChanges();
  play.onclick = () => { S.prog = 'custom'; store.set('prog', 'custom');
    $('tProg').value = 'custom'; startProg('custom'); };
  const clr = el('button', 'btn sm', 'Clear');
  clr.onclick = () => { S.custom = []; saveCustom(); render(); };
  row.appendChild(play); row.appendChild(rnd); row.appendChild(clr);
  p.appendChild(row);
  v.appendChild(p);
}

/* ============================================================
   Random changes — deliberately wild. Some of it will not be
   playable on a guitar; that is the point of it.
   ============================================================ */
const CRAZY = ['7s5s9','7b5b9','7s11','13b9','maj7s11','maj7s5','mmaj7','m7b5',
  'dim7','aug','7b13','m69','69','9sus4','m11','maj13','7s9','7b9','m13','11'];
function randomChanges(){
  const steps = [1,2,3,4,5,6,8,9,10,11];          /* anything but staying put */
  const n = 4 + Math.floor(Math.random() * 5);
  let pc = S.root;
  const out = [];
  for (let i = 0; i < n; i++){
    const t = CRAZY[Math.floor(Math.random() * CRAZY.length)];
    out.push({rootPc: pc, type: t});
    pc = (pc + steps[Math.floor(Math.random() * steps.length)]) % 12;
  }
  S.custom = out;
  saveCustom();
  const odd = ['4/4','3/4','5/4','7/8','6/8','5/8'];
  S.meter = odd[Math.floor(Math.random() * odd.length)];
  SEQ.meter = S.meter;
  const m = $('tMetre'); if (m) m.value = S.meter;
  S.prog = 'custom'; store.set('prog', 'custom');
  const ps = $('tProg'); if (ps) ps.value = 'custom';
  render();
  startProg('custom');
  toast(n + ' bars in ' + S.meter + ' — good luck');
}
