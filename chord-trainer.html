<script>
/* ============================================================
   Chord Trainer — screen logic
   ============================================================ */
const S = {
  inst:'guitar', root:0, show:'degrees', tab:'open', meter:'4/4',
  grp:'Major', stage:1, type:'maj7', prog:'ii-v-i', topDeg:null, melPc:null,
  grade:8, custom:null,
  imported:null, importName:'', pasted:'', groove:'s:swing'
};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('chordtrainer:' + k);
    return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('chordtrainer:' + k, JSON.stringify(v)); }catch(e){} }
};
['inst','root','show','tab','grp','stage','type','prog','meter','groove'].forEach(k => {
  const v = store.get(k); if (v != null) S[k] = v;
});

const tun = () => TUNINGS[S.inst] || TUNINGS.guitar;
const isBass = () => S.inst === 'bass4' || S.inst === 'bass5';
const $ = id => document.getElementById(id);
const el = (t, c, h) => { const e = document.createElement(t);
  if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const nameOf = pc => rootName(pc);
/* the name a chord tone goes by, spelled from that chord's root */
const toneName = (pc, rootPc, type) =>
  spell(rootName(rootPc), degNamer(type)(pc - rootPc), pc, type);
const chordName = (r, t) => rootName(r) + CHORDS[t].label;

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ------------------------------------------------------------
   Chord diagram
   ------------------------------------------------------------ */
function grip(frets, opt){
  opt = opt || {};
  const dn = opt.type ? degNamer(opt.type) : (s => DEG[((s % 12) + 12) % 12]);
  const T = opt.tuning || tun(), n = T.strings.length;
  const fretted = frets.filter(f => f > 0);
  const maxF = fretted.length ? Math.max(...fretted) : 0;
  const minF = fretted.length ? Math.min(...fretted) : 0;
  const base = (maxF <= 4) ? 0 : minF - 1;
  /* leave room on the left for the position number when there is one */
  const W = opt.w || 118, padL = base === 0 ? 14 : 24, padR = 8, padT = 22, padB = 12;
  const rows = 5, sw = (W - padL - padR) / (n - 1), fh = 22;
  const H = padT + rows * fh + padB;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  /* nut or position number */
  if (base === 0) s += `<rect x="${padL-1}" y="${padT-3}" width="${(n-1)*sw+2}" height="4" fill="#7d879b" rx="1"/>`;
  else s += `<text x="3" y="${padT+15}" fill="#8b93a7" font-size="10.5">${base+1}</text>`;
  for (let r = 0; r <= rows; r++)
    s += `<line x1="${padL}" y1="${padT + r*fh}" x2="${padL+(n-1)*sw}" y2="${padT + r*fh}" stroke="#2a313e" stroke-width="1"/>`;
  for (let i = 0; i < n; i++)
    s += `<line x1="${padL + i*sw}" y1="${padT}" x2="${padL + i*sw}" y2="${padT + rows*fh}" stroke="#3a4354" stroke-width="1"/>`;
  /* markers above the nut — open strings carry their own label */
  for (let i = 0; i < n; i++){
    const x = padL + i*sw;
    if (frets[i] < 0){
      s += `<text x="${x}" y="${padT-6}" fill="#6b7488" font-size="11" text-anchor="middle">×</text>`;
    } else if (frets[i] === 0){
      const pc = T.strings[i] % 12;
      const lab = S.show === 'fingers' ? ''
        : S.show === 'names' ? (opt.type && opt.rootPc != null
            ? toneName(pc, opt.rootPc, opt.type) : nameOf(pc))
        : (opt.rootPc != null ? dn(pc - opt.rootPc) : '');
      if (lab) s += `<text x="${x}" y="${padT-5}" font-size="8.5" text-anchor="middle" fill="var(--accent)">${lab}</text>`;
      else s += `<circle cx="${x}" cy="${padT-10}" r="3.4" fill="none" stroke="#8b93a7" stroke-width="1.3"/>`;
    }
  }
  /* dots */
  for (let i = 0; i < n; i++){
    const f = frets[i]; if (f <= 0) continue;
    const x = padL + i*sw, y = padT + (f - base - 0.5) * fh;
    if (y > padT + rows*fh) continue;
    const pc = (T.strings[i] + f) % 12;
    let lab = '';
    const noFingers = S.show === 'fingers' && !(opt.fingers && opt.fingers[i]);
    if (S.show === 'fingers' && !noFingers) lab = opt.fingers[i];
    else if (S.show === 'names') lab = opt.type && opt.rootPc != null
      ? toneName(pc, opt.rootPc, opt.type) : nameOf(pc);
    else if (opt.rootPc != null) lab = dn(pc - opt.rootPc);
    const isRoot = opt.rootPc != null && pc === opt.rootPc;
    s += `<circle cx="${x}" cy="${y}" r="8.4" fill="${isRoot ? 'var(--accent)' : '#dfe4ee'}"/>`;
    if (lab) s += `<text x="${x}" y="${y+3.4}" font-size="${lab.length>2?7.5:9}" text-anchor="middle" fill="#10141c" font-weight="600">${lab}</text>`;
  }
  return s + '</svg>';
}

/* ------------------------------------------------------------
   Neck map, for chord scales
   ------------------------------------------------------------ */
function neck(scaleIv, scaleRoot, chordPcs, frets){
  const T = tun(), n = T.strings.length, F = frets || 15;
  const W = 340, padL = 20, padR = 8, padT = 14, padB = 16;
  const fw = (W - padL - padR) / F, sh = 17;
  const H = padT + (n-1)*sh + padB;
  const set = new Set(scaleIv.map(i => (scaleRoot + i) % 12));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  for (let f = 0; f <= F; f++){
    const x = padL + f*fw;
    s += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+(n-1)*sh}" stroke="${f===0?'#7d879b':'#262c38'}" stroke-width="${f===0?2.5:1}"/>`;
  }
  for (const m of [3,5,7,9,15]) if (m <= F)
    s += `<circle cx="${padL+(m-0.5)*fw}" cy="${padT+(n-1)*sh/2}" r="2.2" fill="#323a49"/>`;
  if (F >= 12) s += `<circle cx="${padL+11.5*fw}" cy="${padT+(n-1)*sh/2-6}" r="2.2" fill="#323a49"/><circle cx="${padL+11.5*fw}" cy="${padT+(n-1)*sh/2+6}" r="2.2" fill="#323a49"/>`;
  for (let i = 0; i < n; i++){
    const y = padT + (n-1-i)*sh;
    s += `<line x1="${padL}" y1="${y}" x2="${padL+F*fw}" y2="${y}" stroke="#2f3746" stroke-width="1"/>`;
    s += `<text x="4" y="${y+3.5}" font-size="9" fill="#6b7488">${T.labels[i]}</text>`;
    for (let f = 0; f <= F; f++){
      const pc = (T.strings[i] + f) % 12;
      if (!set.has(pc)) continue;
      const x = padL + (f === 0 ? -6 : (f-0.5)*fw);
      const isRoot = pc === scaleRoot % 12;
      const inChord = chordPcs && chordPcs.includes(pc);
      s += `<circle cx="${x}" cy="${y}" r="6.2" fill="${isRoot?'var(--accent)':inChord?'#dfe4ee':'#3d4657'}"/>`;
      const sd = SDEG[((pc - scaleRoot) % 12 + 12) % 12];
      const lab = S.show === 'names' ? spell(rootName(scaleRoot), sd, pc) : sd;
      s += `<text x="${x}" y="${y+2.8}" font-size="${lab.length>1?6.2:7.2}" text-anchor="middle" fill="${isRoot||inChord?'#10141c':'#c3cad8'}" font-weight="600">${lab}</text>`;
    }
  }
  return s + '</svg>';
}

/* ------------------------------------------------------------
   Picking a voicing to sound
   ------------------------------------------------------------ */
function pickVoicing(rootPc, type){
  const T = tun();
  if (isKeys()) return null;
  if (!isBass()){
    const o = OPEN.find(s => s.r === rootPc && s.t === type);
    if (o) return {frets:o.f, fingers:o.fg};
  }
  if (DROP_TYPES.includes(type)){
    const v = dropVoicings(type, rootPc, 'drop2', T,
      isBass() ? [{ix:T.strings.map((_,i)=>i).slice(0,4), name:'bass'}] : SETS_GUITAR.drop2);
    const ok = v.filter(x => x.low >= (isBass() ? 3 : 0) && x.low <= 9);
    if (ok.length) return {frets:ok[0].frets};
    if (v.length) return {frets:v[0].frets};
  }
  if (ROOTLESS[type]){
    const v = rootlessVoicings(type, rootPc, T);
    if (v.length) return {frets:v[0].frets};
  }
  return null;
}
function chordMidis(rootPc, type, around){
  const iv = CHORDS[type].iv;
  const base = (around || 52);
  let r = rootPc + 12 * Math.round((base - rootPc) / 12);
  return iv.map(i => r + i);
}
function compNotes(rootPc, type){
  if (isKeys()){
    const vs = pianoVoicings(type, rootPc, ROOTLESS[type] ? 'rootless' : 'close');
    if (vs.length) return vs[0].rh.concat(vs[0].lh);
    return chordMidis(rootPc, type, 60);
  }
  const v = pickVoicing(rootPc, type), T = tun();
  if (v) { const out = []; v.frets.forEach((f,i) => { if (f >= 0) out.push(T.strings[i] + f); });
    if (!isBass()) return out; }
  return chordMidis(rootPc, type, 55);
}

/* ------------------------------------------------------------
   Progressions
   ------------------------------------------------------------ */
const PROGS = [

  {id:'rhythm',   n:'Rhythm changes, A section', st:'swing',

      [[0,'7']],[[5,'6'],[6,'dim7']],[[0,'maj7'],[9,'7']],[[2,'m7'],[7,'7']]]},
  {id:'modal',    n:'Modal vamp, up a semitone', st:'swing',

   b:[[[0,'maj']],[[9,'min']],[[5,'maj']],[[7,'maj']]]},
  {id:'pop4',     n:'I – IV – V', st:'rock',

function mkChord(rootPc, type, bassPc){
  const bp = bassPc == null ? rootPc : bassPc;
  let bassMidi = 28 + ((bp - 28) % 12 + 12) % 12;
  while (bassMidi < 33) bassMidi += 12;
  return {rootPc, type, iv:CHORDS[type].iv, bassMidi, bassPc:bassPc,
          comp:compNotes(rootPc, type),
          label:chordName(rootPc, type) + (bassPc != null && bassPc !== rootPc
            ? '/' + nameOf(bassPc) : '')};
}
function buildBars(progId){
  const p = PROGS.find(x => x.id === progId) || PROGS[0];
  let bars;
  if (p.custom){
    const src = loadCustom();
    bars = src.map(c => ({meter:S.meter, chords:[mkChord(c.rootPc, c.type)]}));
    if (!bars.length) bars = [{meter:S.meter, chords:[mkChord(S.root, S.type)]}];
  } else if (p.imported){
    const src = S.imported || [];
    bars = src.map(b => ({meter:b.meter || S.meter,
      chords:b.chords.map(c => mkChord(c.rootPc, c.type, c.bassPc))}));
    if (!bars.length) bars = [{meter:S.meter, chords:[mkChord(S.root, S.type)]}];
  } else {
    const raw = p.self ? [[[0, S.type]],[[0, S.type]]] : p.b;
    bars = raw.map((bar, i) => ({
      meter: p.mts ? p.mts[i % p.mts.length] : (p.mt || S.meter),
      chords: bar.map(([deg, type]) => mkChord((S.root + deg) % 12, type))
    }));
  }
  /* tell each bass note where the next chord is going, for the walk-up */
  const flat = [];
  bars.forEach(b => b.chords.forEach(c => flat.push(c)));
  flat.forEach((c, i) => {
    const nx = flat[(i+1) % flat.length];
    c.nextRoot = c.bassMidi + (((nx.rootPc - c.rootPc) % 12 + 12) % 12);
  });
  return bars;
}

let curBars = [], curBar = 0;
function startProg(id, startAt){
  if (id) S.prog = id;
  const p = PROGS.find(x => x.id === S.prog);
  if (p && p.st && !SEQ.userStyle && !SEQ.groove) {
    SEQ.style = p.st; $('tStyle').value = 's:' + p.st; }
  if (p && (p.mt || p.mts)) { SEQ.meter = p.mt || p.mts[0]; $('tMetre').value = SEQ.meter; }
  else SEQ.meter = S.meter;
  curBars = buildBars(S.prog);
  seqStart(curBars, b => { curBar = b; paintChart(); paintNow(); }, startAt);
  $('tPlay').textContent = '❚❚ Pause';
  paintNow();
}
function paintNow(){
  const bar = curBars[curBar];
  if (!bar) { $('tNow').textContent = 'Pick a chord or a progression'; return; }
  const c = bar.chords[0];
  const sc = (CHORD_SCALES[c.type] || [])[0];
  const scName = sc ? SCALES[sc[0]].name + ' on ' + nameOf((c.rootPc + (sc[2]||0)) % 12) : '';
  $('tNow').innerHTML = '<b>' + c.label + '</b>' + (scName ? ' · play ' + scName : '');
}
function paintChart(){
  const box = $('chartBox'); if (!box) return;
  [...box.children].forEach((d, i) => d.classList.toggle('now', i === curBar));
}

/* ---------- scale strip, shown under every chord ---------- */
function scaleStrip(rootPc, type){
  const list = CHORD_SCALES[type] || [];
  const d = el('div', 'strip');
  list.slice(0, 4).forEach(([key, note, off, clash]) => {
    const scRoot = (rootPc + (off || 0)) % 12;
    const c = el('button', 'chip', SCALES[key].name.replace(/ \(.*\)/, '')
      + (off ? ' on ' + nameOf(scRoot) : ''));
    c.title = note;
    c.onclick = e => { e.stopPropagation(); playScale(key, scRoot);
      toast(SCALES[key].name + ' on ' + nameOf(scRoot) + ' — ' + note); };
    d.appendChild(c);
  });
  return d;
}
function playScale(key, scRoot){
  stopAll();
  const iv = SCALES[key].iv, t0 = now(), T = tun();
  const base = T.strings[0] + 12 + (((scRoot - T.strings[0]) % 12) + 12) % 12;
  const notes = iv.concat([12]).map(i => base + i);
  notes.forEach((m, i) => pluck(m, t0 + i * 0.17, 0.4, 0.4));
}

  'Sus 4':'The 4th sits where the 3rd was and wants to fall back to it. Play the sus4 then the plain chord and you hear it.',
  'Add 9':'A plain major triad with the 9th added, and the 7th left out. That last part is what makes it "add", not a 9th chord.',
  'Ninths':'A 9th chord has the b7 in it as well. Cadd9 and C9 are different chords.',
  'Sixths':'The 6th replaces the 7th. Warmer, older-sounding, and everywhere in soul and pop.',
  'Half diminished':'m7b5. Not a rare chord — it is the ii of every minor key.',
  '7sus4':'A dominant with the 3rd swapped for the 4th. All over pop and gospel.',
  'Slash chords':'Same chord, different bass note. Usually written to keep a bass line walking down.'
};

/* bass version of the open-chord list */
function bassChordList(v){
  const types = {
    'Major':['maj','6','add9'], 'Minor':['min','m6','m7'], 'Dominant 7':['7','9','13'],
    'Major 7':['maj7','maj9'], 'Minor 7':['m7','m9','m11'], 'Half diminished':['m7b5'],
    'Sus 2':['sus2'], 'Sus 4':['sus4'], 'Add 9':['add9'], 'Sixths':['6','m6'],
    'Ninths':['9','maj9','m9'], '7sus4':['7sus4','9sus4'],
    'Diminished / augmented':['dim7','aug'], 'Power':['5'], 'Slash chords':['maj','min']
  }[S.grp] || ['maj7','m7','7'];
  const T = tun(), g = el('div', 'grid');
  types.forEach(type => {
    const iv = CHORDS[type].iv;
    const sev = iv.find(x => x === 9 || x === 10 || x === 11);
    const fifth = iv.find(x => x === 6 || x === 7 || x === 8);
    /* the note that tells you what the chord is: the 3rd, or on a sus
       chord the 2nd or 4th standing in for it. A power chord has none. */
    const colour = iv.find(x => x === 3 || x === 4);
    const sub = colour == null ? iv.find(x => x === 2 || x === 5) : null;
    const parts = [{n:'Root and 5th', offs:[0, fifth == null ? 7 : fifth]}];
    if (colour != null)
      parts.push({n: sev != null ? 'Guide tones' : 'Root and 3rd',
                  offs: sev != null ? [colour, sev] : [0, colour]});
    else if (sub != null)
      parts.push({n: sev != null ? 'The ' + IVNAME[sub] + ' and the b7' : 'Root and the ' + IVNAME[sub],
                  offs: sev != null ? [sub, sev] : [0, sub]});
    parts.push({n:'Arpeggio', offs:iv.map(x => x % 12), arp:true});
    parts.forEach(part => {
      const card = el('div', 'card');
      card.appendChild(el('div', 'cname', chordName(S.root, type)));
      card.appendChild(el('div', 'cmeta', part.n));
      let frets = new Array(T.strings.length).fill(-1);
      if (part.arp){
        const notes = iv.map(i => S.root + i);
        card.insertAdjacentHTML('beforeend',
          neck(iv.map(i => i % 12), S.root, iv.map(i => (S.root + i) % 12), 12));
        const p = el('button', 'btn sm play', '▶ Arpeggio');
        p.onclick = () => { stopAll(); const t0 = now();
          const base = T.strings[0] + 12 + (((S.root - T.strings[0]) % 12) + 12) % 12;
          iv.concat([12]).forEach((i, k) => pluck(base + i, t0 + k * 0.2, 0.45, 0.45)); };
        card.appendChild(p);
      } else {
        const pl = place(part.offs, S.root, [0, 1], T, {maxSpan:5})
          .concat(place(part.offs, S.root, [1, 2], T, {maxSpan:5}));
        const best = pl.filter(x => x.low >= 2 && x.low <= 9)[0] || pl[0];
        if (best){
          frets = best.frets;
          card.insertAdjacentHTML('beforeend', grip(frets, {rootPc:S.root, tuning:T, type:type}));
          const p = el('button', 'btn sm play', '▶');
          p.onclick = () => { stopAll(); const t0 = now();
            frets.forEach((f, i) => { if (f >= 0) bassNote(T.strings[i] + f, t0, 1.2, 0.5); }); };
          card.appendChild(p);
        } else card.appendChild(el('div', 'cmeta', 'not reachable in this key'));
      }
      card.appendChild(scaleStrip(S.root, type));
      g.appendChild(card);
    });
  });
  v.appendChild(g);
}

/* ---------- 2. jazz, stage by stage ---------- */
const STAGES = [
  {n:'Guide tones', d:'The 3rd and the 7th are the two notes that say what the chord is. Everything else is optional. Learn these and you can already comp through a standard.'},
  {n:'Drop 2', d:'Take the four notes stacked up close, then drop the second one down from the top by an octave. That is the whole trick. It spreads the chord across four strings next to each other, so you can actually play it.'},
  {n:'Drop 3', d:'Same idea, but drop the third voice down instead. That leaves a gap, so one string in the middle gets muted — the × in the diagram.'},
  {n:'Drop 2 & 4', d:'Drop the second and the fourth voices. Very wide, very open. Needs a string skipped, sometimes two.'},
  {n:'Rootless', d:'Leave the root out altogether and let the bass have it. Two shapes cover everything: A form starts on the 3rd, B form starts on the 7th.'},
  {n:'Quartal', d:'Stack fourths instead of thirds. Ambiguous on purpose — one shape covers several chords. This is the modal sound.'},
  {n:'Upper structures', d:'Put a plain major or minor triad in the wrong place over a dominant. Easy shapes, complicated names.'},
  {n:'Reharmonising', d:'Changing the chords under a melody that stays put. Each move below is a different way of getting from where you are to where you are going.'},
  {n:'Gospel', d:'Wide left hand, close right hand, and a 9th or a 13th where a plain 7th would do. These are written out as the chord they actually make.', keysOnly:true}
];
const JAZZ_TYPES = ['maj7','7','m7','m7b5','dim7','m6','6','mmaj7','9','13','7b9','7s9','7s11','9sus4'];

function viewJazz(v){
  const sr = el('div', 'stage');
  if (STAGES[S.stage-1] && STAGES[S.stage-1].keysOnly && !isKeys()) S.stage = 1;
  if (!gradeNow().stages.has(S.stage)){
    const first = [...gradeNow().stages].sort((a,b)=>a-b)[0];
    if (!first){ v.appendChild(el('div','panel','<div class="note">The jazz voicings start at '
      + 'grade 5 with guide tones, and build up from there. Move the grade up to open them.</div>'));
      return; }
    S.stage = first;
  }
  const allowJ = gradeNow();
  STAGES.forEach((s, i) => {
    if (s.keysOnly && !isKeys()) return;
    if (!allowJ.stages.has(i + 1)) return;
    const b = el('button', 'btn sm stagebtn' + (S.stage === i+1 ? ' on' : ''), (i+1) + '. ' + s.n);
    b.onclick = () => { S.stage = i+1; store.set('stage', i+1); render(); };
    sr.appendChild(b);
  });
  v.appendChild(sr);

  const head = el('div', 'panel');
  head.appendChild(el('h2', null, STAGES[S.stage-1].n));
  head.appendChild(el('div', 'note', STAGES[S.stage-1].d));
  v.appendChild(head);

  if (S.stage === 8) return reharm(v);

  const tr = el('div', 'row strip-row'); tr.style.padding = '2px 0 6px';
  tr.appendChild(el('span', 'lbl', 'Chord'));
  const allowed = S.stage === 9 ? [...new Set(GOSPEL.map(g => g.type))]
                : S.stage === 5 ? Object.keys(ROOTLESS)
                : S.stage === 7 ? ['7','7b9','7s9','7s11','13']
                : S.stage <= 4 ? DROP_TYPES : JAZZ_TYPES;
  const gt = gradeNow().types;
  const allowG = allowed.filter(t => gt.has(t));
  if (allowG.length) allowed.length = 0, allowG.forEach(t => allowed.push(t));
  if (!allowed.includes(S.type)) S.type = allowed[0];
  allowed.forEach(t => {
    const b = el('button', 'btn sm' + (S.type === t ? ' on' : ''), CHORDS[t].label || 'major');
    b.onclick = () => { S.type = t; store.set('type', t); render(); };
    tr.appendChild(b);
  });
  v.appendChild(tr);

  if (isKeys()) return keysJazzList(v, S.stage);
  const T = tun();
  const bassSets = [{ix:T.strings.map((_, i) => i).slice(0, 4), name:'all four strings'}];
  let list = [];
  if (S.stage === 1) list = shells(S.type, S.root, T);
  if (S.stage === 2) list = dropVoicings(S.type, S.root, 'drop2', T, isBass() ? bassSets : null);
  if (S.stage === 3) list = dropVoicings(S.type, S.root, 'drop3', T, isBass() ? bassSets : null);
  if (S.stage === 4) list = dropVoicings(S.type, S.root, 'drop24', T, isBass() ? bassSets : null);
  if (S.stage === 5) list = rootlessVoicings(S.type, S.root, T);
  if (S.stage === 6) list = quartal(S.type, S.root, T);
  if (S.stage === 7) return upperStructures(v);

  if (S.topDeg != null){
    list = list.filter(x => {
      const ns = x.frets.map((f, i) => f < 0 ? null : T.strings[i] + f).filter(n => n != null);
      return degNamer(S.type)((Math.max(...ns) % 12) - S.root) === S.topDeg;
    });
  }

  if (isBass() && S.stage <= 4){
    v.appendChild(el('div', 'panel',
      '<div class="warnbox">These do work on bass — most are a one to three fret stretch. '
      + 'Low down they will sound muddy, so the ones above the 5th fret are the usable ones. '
      + 'Guide tones and arpeggios are the everyday tools; these are for chord solos and intros.</div>'));
  }
  if (!list.length){
    v.appendChild(el('div', 'panel', '<div class="note">Nothing reachable for that combination. Try another chord or key.</div>'));
    return;
  }

  /* filter by top note — the chord-melody way in */
  const fr = el('div', 'row strip-row'); fr.style.padding = '2px 0';
  fr.appendChild(el('span', 'lbl', 'Top note'));
  const anyB = el('button', 'btn sm' + (S.topDeg == null ? ' on' : ''), 'any');
  anyB.onclick = () => { S.topDeg = null; render(); };
  fr.appendChild(anyB);
  const dnT = degNamer(S.type);
  [...new Set(CHORDS[S.type].iv.map(i => dnT(i)))].forEach(d => {
    const b = el('button', 'btn sm' + (S.topDeg === d ? ' on' : ''), d);
    b.onclick = () => { S.topDeg = S.topDeg === d ? null : d; render(); };
    fr.appendChild(b);
  });
  v.insertBefore(fr, v.children[3] || null);

  const g = el('div', 'grid');
  list.slice(0, 30).forEach(x => {
    const card = el('div', 'card');
    const bassPc = x.bass != null ? x.bass : null;
    card.appendChild(el('div', 'cname', chordName(S.root, S.type)
      + (bassPc != null && bassPc !== S.root ? '/' + nameOf(bassPc) : '')));
    card.insertAdjacentHTML('beforeend', grip(x.frets, {rootPc:S.root, tuning:T, type:S.type}));
    const sub = x.kind === 'shell' || x.kind === 'rootless' || x.kind === 'quartal'
      ? x.name + '<br>' + x.set
      : ['root position','1st inversion','2nd inversion','3rd inversion'][x.inv] + '<br>' + x.set;
    card.appendChild(el('div', 'cmeta', sub));
    const row = el('div', 'cbtns');
    const p = el('button', 'btn sm play', '▶');
    p.onclick = () => { stopAll(); strum(x.frets, T, now(), 1.9, 'down'); };
    row.appendChild(p); row.appendChild(vampBtn(S.root, S.type));
    card.appendChild(row);
    g.appendChild(card);
  });
  v.appendChild(g);
  v.appendChild(scaleStrip(S.root, S.type));
}

function upperStructures(v){
  const T = tun();
  UST.forEach(u => {
    const triadRoot = (S.root + u.off) % 12;
    const p = el('div', 'panel');
    p.appendChild(el('h2', null,
      nameOf(triadRoot) + (u.q === 'min' ? ' minor' : ' major') + ' triad over ' + chordName(S.root, '7')));
    p.appendChild(el('div', 'note', 'Gives you ' + u.gives + ' — reads as ' + nameOf(S.root) + u.read + '.'));
    const iv = u.q === 'min' ? [0,3,7] : [0,4,7];
    const g = el('div', 'grid');
    const sets = T.strings.length >= 6
      ? [{ix:[2,3,4]},{ix:[3,4,5]},{ix:[1,2,3]}] : [{ix:[1,2,3]},{ix:[0,1,2]}];
    const seen = new Set();
    sets.forEach(s => {
      for (let inv = 0; inv < 3; inv++){
        const cp = closePos(iv, inv), base = cp[0];
        const offs = cp.map(x => x - base + ((base % 12) + 12) % 12);
        const pl = place(offs, triadRoot, s.ix, T, {maxSpan:4});
        for (const pp of pl.slice(0, 1)){
          const k = pp.frets.join(',');
          if (seen.has(k)) continue; seen.add(k);
          const card = el('div', 'card');
          card.appendChild(el('div', 'cname', nameOf(triadRoot) + (u.q === 'min' ? 'm' : '')));
          card.insertAdjacentHTML('beforeend', grip(pp.frets, {rootPc:S.root, tuning:T, type:'7'}));
          card.appendChild(el('div', 'cmeta', 'degrees shown against ' + nameOf(S.root)));
          const b = el('button', 'btn sm play', '▶');
          b.onclick = () => { stopAll(); const t0 = now();
            bassNote(28 + ((S.root - 28) % 12 + 12) % 12 + 12, t0, 2, 0.5);
            strum(pp.frets, T, t0 + 0.02, 1.9, 'down'); };
          card.appendChild(b);
          g.appendChild(card);
        }
      }
    });
    p.appendChild(g);
    v.appendChild(p);
  });
}

const REHARM = [
  {n:'Tritone substitution', d:'Swap the V7 for the dominant a tritone away. They share the same 3rd and 7th, so the melody still fits and the bass walks down by a semitone.', prog:'tritone'},
  {n:'Backdoor cadence', d:'Instead of V7, come in from the flat side: IVm7 to bVII7 to I. Softer landing.', prog:'backdoor'},
  {n:'Insert a ii before every V', d:'Any dominant can be preceded by its own ii chord, whether or not the tune says so. Two chords in a bar instead of one.', prog:'turn'},
  {n:'Diminished passing chord', d:'Fill the gap between two chords a tone apart with a dim7 in between. Bar 6 of a jazz blues is the classic.', prog:'jblues'},
  {n:'Modal interchange', d:'Borrow a chord from the parallel minor: bVI, bVII, or iv in a major key. The bIII and bVI in the minor blues are the same idea.', prog:'mblues'},
  {n:'Coltrane changes', d:'Move the key centre in major thirds instead of fifths. Three tonal centres, all a major 3rd apart.', prog:'coltrane'},
  {n:'Relative minor turn', d:'Take a major ii–V–I and follow it with the ii–V–i of its relative minor. Half of the standard repertoire does this.', prog:'cycle'}
];
function reharm(v){
  REHARM.forEach(r => {
    const p = el('div', 'panel');
    p.appendChild(el('h2', null, r.n));
    p.appendChild(el('div', 'note', r.d));
    const b = el('button', 'btn sm play', '▶ Play it in ' + nameOf(S.root));
    b.style.marginTop = '8px';
    b.onclick = () => { $('tProg').value = r.prog; startProg(r.prog); S.tab = 'play'; store.set('tab','play'); render(); };
    p.appendChild(b);
    v.appendChild(p);
  });
  melodyHarmoniser(v);
}

/* ---------- 3. chord scales ---------- */
function viewScales(v){
  const tr = el('div', 'row strip-row'); tr.style.padding = '2px 0 6px';
  tr.appendChild(el('span', 'lbl', 'Chord'));
  Object.keys(CHORD_SCALES).filter(t => gradeNow().types.has(t)).forEach(t => {
    const b = el('button', 'btn sm' + (S.type === t ? ' on' : ''), CHORDS[t].label || 'major');
    b.onclick = () => { S.type = t; store.set('type', t); render(); };
    tr.appendChild(b);
  });
  v.appendChild(tr);

  const chordPcs = CHORDS[S.type].iv.map(i => (S.root + i) % 12);
  const list = CHORD_SCALES[S.type] || [];
  list.forEach(([key, note, off, clash], i) => {
    const scRoot = (S.root + (off || 0)) % 12;
    const p = el('div', 'panel');
    p.appendChild(el('h2', null, SCALES[key].name + ' on ' + nameOf(scRoot)
      + (i === 0 ? '' : '')));
    p.appendChild(el('div', 'note', note + (clash ? ' Deliberate rub — it does not contain every chord tone.' : '')));
    p.insertAdjacentHTML('beforeend', isKeys()
      ? keysScaleSVG(SCALES[key].iv, scRoot, chordPcs)
      : neck(SCALES[key].iv, scRoot, chordPcs, isBass() ? 14 : 15));
    const row = el('div', 'row');
    const b = el('button', 'btn sm play', '▶ Run it');
    b.onclick = () => playScale(key, scRoot);
    const b2 = el('button', 'btn sm', 'Vamp the chord under it');
    b2.onclick = () => { $('tProg').value = 'this'; startProg('this'); };
    row.appendChild(b); row.appendChild(b2);
    p.appendChild(row);
    v.appendChild(p);
  });
  const key = el('div', 'panel');
  key.appendChild(el('div', 'note',
    (isKeys() ? 'The brighter keys are chord tones. The coloured dot is the root of the scale. '
              : 'Filled dots are chord tones. The coloured dot is the root of the scale. ')
    + 'Play the chord, then the scale, then the chord again — that is how the sound sticks.'));
  v.appendChild(key);
}

/* ---------- 4. play along ---------- */
function viewPlay(v){
  const p = el('div', 'panel');
  const pr = PROGS.find(x => x.id === S.prog) || {};
  p.appendChild(el('h2', null, (pr.imported ? (S.importName || 'Imported chart')
    : pr.n + ' in ' + nameOf(S.root))));
  const box = el('div', 'chart'); box.id = 'chartBox';
  const bars = buildBars(S.prog);
  curBars = SEQ.on ? curBars : bars;
  let lastMetre = null;
  bars.forEach((b, i) => {
    const d = el('div', 'bar' + (i === curBar && SEQ.on ? ' now' : ''));
    if (b.meter && b.meter !== lastMetre){
      const tag = el('span', 'metre', b.meter);
      tag.style.cssText = 'font-size:11px;color:var(--accent);font-weight:600;'
        + 'align-self:flex-start;width:100%;text-align:left;margin:-4px 0 -2px 2px';
      d.appendChild(tag);
      lastMetre = b.meter;
    }
    b.chords.forEach(c => {
      const s = el('span', b.chords.length > 1 ? 'two' : '', c.label);
      d.appendChild(s);
    });
    d.onclick = () => { S.root = b.chords[0].rootPc; S.type = b.chords[0].type;
      store.set('type', S.type); S.tab = 'scales'; store.set('tab','scales'); render(); };
    box.appendChild(d);
  });
  p.appendChild(box);
  p.appendChild(el('div', 'note', SEQ.groove
    ? 'Tap a bar to see its chord scales. The groove is setting the bar: '
      + SEQ.groove.region + ' · ' + SEQ.groove.name + ' in ' + SEQ.groove.m
      + ', so the metre written on the chart is not being used.'
    : 'Tap a bar to see its chord scales.'));
  v.appendChild(p);

  const sp = el('div', 'panel');
  sp.appendChild(el('h2', null, 'What to play over it'));
  const seen = new Set();
  bars.forEach(b => b.chords.forEach(c => {
    if (seen.has(c.label)) return; seen.add(c.label);
    const row = el('div'); row.style.margin = '6px 0';
    row.appendChild(el('span', null, '<b>' + c.label + '</b> '));
    const sc = (CHORD_SCALES[c.type] || [])[0];
    if (sc) row.insertAdjacentHTML('beforeend',
      '<span class="note">' + SCALES[sc[0]].name + ' on '
      + nameOf((c.rootPc + (sc[2]||0)) % 12) + ' — ' + sc[1] + '</span>');
    sp.appendChild(row);
  }));
  v.appendChild(sp);

  builderPanel(v);

  const gp = el('div', 'panel');
  gp.appendChild(el('h2', null, 'The grips it is using'));
  const g = el('div', 'grid'); const done = new Set();
  bars.forEach(b => b.chords.forEach(c => {
    if (done.has(c.label)) return; done.add(c.label);
    const card = el('div', 'card');
    card.appendChild(el('div', 'cname', c.label));
    if (isKeys()){
      const vs = pianoVoicings(c.type, c.rootPc, ROOTLESS[c.type] ? 'rootless' : 'close');
      if (vs.length){
        card.insertAdjacentHTML('beforeend',
          keysSVG(vs[0].rh, c.rootPc, c.type, {lh:vs[0].lh, ww:12, wh:44}));
        const pb = el('button', 'btn sm play', '▶');
        pb.onclick = () => playKeys(vs[0]);
        card.appendChild(pb);
      }
      g.appendChild(card); return;
    }
    const vo = pickVoicing(c.rootPc, c.type);
    if (vo){
      card.insertAdjacentHTML('beforeend',
        grip(vo.frets, {fingers:vo.fingers, rootPc:c.rootPc, tuning:tun(), type:c.type}));
      const pb = el('button', 'btn sm play', '▶');
      pb.onclick = () => { stopAll(); strum(vo.frets, tun(), now(), 1.9, 'down'); };
      card.appendChild(pb);
    } else card.appendChild(el('div', 'cmeta', 'played as separate notes'));
    g.appendChild(card);
  }));
  gp.appendChild(g);
  v.appendChild(gp);
}

/* ------------------------------------------------------------
   Wiring
   ------------------------------------------------------------ */
function setTempo(v, quiet){
  SEQ.tempo = Math.max(40, Math.min(260, Math.round(v)));
  const l = $('tTempoLbl'); if (l) l.textContent = SEQ.tempo;
  if (!quiet) store.set('tempo', SEQ.tempo);
}
function initTransport(){
  const ps = $('tProg');
  PROGS.forEach(p => { const o = document.createElement('option');
    o.value = p.id; o.textContent = p.n; ps.appendChild(o); });
  ps.value = S.prog;
  ps.onchange = () => { S.prog = ps.value; store.set('prog', ps.value);
    const pp = PROGS.find(x => x.id === ps.value);
    if (pp && (pp.mt || pp.mts)) { S.meter = pp.mt || pp.mts[0]; $('tMetre').value = S.meter; }
    if (SEQ.on) startProg(); if (S.tab === 'play') render(); };

  const ss = $('tStyle');
  fillGrooveSelect(ss);
  applyGroove(S.groove || 's:swing', true);
  ss.value = S.groove;
  ss.onchange = () => { applyGroove(ss.value); SEQ.userStyle = true;
    if (SEQ.on) startProg(); if (S.tab === 'play') render(); };

  const ms = $('tMetre');
  METRES.forEach(m => { const o = document.createElement('option');
    o.value = m.id; o.textContent = m.id; ms.appendChild(o); });
  ms.value = S.meter; SEQ.meter = S.meter;
  ms.onchange = () => { S.meter = ms.value; SEQ.meter = ms.value;
    store.set('meter', ms.value); if (SEQ.on) startProg(); if (S.tab === 'play') render(); };

  $('tMash').onclick = () => mash();
  $('tPdf').onclick = () => doExportPdf();
  $('tMidi').onclick = () => doExportMidi();

  setTempo(store.get('tempo', 120), true);
  const hold = (el, d) => {
    let t = 0, iv = 0, n = 0;
    const go = () => { setTempo(SEQ.tempo + d * (n > 16 ? 5 : n > 7 ? 2 : 1)); n++; };
    const dn = e => { e.preventDefault(); n = 0; go(); clearTimeout(t);
      t = setTimeout(() => { iv = setInterval(go, 70); }, 360); };
    const up = () => { clearTimeout(t); clearInterval(iv); iv = 0; };
    el.addEventListener('pointerdown', dn);
    ['pointerup','pointercancel','pointerleave'].forEach(k => el.addEventListener(k, up));
  };
  hold($('tDn'), -2); hold($('tUp'), 2);
  const lbl = $('tTempoLbl');
  let y0 = 0, b0 = 0, dy = 0, drag = false;
  lbl.addEventListener('pointerdown', e => {
    try { lbl.setPointerCapture(e.pointerId); } catch(err){}
    y0 = e.clientY; b0 = SEQ.tempo; dy = 0; drag = true; });
  lbl.addEventListener('pointermove', e => { if (!drag) return;
    dy = y0 - e.clientY; if (Math.abs(dy) > 4){ e.preventDefault(); setTempo(b0 + dy / 2.2); } });
  ['pointerup','pointercancel'].forEach(k => lbl.addEventListener(k, () => { drag = false; }));

  $('tPlay').onclick = () => {
    if (SEQ.on){
      if (!AnthosSync.stop()) { seqStop(); $('tPlay').textContent = '▶ Play'; }
    } else {
      /* in a room, ask the room — it tells everyone, including us */
      if (!AnthosSync.play(SEQ.tempo)) startProg();
    }
  };
  $('tStop').onclick = () => { AnthosSync.stop(); seqStop(); $('tPlay').textContent = '▶ Play'; curBar = 0; paintChart(); };
  $('tCount').onclick = e => { SEQ.countIn = !SEQ.countIn; e.target.classList.toggle('on', SEQ.countIn); };
  [['tDrums','drums'],['tBass','bass'],['tComp','comp']].forEach(([id, k]) => {
    $(id).onclick = e => { SEQ.parts[k] = !SEQ.parts[k]; e.target.classList.toggle('on', SEQ.parts[k]); };
  });
}

/* The transport has grown as controls were added. Measure it instead of
   carrying a fixed number, so the last panel can never end up behind it. */
function fitTransport(){
  const t = document.querySelector('.transport');
  if (t) document.body.style.paddingBottom = (t.offsetHeight + 14) + 'px';
}
pickers();
initTransport();
render();
fitTransport();
addEventListener('resize', fitTransport);
/* join a room and every device starts on the same beat */
AnthosSync.register({
  ctx: () => ac(),
  play(bpm, when){
    if (bpm) setTempo(bpm);
    seqStop();
    startProg(null, when);
    $('tPlay').textContent = '❚❚ Pause';
  },
  stop(){ seqStop(); $('tPlay').textContent = '▶ Play'; },
  setTempo(bpm){ setTempo(bpm); }
}, 'Chord Trainer');
if (window.ResizeObserver) new ResizeObserver(fitTransport).observe(document.querySelector('.transport'));

</script>
