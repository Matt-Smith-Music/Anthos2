    }
    for (let k = 0; k < strings.length; k++) {
      const on = g.filter(x => x.s === strings[k]).map(x => x.fret);
      if (on.length > 1 && Math.max.apply(null, on) - Math.min.apply(null, on) > ARP_STRING_SPAN) return;
    }
    const fr = g.map(x => x.fret);
    const span = Math.max.apply(null, fr) - Math.min.apply(null, fr);
    const even = alloc.reduce((a, b) => a + Math.abs(b - N / S), 0);
    const rank = span * 10 + even;
    if (!best || rank < best.rank) best = {
      rank,
      g
    };
  };
  const walk = (idx, left, acc) => {
    if (idx === S) {
      if (left === 0) score(acc);
      return;
    }
    for (let k = 0; k <= 2; k++) {
      if (left - k < 0 || left - k > (S - idx - 1) * 2) continue;
      walk(idx + 1, left - k, acc.concat([k]));
    }
  };
  walk(0, N, []);
  return best ? best.g : arpeggioGrid(root, typeId, rootStr);
}

      q: "Degrees of the " + s.name.toLowerCase() + " scale?",
      a: spelt.map(n => n.deg).join(" · "),
      tag: "scale"
    });
    cards.push({
      id: "su-" + s.id,
      cat: "scales",
      q: "Which chords does " + s.name.toLowerCase() + " fit over?",
      a: s.use,
      tag: "scale"

.sym{font-family:'Barlow Condensed',sans-serif; font-size:23px; font-weight:600; letter-spacing:.01em}
.meter-mark{position:absolute; top:5px; left:50%; transform:translateX(-50%);
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:11px; color:var(--jewel);
  letter-spacing:.04em}
.meter-mark.back{color:#8E98A3; font-weight:600}
.bar.now .meter-mark{color:var(--ink)}
.bar.meterchg{border-color:var(--jewel)}
.brk-label{position:absolute; top:5px; right:7px; font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase; letter-spacing:.14em; font-size:10px; color:var(--teal)}
.bar.brk .sym{color:var(--teal)}
.bar.now.brk .sym,.bar.now.brk .brk-label{color:var(--ink)}

.req{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:26px;
  border-top:1px solid var(--line); padding-top:22px}
.req h3{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.14em;
  font-size:14px; margin:0 0 12px; color:var(--jewel)}
.req dl{margin:0}
.req dl div{padding:0 0 10px}
.req dt{font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.12em;
  font-size:12px; color:var(--dim)}
.req dd{margin:2px 0 0; font-size:14px}
.req ul{margin:0; padding-left:18px; font-size:14px}
.req li{padding-bottom:8px}
.req-foot{color:var(--dim); font-size:13px; border-top:1px solid var(--line); padding-top:10px; margin-top:4px}

.foot{max-width:1080px; margin:0 auto; padding:20px 18px 44px; color:#8E98A3; font-size:12px;
  border-top:1px solid var(--line); line-height:1.7}

@media (max-width:720px){
  .wordmark{font-size:24px}
  .chord-stage{grid-template-columns:1fr}
  .boxes{justify-content:center}
  .big-symbol{font-size:42px}
  .rack{flex-direction:column; gap:6px}
  .rack-label{padding-top:0}

  /* nothing runs off the edge: rows wrap inside the layout instead of scrolling */
  .switch{flex-wrap:wrap; overflow:visible; gap:1px}
  .switch-btn{padding:9px 12px 10px; font-size:13px; letter-spacing:.1em}
  .subswitch{flex-wrap:wrap; overflow:visible}
  .chips{flex-wrap:wrap; overflow:visible}
  .chips.tight{gap:3px}
  .chip{min-width:34px; padding:8px 9px}
  .chip.sm{padding:6px 8px; min-width:30px; font-size:12px}

  /* four bars to a line as a real chart does, with the symbols kept readable */
  .chart{grid-template-columns:repeat(4,1fr); gap:3px; margin:4px 0 22px}
  .bar{min-height:58px; padding:15px 2px 6px}
  .sym{font-size:19px}
  .barchords{gap:4px}
  .barnum{top:3px; left:4px; font-size:9px}
  .brk-label{top:3px; right:4px; font-size:8px; letter-spacing:.04em}

  /* claw the height back from the controls above it */
  .controls{gap:12px; padding:12px 0}
  .ctl label{margin-bottom:5px}
  .transport{gap:8px; padding:10px 0 14px}
  .play{padding:12px 22px; font-size:15px}
  .panel-head p{margin-bottom:14px}
}

@media (max-width:380px){
  .sym{font-size:17px}
  .bar{min-height:54px}
}

@media (prefers-reduced-motion:reduce){
  .lamp{animation:none}
  .amp *{transition:none !important}
  .mlamp{transition:none}
}
.metro-tempo{display:flex;align-items:center;gap:10px;justify-content:center;margin:18px 0 8px}
.metro-bpm{font-size:44px;font-weight:700;color:#3FD4C4;min-width:120px;text-align:center}
.metro-bpm span{font-size:14px;color:#8E98A3;font-weight:400}
.metro-slider{width:100%;max-width:420px;display:block;margin:0 auto 16px;accent-color:#3FD4C4}
.metro-lamps{display:flex;gap:10px;justify-content:center;margin:10px 0 18px;flex-wrap:wrap}
.mlamp{width:16px;height:16px;border-radius:50%;background:#1D2226;border:1px solid #2A3136;transition:background .05s}
.mlamp.lv2{border-color:#3FD4C4}
.mlamp.lit{background:#EEF0F2}
.mlamp.lv2.lit{background:#3FD4C4}
.metro-run{display:flex;gap:12px;justify-content:center}
`;
