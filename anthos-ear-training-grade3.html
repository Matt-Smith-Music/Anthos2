   on hand stores its electric guitars as a 50ms blip looping a 3ms window,
   which repeats into a static buzz - no use for training an ear. A plucked
   string is cheap to model properly: excite a delay line with a noise burst and
   let it decay, and you get the real thing, an attack that fades and a spectrum
   that evolves. The piano IS sampled, because those samples are good. */

  clean: {

    damp: 0.9982,

const KS = {};
const KSORDER = [];

    last += p.seed * (w - last);
    ring[i] = last;

  for (let i = 0; i < n; i++) {

    out[i] = cur;

<script>
(function(){
  var KEY = 'anthos-ear-training-grade3' + ':paper';
  var on = false;
  try { on = localStorage.getItem(KEY) === '1'; } catch(e){}
  function apply(){
    document.body.classList.toggle('paper', on);
    if (btn){ btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.textContent = on ? 'Paper' : 'Paper'; }
  }
  var btn = document.createElement('button');
  btn.className = 'paperBtn'; btn.type = 'button'; btn.textContent = 'Paper';
  btn.title = 'Show the score as ink on paper';
  btn.addEventListener('click', function(){
    on = !on;
    try { localStorage.setItem(KEY, on ? '1' : '0'); } catch(e){}
    apply();
  });
  document.addEventListener('DOMContentLoaded', function(){
    document.body.appendChild(btn); apply();
  });
  if (document.readyState !== 'loading'){ document.body.appendChild(btn); apply(); }
})();
</script>
