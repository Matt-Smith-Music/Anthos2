<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<title>Inner Ear</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{--bg:#101315;--panel:#171B1E;--panel2:#1D2226;--line:#2A3136;--ink:#EEF0F2;--mut:#8E98A3;--acc:#E6B24D;--acc2:#63D5C8;--good:#58D68D;--bad:#FF6B6B;--warn:#FFD166}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:'Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#appBack{display:flex;align-items:center;gap:7px;height:calc(44px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0 12px;background:#0C0E10;color:var(--ink);font:700 14px/1 system-ui,sans-serif;text-decoration:none;border-bottom:1px solid var(--line)}
#appBack .chev{font-size:19px;line-height:1;margin-top:-2px;color:var(--acc)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.logo{font-weight:800;font-size:20px;letter-spacing:-0.02em;color:var(--acc)}
.logo small{font-weight:600;font-size:11px;color:var(--mut);margin-left:6px;letter-spacing:0}
header .sp{flex:1}
.ib{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;min-height:36px;padding:6px 11px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.ib:active{transform:translateY(1px)}
.ib.on{border-color:var(--acc2);color:var(--acc2)}
.ib.acc{border-color:var(--acc);color:var(--acc)}
.ib:disabled{opacity:.4}
.stages{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stage{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 9px;font:600 12.5px/1 inherit;color:var(--mut);display:flex;align-items:center;gap:7px;cursor:pointer}
.stage b{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--panel2);align-items:center;justify-content:center;font-size:11px;color:var(--ink)}
.stage.sel{border-color:var(--acc);color:var(--ink)}
.stage.sel b{background:var(--acc);color:#1A1200}
.stage.locked{opacity:.45}
.tasks{display:flex;margin:0 14px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tasks button{flex:1;border:0;background:none;color:var(--mut);font:700 13.5px/1 inherit;font-family:inherit;min-height:38px;cursor:pointer}
.tasks button.sel{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
main{padding:0 14px 30px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px}
.meta{display:flex;align-items:center;gap:8px;font:600 12px/1.2 inherit;color:var(--mut);flex-wrap:wrap}
.meta .lv{display:flex;gap:4px;align-items:center}
.meta .lv i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.meta .lv i.on{background:var(--acc)}
.meta .sp{flex:1}
.title{font:800 15px/1.25 inherit;margin:6px 0 2px}
.blurb{font:500 12.5px/1.35 inherit;color:var(--mut);margin:0 0 8px}
.prompt{font:600 16px/1.35 inherit;margin:4px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.tight{gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;min-height:42px;padding:8px 14px;font:700 14px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#F0C15E,#C89232);border-color:#E6B24D;color:#1A1200}
.btn.grow{flex:1 1 auto}
.btn.on{border-color:var(--acc2);color:var(--acc2)}
.btn:disabled{opacity:.4}
.btn.small{min-height:34px;padding:6px 10px;font-size:12.5px;border-radius:9px}
/* the voice stack */
.stack{display:flex;flex-direction:column;gap:5px;margin:8px 0 2px}
.vrow{display:grid;grid-template-columns:34px 1fr 62px 34px;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 6px;min-height:40px;transition:border-color .12s,box-shadow .12s}
.vrow.lit{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset}
.vrow.target{border-color:var(--acc)}
.vrow .solo{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 11px/1 inherit;font-family:inherit;cursor:pointer}
.vrow .solo:disabled{opacity:.35}
.vrow .mute{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font:700 13px/1 inherit;font-family:inherit;cursor:pointer}
.vrow .mute.off{color:var(--bad);border-color:var(--bad)}
.vrow .lab{font:600 12.5px/1.2 inherit;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .lab b{color:var(--ink);font-weight:700}
.vrow .nm{font:700 14px/1 inherit;text-align:right;color:var(--ink);letter-spacing:.01em}
.vrow .nm.hid{color:var(--mut);font-weight:600}
.vrow.target .nm{color:var(--acc)}
.chordsym{font:700 13px/1.2 inherit;color:var(--acc);margin:2px 0 4px}
.chordnav{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.chordnav button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 9px;font:700 12px/1 inherit;font-family:inherit;cursor:pointer}
.chordnav button.sel{color:var(--ink);border-color:var(--acc)}
/* tuner */
.tuner{margin:10px 0 4px;background:#0C0E10;border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.tuner .head{display:flex;align-items:baseline;gap:8px;font:600 12px/1 inherit;color:var(--mut)}
.tuner .head b{font-size:13px;color:var(--ink)}
.tuner .head .sp{flex:1}
.tuner .steps{display:flex;gap:5px}
.tuner .steps i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.tuner .steps i.done{background:var(--good)}
.tuner .steps i.cur{background:var(--acc)}
.meter{position:relative;height:64px;margin:8px 0 0}
.meter .scale{position:absolute;left:8%;right:8%;top:30px;height:2px;background:var(--line)}
.meter .tick{position:absolute;top:24px;width:2px;height:14px;background:var(--line)}
.meter .tick.mid{background:var(--mut);height:20px;top:21px}
.meter .zone{position:absolute;top:26px;height:10px;background:rgba(88,214,141,.16);border-radius:4px}
.meter .needle{position:absolute;top:8px;width:4px;height:46px;background:var(--acc2);border-radius:2px;margin-left:-2px;transform:translateX(0);transition:left .06s linear,background .12s;box-shadow:0 0 10px rgba(99,213,200,.35)}
.meter .needle.good{background:var(--good);box-shadow:0 0 12px rgba(88,214,141,.5)}
.meter .needle.off{opacity:.15}
.readout{display:flex;align-items:center;gap:10px;margin-top:2px}
.readout .cents{font:800 30px/1 inherit;min-width:92px;letter-spacing:-.02em}
.readout .hint{font:700 15px/1.2 inherit;color:var(--acc2)}
.readout .hint.good{color:var(--good)}
.readout .lvl{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.readout .lvl i{display:block;height:100%;width:0;background:var(--acc2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:6px 0 4px}
.opts.wide{grid-template-columns:1fr}
.opts button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:11px;min-height:44px;padding:8px 10px;font:600 14px/1.2 inherit;font-family:inherit;cursor:pointer;text-align:left}
.opts button.sel{border-color:var(--acc2);color:var(--acc2)}
.opts button.right{border-color:var(--good);color:var(--good)}
.opts button.wrong{border-color:var(--bad);color:var(--bad)}
.opts button:disabled{opacity:.7}
/* keyboard */
.kb{position:relative;height:120px;margin:8px 0 6px;user-select:none;touch-action:manipulation}
.kb .w{position:absolute;top:0;bottom:0;background:#EEF0F2;border:1px solid #2A3136;border-radius:0 0 5px 5px}
.kb .b{position:absolute;top:0;height:62%;background:#16191B;border:1px solid #000;border-radius:0 0 4px 4px;z-index:2}
.kb .k.on{background:var(--acc2)}
.kb .k.b.on{background:#1f8f83}
.kb .k.given{background:#F6E2AE}
.kb .k.b.given{background:#5a4a20}
.kb .k .n{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:600 9px/1 system-ui;color:#4b5560;pointer-events:none}
.kb .k.b .n{color:#9aa4ae}
.entered{display:flex;gap:6px;flex-wrap:wrap;min-height:30px;align-items:center;font:700 13px/1 inherit}
.entered span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.entered span.ok{border-color:var(--good);color:var(--good)}
.entered span.bad{border-color:var(--bad);color:var(--bad)}
.entered .ph{color:var(--mut);font-weight:600}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.slot{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;gap:4px;align-items:center}
.slot select{background:#0C0E10;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 4px;font:700 13px/1 inherit;font-family:inherit}
.slot.ok{border-color:var(--good)}
.slot.bad{border-color:var(--bad)}
.slot .bar{font:700 11px/1 inherit;color:var(--mut);padding:0 2px}
/* reveal */
.reveal{display:none}
.reveal.on{display:block}
.reveal .verdict{font:800 16px/1.2 inherit;margin:0 0 4px}
.reveal .verdict.good{color:var(--good)}
.reveal .verdict.bad{color:var(--bad)}
.reveal .text{font:500 13.5px/1.4 inherit;color:var(--ink);margin:0 0 6px}
canvas#score{width:100%;height:150px;display:block;background:#0C0E10;border:1px solid var(--line);border-radius:10px}
.foot{font:500 11.5px/1.35 inherit;color:var(--mut);margin-top:6px}
/* settings */
.settings{display:none}
.settings.on{display:block}
.set{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set:first-child{border-top:0}
.set .k{font:600 13px/1.2 inherit;flex:1 1 130px}
.set .k small{display:block;color:var(--mut);font-weight:500;font-size:11.5px;margin-top:2px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mut);font:700 12.5px/1 inherit;font-family:inherit;padding:8px 10px;min-height:34px;cursor:pointer}
.seg button.sel{background:var(--panel);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
input[type=range]{width:120px;accent-color:var(--acc2)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#22282D;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:600 13px/1.3 inherit;max-width:calc(100% - 28px);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:700px){main{max-width:640px;margin:0 auto;width:100%}.stages,.tasks,header{max-width:668px;margin-left:auto;margin-right:auto}}
</style>
<style id="psLinkStyle">.psLink{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:99999;font:700 12px/1 system-ui,sans-serif;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#0C0E10;white-space:nowrap}.psLink:active{transform:translateY(1px)}</style>

<script>
/* Keep the screen awake whenever the app is genuinely in use, so an iPhone's
   auto-lock cannot kill a practice session. "In use" means one of two things:
   the app is making sound (metronome, backing, drill playback, game clicks),
   or the microphone is live - which is the Sight Fuse case, where the student
   reads and plays for minutes without touching the glass and the app itself
   may be nearly silent. Self-contained so it cannot collide with app code. */
(function () {
  var QUIET = 4000, POLL = 1500;
  var lastSound = 0, streams = [], lock = null, pending = false;
  function mark() { lastSound = Date.now(); }
  function watch(c) {
    ["createOscillator", "createBufferSource"].forEach(function (fn) {
      if (typeof c[fn] !== "function") return;
      var orig = c[fn].bind(c);
      c[fn] = function () {
        var n = orig.apply(null, arguments);
        if (n && typeof n.start === "function") {
          var st = n.start.bind(n);
          n.start = function () { mark(); return st.apply(null, arguments); };
        }
        return n;
      };
    });
    return c;
  }
  var O = window.AudioContext || window.webkitAudioContext;
  if (O) {
    var W = function () { return watch(Reflect.construct(O, Array.prototype.slice.call(arguments))); };
    W.prototype = O.prototype;
    try { window.AudioContext = W; window.webkitAudioContext = W; } catch (e) {}
  }
  var md = navigator.mediaDevices;
  if (md && typeof md.getUserMedia === "function") {
    var gum = md.getUserMedia.bind(md);
    md.getUserMedia = function () {
      return gum.apply(null, arguments).then(function (s) { streams.push(s); return s; });
    };
  }
  function micLive() {
    for (var i = 0; i < streams.length; i++) {
      var t = streams[i].getAudioTracks ? streams[i].getAudioTracks() : [];
      for (var j = 0; j < t.length; j++) if (t[j].readyState === "live" && t[j].enabled) return true;
    }
    return false;
  }
  function acquire() {
    if (lock || pending || !navigator.wakeLock || !navigator.wakeLock.request) return;
    pending = true;
    navigator.wakeLock.request("screen").then(function (l) {
      pending = false; lock = l;
      l.addEventListener("release", function () { lock = null; });
    }).catch(function () { pending = false; });
  }
  function release() {
    if (!lock) return;
    var l = lock; lock = null;
    try { l.release(); } catch (e) {}
  }
  setInterval(function () {
    var busy = (Date.now() - lastSound < QUIET) || micLive();
    if (busy && !document.hidden) acquire(); else release();
  }, POLL);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) release();
  });
})();
</script>

<header>
  <div class="logo">Inner Ear<small>v1.0</small></div>
  <div class="sp"></div>
  <button class="ib" id="bMic">Mic off</button>
  <button class="ib" id="bTeacher" title="Teacher switch: open every stage">Unlock all</button>
  <button class="ib" id="bSettings">Settings</button>
</header>
<div class="stages" id="stages"></div>
<div class="tasks" id="tasks">
  <button data-t="sing" class="sel">Sing</button>
  <button data-t="name">Name</button>
  <button data-t="write">Write</button>
</div>
<main>
  <section class="card" id="cardSettings">
    <div class="settings on" id="settings"></div>
  </section>
  <section class="card" id="cardDrill">
    <div class="meta">
      <span id="mStage"></span>
      <span class="lv" id="mLevel"><i></i><i></i><i></i></span>
      <span class="sp"></span>
      <span id="mScore"></span>
    </div>
    <div class="title" id="dTitle"></div>
    <div class="blurb" id="dBlurb"></div>
    <div class="prompt" id="dPrompt"></div>
    <div class="row" id="playRow">
      <button class="btn primary grow" id="bPlay">▶ Play</button>
      <button class="btn" id="bHalf">½ speed</button>
      <button class="btn" id="bLoop">Loop</button>
      <button class="btn" id="bStop">■</button>
    </div>
    <div class="chordnav" id="chordNav"></div>
    <div class="chordsym" id="chordSym"></div>
    <div class="stack" id="stack"></div>
    <div id="taskArea"></div>
    <div class="row" id="actionRow"></div>
  </section>
  <section class="card reveal" id="cardReveal">
    <div class="verdict" id="rVerdict"></div>
    <div class="text" id="rText"></div>
    <canvas id="score" width="600" height="150"></canvas>
    <div class="foot" id="rFoot"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn primary grow" id="bNext">Next ›</button>
      <button class="btn" id="bAgain">Hear it again</button>
    </div>
  </section>
</main>

    kb.innerHTML = ''; const base = write.base; const whites = []; for (let m = base; m <= base + 24; m++) if ([0, 2, 4, 5, 7, 9, 11].includes(m % 12)) whites.push(m);
    const ww = 100 / whites.length;
    const givenSet = new Set([anchor, ...(w.given || [])]);
    whites.forEach((m, i) => { const k = document.createElement('div'); k.className = 'k w' + (write.notes.includes(m) ? ' on' : '') + (givenSet.has(m) ? ' given' : ''); k.style.left = (i * ww) + '%'; k.style.width = ww + '%'; k.dataset.m = m; if (m % 12 === 0) k.innerHTML = `<span class="n">C${Math.floor(m / 12) - 1}</span>`; kb.appendChild(k); });
    whites.forEach((m, i) => { const nb = m + 1; if (![1, 3, 6, 8, 10].includes(nb % 12) || nb > base + 24) return; const k = document.createElement('div'); k.className = 'k b' + (write.notes.includes(nb) ? ' on' : '') + (givenSet.has(nb) ? ' given' : ''); k.style.left = ((i + 1) * ww - ww * 0.3) + '%'; k.style.width = (ww * 0.6) + '%'; k.dataset.m = nb; kb.appendChild(k); });
    $('kbRange').textContent = `${noteName(base)} – ${noteName(base + 24)}`;
    ent.innerHTML = write.notes.length ? write.notes.map(m => `<span>${noteName(m, rootIsFlat(drill.chords[0].root, drill.chords[0].key))}</span>`).join('') : `<span class="ph">${w.mode === 'seq' ? `${w.targets.length} notes to enter` : `${w.targets.length} note${w.targets.length > 1 ? 's' : ''} to find`}</span>`;
  };
  kb.addEventListener('pointerdown', e => { const k = e.target.closest('.k'); if (!k || answered) return; const m = +k.dataset.m; stopPlayback(true); tone(m, 0, 0.9, 0.3); if (w.mode === 'seq') write.notes.push(m); else { const i = write.notes.indexOf(m); if (i >= 0) write.notes.splice(i, 1); else write.notes.push(m); } draw(); });
  $('kbDn').addEventListener('click', () => { write.base = clamp(write.base - 12, 24, 84); draw(); }); $('kbUp').addEventListener('click', () => { write.base = clamp(write.base + 12, 24, 84); draw(); });
  $('kbUndo').addEventListener('click', () => { write.notes.pop(); draw(); }); $('kbClear').addEventListener('click', () => { write.notes = []; draw(); });
  draw();
  const bAnchor = document.createElement('button'); bAnchor.className = 'btn'; bAnchor.textContent = `Hear ${w.anchorLabel}`; bAnchor.addEventListener('click', () => { stopPlayback(true); tone(anchor, 0, 1.2, 0.3); (w.given || []).forEach((m, i) => tone(m, 0.01 * i, 1.2, 0.22)); });
  const bCheck = document.createElement('button'); bCheck.className = 'btn primary grow'; bCheck.textContent = 'Check';
  bCheck.addEventListener('click', () => {
    if (answered) return;
    const given = new Set([anchor, ...(w.given || [])]);
    const got = write.notes.filter(m => !w.pcOnly || !given.has(m));
    const want = w.targets.filter(m => !given.has(m) || w.mode === 'seq');
    const eq = (x, y) => w.pcOnly ? pcOf(x) === pcOf(y) : x === y;
    let ok, marks;
    if (w.mode === 'seq') { ok = got.length === want.length && got.every((m, i) => eq(m, want[i])); marks = got.map((m, i) => i < want.length && eq(m, want[i])); }
    else { const rem = want.slice(); marks = got.map(m => { const i = rem.findIndex(t => eq(t, m)); if (i >= 0) { rem.splice(i, 1); return true; } return false; }); ok = rem.length === 0 && marks.every(Boolean); }
    ent.innerHTML = got.map((m, i) => `<span class="${marks[i] ? 'ok' : 'bad'}">${noteName(m, rootIsFlat(drill.chords[0].root, drill.chords[0].key))}</span>`).join('') + (ok ? '' : `<span class="ph">answer: ${want.map(m => noteName(m, rootIsFlat(drill.chords[0].root, drill.chords[0].key))).join(' ')}</span>`);
    finish(ok);
  });
  const bReveal = document.createElement('button'); bReveal.className = 'btn'; bReveal.textContent = 'Reveal'; bReveal.addEventListener('click', () => finish(null, 'Revealed'));
  act.appendChild(bCheck); act.appendChild(bAnchor); act.appendChild(bReveal);
}
function renderChanges(a, act) {
  const w = drill.write; const key = w.key;
  const names = (key !== undefined && !rootIsFlat(0, key)) ? IE.NAMES_S : IE.NAMES_F;
  const wrap = document.createElement('div'); wrap.className = 'slots';
  write.slots = w.targets.map((t, i) => {
    const s = document.createElement('div'); s.className = 'slot';
    const given = w.given.includes(i);
    s.innerHTML = `<span class="bar">${i + 1}</span><select class="root">${names.map((n, k) => `<option value="${k}" ${given && k === t.root ? 'selected' : ''}>${n}</option>`).join('')}</select><select class="type">${SEVENTHS.map(x => `<option value="${x}" ${given && x === t.type ? 'selected' : ''}>${TYPES[x].sym || 'maj'}</option>`).join('')}</select>`;
    if (given) s.querySelectorAll('select').forEach(x => x.disabled = true);
    else { s.querySelector('.root').value = '0'; s.querySelector('.type').value = 'maj7'; }
    s.querySelectorAll('select').forEach(x => x.addEventListener('change', () => { stopPlayback(true); const r = +s.querySelector('.root').value, ty = s.querySelector('.type').value; const v = IE.closeVoicing(r, ty, 0, 48); playVoicing(v, 0, 1.1, 0.2); }));
    wrap.appendChild(s); return s;
  });
  a.appendChild(wrap);
  const bCheck = document.createElement('button'); bCheck.className = 'btn primary grow'; bCheck.textContent = 'Check';
  bCheck.addEventListener('click', () => {
    if (answered) return; let ok = true;
    write.slots.forEach((s, i) => { const r = +s.querySelector('.root').value, ty = s.querySelector('.type').value; const t = w.targets[i]; const good = pcOf(r) === t.root && ty === t.type; s.classList.add(good ? 'ok' : 'bad'); if (!good) ok = false; s.querySelectorAll('select').forEach(x => x.disabled = true); });
    finish(ok);
  });
  const bReveal = document.createElement('button'); bReveal.className = 'btn'; bReveal.textContent = 'Reveal'; bReveal.addEventListener('click', () => finish(null, 'Revealed'));
  act.appendChild(bCheck); act.appendChild(bReveal);
}

/* ================= finishing, scoring ================= */
function finish(ok, label) {
  if (answered) return;
  answered = true; sing.active = false; sing.listening = false; stopPlayback(true);
  const counts = ok !== null && !hinted;
  if (ok === true) { if (counts) { P.streak[stage]++; P.correct[stage]++; P.best[stage] = Math.max(P.best[stage], P.streak[stage]); if (P.streak[stage] % 5 === 0 && P.level[stage] < 3) { P.level[stage]++; toast(`Level ${P.level[stage]} — ${P.level[stage] === 2 ? 'less help from now on' : 'no solos before you answer'}`); } if (P.correct[stage] === UNLOCK_AT && stage < 8) toast(`Stage ${stage + 1} unlocked`); } else tick(true); }
  else if (ok === false) { P.streak[stage] = 0; tick(false); }
  saveP(); renderMeta(); renderStages();
  const v = $('rVerdict'); v.className = 'verdict ' + (ok === true ? 'good' : ok === false ? 'bad' : ''); v.textContent = ok === true ? (counts ? 'Correct' : 'Correct (no streak credit)') : ok === false ? 'Not that one' : (label || 'Answer');
  $('rText').textContent = drill.reveal ? drill.reveal.text : '';
  $('rFoot').textContent = drill.stage === 8 ? 'Sounding pitch. The line as it was played.' : 'Treble and bass staves at sounding pitch. Target voice in gold.';
  $('cardReveal').classList.add('on');
  renderStack();
  [...$('actionRow').querySelectorAll('button')].forEach(b => { if (b.id !== 'bSingTap') b.disabled = true; });
  const t = $('bSingTap'); if (t) t.disabled = true;
  drawScore();
  $('cardReveal').scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

/* ================= engraving ================= */
const GLY = {}; for (const k in GLY_SRC) GLY[k] = {p: new Path2D(GLY_SRC[k].d), w: GLY_SRC[k].w};
const LZ_SP = 250;
function glyphFill(ctx, g, x, y, s, flipY) { ctx.save(); ctx.translate(x, y); ctx.scale(s, flipY ? s : -s); ctx.fill(g.p); ctx.restore(); }
function drawScore() {
  const cv = $('score'); const dpr = window.devicePixelRatio || 1; const W = cv.clientWidth || 600, H = 150;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  const lineMode = drill.stage === 8;
  const sp = lineMode ? 8.5 : 7, gs = sp / LZ_SP;
  const staves = lineMode ? [{top: 58, base: 30, clef: 'G'}] : [{top: 34, base: 30, clef: 'G'}, {top: 34 + 4 * sp + 30, base: 18, clef: 'F'}];
  const yOfIn = (st, di) => st.top + 4 * sp - (di - st.base) * sp / 2;
  ctx.lineWidth = 1;
  staves.forEach(st => { const bottom = st.top + 4 * sp; ctx.strokeStyle = 'rgba(238,240,242,.55)'; for (let i = 0; i < 5; i++) { const y = Math.round(bottom - i * sp) + 0.5; ctx.beginPath(); ctx.moveTo(6, y); ctx.lineTo(W - 6, y); ctx.stroke(); } ctx.fillStyle = '#EEF0F2'; if (st.clef === 'G') glyphFill(ctx, GLY.clefG, 10, bottom - sp, gs); else glyphFill(ctx, GLY.clefF, 12, bottom - 3 * sp, gs * 0.92); });
  if (staves.length > 1) { ctx.strokeStyle = 'rgba(238,240,242,.55)'; ctx.beginPath(); ctx.moveTo(6.5, staves[0].top); ctx.lineTo(6.5, staves[1].top + 4 * sp); ctx.stroke(); }
  const left = 10 + GLY.clefG.w * gs + sp * 1.2;
  const flatsOf = v => rootIsFlat(v.root, v.key);
  const ledgerIn = (st, x, di, w) => { ctx.strokeStyle = 'rgba(238,240,242,.7)'; for (let d = st.base - 2; d >= di; d -= 2) { const y = Math.round(yOfIn(st, d)) + 0.5; ctx.beginPath(); ctx.moveTo(x - sp * 0.35, y); ctx.lineTo(x + w + sp * 0.35, y); ctx.stroke(); } for (let d = st.base + 10; d <= di; d += 2) { const y = Math.round(yOfIn(st, d)) + 0.5; ctx.beginPath(); ctx.moveTo(x - sp * 0.35, y); ctx.lineTo(x + w + sp * 0.35, y); ctx.stroke(); } };
  const drawAcc = (acc, x, y, col) => { if (!acc) return 0; const g = acc > 0 ? GLY.sharp : GLY.flat; ctx.fillStyle = col; glyphFill(ctx, g, x - g.w * gs - 2.5, y, gs); return g.w * gs + 2.5; };
  if (lineMode) { const st = staves[0]; drawLine(ctx, left, W, sp, gs, di => yOfIn(st, di), (x, di, w) => ledgerIn(st, x, di, w), drawAcc); return; }
  const chords = drill.chords.map((v, i) => ({v, i})).filter(c => !((drill.stage === 4 || (drill.stage === 6 && drill.level === 1)) && c.i === 0));
  const colW = (W - left - 10) / chords.length;
  chords.forEach((c, k) => {
    const v = c.v, flats = flatsOf(v), cx = left + colW * k + colW * 0.5 - GLY.headW.w * gs * 0.5;
    ctx.fillStyle = '#E6B24D'; ctx.font = '700 12px system-ui'; ctx.textAlign = 'left'; ctx.fillText(v.symbol === '…' ? '' : (v.symbol || ''), cx - sp, staves[0].top - sp * 1.6);
    const notes = v.voices.map((x, vi) => { const sp_ = spell(x.midi, v.root, x.iv, flats); return {midi: x.midi, di: diatonicIndex(x.midi, sp_), acc: sp_.acc, vi, target: drill.target && drill.target.chord === c.i && drill.target.voice === vi}; });
    if (v.bass !== undefined) { const sp_ = spell(v.bass, v.root, 0, flats); notes.push({midi: v.bass, di: diatonicIndex(v.bass, sp_), acc: sp_.acc, vi: -1, bass: true}); }
    notes.forEach(n => { n.st = n.midi >= 60 ? staves[0] : staves[1]; });
    notes.sort((a, b) => a.midi - b.midi);
    let prevDi = null, prevSt = null, side = 0;
    notes.forEach(n => { side = (prevDi !== null && prevSt === n.st && n.di - prevDi === 1) ? (side ? 0 : 1) : 0; n.dx = side ? GLY.headW.w * gs - 1 : 0; prevDi = n.di; prevSt = n.st; });
    let lvl = 0; notes.forEach(n => { if (n.acc) { n.ax = lvl; lvl = (lvl + 1) % 2; } });
    const accShift = notes.some(n => n.acc) ? sp * 0.8 : 0;
    notes.forEach(n => {
      const y = yOfIn(n.st, n.di), col = n.target ? '#E6B24D' : n.bass ? 'rgba(238,240,242,.55)' : '#EEF0F2';
      const hx = cx + accShift + n.dx;
      ledgerIn(n.st, hx, n.di, GLY.headW.w * gs);
      ctx.fillStyle = col; glyphFill(ctx, GLY.headW, hx, y, gs);
      if (n.acc) drawAcc(n.acc, cx + accShift - n.ax * sp * 1.3, y, col);
    });
  });
}
function drawLine(ctx, left, W, sp, gs, yOf, ledger, drawAcc) {
  const items = drill.line, key = drill.key; const totalE = items.reduce((a, x) => a + x.len, 0);
  const slotW = (W - left - 12) / totalE; const beat = 2;
  const flats = key !== undefined ? rootIsFlat(0, key) : true;
  const chords = drill.chords; const barsOf = ci => (ci === chords.length - 1 && chords.length === 3) ? 2 : 1;
  let t = 0, ci = 0, barStart = 0;
  // chord symbols and bar lines
  let x = left; ctx.font = '700 12px system-ui'; ctx.textAlign = 'left';
  chords.forEach((v, i) => { ctx.fillStyle = '#E6B24D'; ctx.fillText(v.symbol, x + 2, yOf(30) - 4 * sp - sp * 2.4); const bx = Math.round(x) + 0.5; if (i > 0) { ctx.strokeStyle = 'rgba(238,240,242,.7)'; ctx.beginPath(); ctx.moveTo(bx, yOf(38)); ctx.lineTo(bx, yOf(30)); ctx.stroke(); } x += barsOf(i) * 8 * slotW; });
  ctx.strokeStyle = 'rgba(238,240,242,.7)'; ctx.beginPath(); ctx.moveTo(Math.round(W - 12) + 0.5, yOf(38)); ctx.lineTo(Math.round(W - 12) + 0.5, yOf(30)); ctx.stroke();
  const drawn = [];
  items.forEach((n, idx) => {
    const x0 = left + t * slotW + sp * 0.6;
    if (n.rest) { const g = n.len >= 4 ? GLY.rH : n.len === 2 ? GLY.rQ : GLY.r8; ctx.fillStyle = '#EEF0F2'; glyphFill(ctx, g, x0, yOf(34), gs); t += n.len; return; }
    const v = chords[n.chord];
    let sp_ = spell(n.midi, v.root, n.chrom ? null : n.iv, flats);
    if (n.chrom) { const next = items[idx + 1]; const up = next && !next.rest ? next.midi > n.midi : true; sp_ = spell(n.midi, v.root, null, !up); }
    const di = diatonicIndex(n.midi, sp_), y = yOf(di), up = di < 34;
    const g = n.len >= 4 ? GLY.headH : GLY.headB, hw = g.w * gs;
    ledger(x0, di, hw);
    ctx.fillStyle = '#EEF0F2'; glyphFill(ctx, g, x0, y, gs); drawAcc(sp_.acc, x0, y, '#EEF0F2');
    const sx = up ? x0 + hw - 0.6 : x0 + 0.6; const stemEnd = up ? y - sp * 3.4 : y + sp * 3.4;
    drawn.push({n, t, x0, sx, y, up, stemEnd, hw});
    t += n.len;
  });
  // stems, beams and flags
  ctx.fillStyle = '#EEF0F2';
  const groups = []; let cur = [];
  drawn.forEach(d => { if (d.n.len === 1 && (cur.length === 0 || (Math.floor(d.t / beat) === Math.floor(cur[0].t / beat)))) cur.push(d); else { if (cur.length) groups.push(cur); cur = d.n.len === 1 ? [d] : []; if (d.n.len > 1) groups.push([d]); } });
  if (cur.length) groups.push(cur);
  groups.forEach(gr => {
    const up = gr[0].up; const end = up ? Math.min(...gr.map(d => d.stemEnd)) : Math.max(...gr.map(d => d.stemEnd));
    gr.forEach(d => { const sx = up ? d.x0 + d.hw - 0.6 : d.x0 + 0.6; ctx.fillRect(sx - 0.6, up ? end : d.y, 1.2, Math.abs(d.y - end)); d.sx = sx; });
    if (gr.length > 1 && gr[0].n.len === 1) { const x0 = gr[0].sx - 0.6, x1 = gr[gr.length - 1].sx + 0.6; ctx.fillRect(x0, up ? end : end - sp * 0.5, x1 - x0, sp * 0.5); }
    else if (gr.length === 1 && gr[0].n.len === 1) { const d = gr[0]; glyphFill(ctx, GLY.flag8, d.sx - 0.6, end, gs, !up); }
  });
}

/* ================= settings ================= */
function renderSettings() {
  const el = $('settings');
  const seg = (id, opts, cur) => `<div class="seg" data-set="${id}">${opts.map(o => `<button data-v="${o[0]}" class="${String(cur) === String(o[0]) ? 'sel' : ''}">${o[1]}</button>`).join('')}</div>`;
  el.innerHTML = `
  <div class="set"><div class="k">Sound<small>Piano is sampled; guitar and warm are modelled</small></div>${seg('sound', [['piano', 'Piano'], ['guitar', 'Guitar'], ['warm', 'Warm']], S.sound)}</div>
  <div class="set"><div class="k">Mic sensitivity<small>1 needs a strong voice, 10 hears a whisper</small></div><input type="range" min="1" max="10" id="sens" value="${S.sens}"></div>
  <div class="set"><div class="k">Pitch tolerance<small>Relaxed ±35 cents, strict ±20</small></div>${seg('tol', [['relaxed', 'Relaxed'], ['strict', 'Strict']], S.tol)}</div>
  <div class="set"><div class="k">Octave<small>Auto accepts the note in any octave</small></div>${seg('octave', [['auto', 'Auto'], ['strict', 'Strict']], S.octave)}</div>
  <div class="set"><div class="k">Sing over the chord<small>Needs headphones — through a speaker the chord swamps the mic</small></div>${seg('over', [['false', 'Chord, then silence'], ['true', 'Keep it sounding']], S.over)}</div>
  <div class="set"><div class="k">Unlock all stages<small>Teacher switch; stages otherwise open after ${UNLOCK_AT} correct in the one before</small></div>${seg('unlockAll', [['false', 'Off'], ['true', 'On']], S.unlockAll)}</div>
  <div class="set"><div class="k">Progress<small>Levels, streaks and unlocks on this device</small></div><button class="btn small" id="bReset">Reset progress</button></div>
  <div class="foot">Notation is on a treble and bass pair at sounding pitch.</div>`;
  el.querySelectorAll('.seg').forEach(sg => sg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const k = sg.dataset.set; let v = b.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; S[k] = v; saveS(); [...sg.children].forEach(x => x.classList.toggle('sel', x === b)); if (k === 'unlockAll') { renderStages(); updateTeacherUI(); } if (k === 'tol') { const z = $('tZone'); if (z) { const w = tolCents() / 50 * 42; z.style.left = (50 - w) + '%'; z.style.width = (2 * w) + '%'; } } }));
  $('sens').addEventListener('input', e => { S.sens = +e.target.value; saveS(); });
  $('bReset').addEventListener('click', () => { if (!confirm('Reset all Inner Ear progress on this device?')) return; for (let i = 1; i <= 8; i++) { P.level[i] = 1; P.best[i] = 0; P.correct[i] = 0; P.streak[i] = 0; } saveP(); stage = 1; renderStages(); newDrill(); toast('Progress reset'); });
}

/* ================= wiring ================= */
$('bPlay').addEventListener('click', () => { if (play.active) { stopPlayback(); return; } if (task === 'sing' && sing.active) { toast('Finish the singing round first, or press ■'); return; } playContext(drill); });
$('bStop').addEventListener('click', () => { stopPlayback(); if (sing.active && !answered) { sing.active = false; sing.listening = false; $('bSingStart').disabled = false; $('bSingTap').disabled = true; sing.i = 0; updateSteps(); const h = $('tHint'); if (h) h.textContent = 'Stopped — press Start to try again'; } });
$('bHalf').addEventListener('click', () => { S.half = !S.half; saveS(); updatePlayUI(); toast(S.half ? 'Half speed' : 'Normal speed'); });
$('bLoop').addEventListener('click', () => { S.loop = !S.loop; updatePlayUI(); if (S.loop && !play.active) playContext(drill); if (!S.loop) stopPlayback(); });
$('bMic').addEventListener('click', micToggle);
function updateTeacherUI() { const b = $('bTeacher'); b.classList.toggle('on', S.unlockAll); b.textContent = S.unlockAll ? 'All unlocked' : 'Unlock all'; }
$('bTeacher').addEventListener('click', () => { S.unlockAll = !S.unlockAll; saveS(); updateTeacherUI(); renderStages(); renderSettings(); toast(S.unlockAll ? 'Teacher switch on — every stage is open' : 'Teacher switch off — stages unlock on progress again'); });
$('bSettings').addEventListener('click', () => { const on = $('cardSettings').style.display !== 'none'; $('cardSettings').style.display = on ? 'none' : ''; $('bSettings').classList.toggle('on', !on); });
$('bNext').addEventListener('click', newDrill);
$('bAgain').addEventListener('click', () => { if (drill.stage === 8) playContext(drill); else if (drill.reveal && drill.reveal.line) { stopPlayback(true); const f = speed(); drill.reveal.line.forEach((m, i) => tone(m, i * 0.75 * f, 0.7 * f, 0.3)); schedule(() => { const ci = stackChordIndex(); playVoicing(drill.chords[ci], 0, 1.6 * f, 0.2); }, drill.reveal.line.length * 0.75 * f + 0.2); } else { stopPlayback(true); const ci = stackChordIndex(); const v = drill.chords[ci]; const f = speed(); if (drill.target && drill.target.chord === ci) { tone(v.voices[drill.target.voice].midi, 0, 0.8 * f, 0.3); schedule(() => playVoicing(v, 0, 1.6 * f, 0.2), 0.9 * f); } else playVoicing(v, 0, 1.6 * f, 0.2); } });
$('tasks').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; task = b.dataset.t; [...$('tasks').children].forEach(x => x.classList.toggle('sel', x === b)); newDrill(); });
[...$('tasks').children].forEach(x => x.classList.toggle('sel', x.dataset.t === task));
$('cardSettings').style.display = 'none';
renderSettings(); renderStages(); newDrill(); updateMicUI(); updateTeacherUI();
window.addEventListener('resize', () => { if (answered) drawScore(); });

</script>
